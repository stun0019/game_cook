<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1717">
<title>灶咖大亂鬥｜Kitchen Clash Café</title>

<style>
:root{
  --ink:#182323;
  --paper:#fff7e7;
  --cream:#f2e1be;
  --caramel:#b66a3c;
  --coral:#db5d4c;
  --sage:#81a99a;
  --mint:#b8d7c9;
  --deep:#27413f;
  --line:#3b2a25;
  --gold:#f5bf55;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0d1515;
  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    system-ui,
    sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
}

#game-wrapper{
  position:relative;

  width:min(
    100vw,
    calc(100vh * 16 / 9)
  );

  height:min(
    100vh,
    calc(100vw * 9 / 16)
  );

  max-width:1280px;
  max-height:720px;

  overflow:hidden;

  background:#142120;
}

#game-canvas{
  display:block;

  width:100%;
  height:100%;

  background:#142120;
}

/* ==================================================
   手機直向提示
================================================== */

#orientation{
  position:absolute;
  inset:0;
  z-index:1000;

  display:none;
  align-items:center;
  justify-content:center;

  padding:28px;

  background:
    radial-gradient(
      circle at center,
      #1d302e,
      #0b1212 72%
    );

  color:white;

  text-align:center;
}

.phone{
  width:64px;
  height:108px;

  margin:0 auto 22px;

  border:4px solid #fff;
  border-radius:14px;

  animation:
    turn 2s ease-in-out infinite;
}

@keyframes turn{
  0%,
  25%{
    transform:rotate(-12deg);
  }

  70%,
  100%{
    transform:rotate(78deg);
  }
}

/* ==================================================
   共用畫面
================================================== */

#loading,
#menu,
#pause,
#result{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* ==================================================
   Loading
================================================== */

#loading{
  z-index:500;

  background:
    radial-gradient(
      circle at 50% 42%,
      #27413f 0,
      #172625 52%,
      #0d1716 100%
    );

  color:white;
}

#loading::before{
  content:"";

  position:absolute;
  inset:0;

  opacity:.14;

  background-image:
    linear-gradient(
      rgba(255,255,255,.06) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.06) 1px,
      transparent 1px
    );

  background-size:52px 52px;

  animation:
    gridMove 12s linear infinite;
}

@keyframes gridMove{
  to{
    background-position:
      52px 52px;
  }
}

.loading-card{
  position:relative;
  z-index:1;

  width:min(76%,620px);

  text-align:center;
}

.brand-ja{
  color:#e9c67a;

  font-size:14px;
  font-weight:800;

  letter-spacing:.38em;
}

.brand-title{
  margin-top:8px;

  font-size:clamp(48px,7vw,86px);
  line-height:1;

  letter-spacing:.08em;

  text-shadow:
    0 7px 0 rgba(0,0,0,.25);
}

.brand-en{
  margin-top:12px;

  color:#b8d7c9;

  font-size:clamp(14px,1.8vw,22px);
  font-weight:800;

  letter-spacing:.34em;
}

.loading-status{
  margin-top:58px;
}

.loading-row{
  display:flex;
  justify-content:space-between;

  gap:20px;

  margin-bottom:12px;

  color:#edf6ef;

  font-size:16px;
}

.track{
  height:16px;

  overflow:hidden;

  background:
    rgba(0,0,0,.34);

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:999px;
}

.bar{
  position:relative;

  width:0;
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #9fc9b8,
      #f2d58c,
      #d87858
    );

  transition:
    width .08s linear;
}

.bar::after{
  content:"";

  position:absolute;
  inset:0 auto 0 -120px;

  width:120px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.65),
      transparent
    );

  animation:
    shine 1.3s linear infinite;
}

@keyframes shine{
  to{
    transform:
      translateX(760px);
  }
}

#enter-btn{
  min-width:240px;

  margin-top:28px;
  padding:14px 28px;

  background:
    linear-gradient(
      #d87558,
      #aa4f3e
    );

  border:
    2px solid rgba(255,255,255,.5);

  border-radius:12px;

  box-shadow:
    0 10px 25px rgba(0,0,0,.28);

  color:white;

  font-size:22px;
  font-weight:900;

  letter-spacing:.12em;

  cursor:pointer;

  opacity:0;
  visibility:hidden;

  transform:
    translateY(14px);

  transition:.35s;
}

#enter-btn.show{
  opacity:1;
  visibility:visible;

  transform:none;
}

/* ==================================================
   首頁
================================================== */

#menu{
  z-index:300;

  background:
    linear-gradient(
      180deg,
      rgba(23,38,37,.10),
      rgba(23,38,37,.42)
    );
}

.menu-panel{
  position:absolute;
  left:7%;
  top:10%;

  width:41%;

  padding:28px 30px 30px;

  background:
    linear-gradient(
      180deg,
      rgba(255,249,234,.96),
      rgba(239,220,179,.96)
    );

  border:
    4px solid rgba(58,42,35,.8);

  border-radius:26px;

  box-shadow:
    0 18px 0 rgba(73,45,35,.45),
    0 34px 70px rgba(0,0,0,.28);
}

.menu-kicker{
  color:#a35a43;

  font-size:14px;
  font-weight:900;

  letter-spacing:.28em;
}

.menu-title{
  margin-top:6px;

  color:#2d4a46;

  font-size:54px;
  line-height:1.05;

  letter-spacing:.05em;
}

.menu-sub{
  margin-top:10px;

  color:#87614f;

  font-weight:800;
  line-height:1.7;
}

.menu-actions{
  display:flex;

  gap:14px;

  margin-top:26px;
}

.menu-btn{
  min-width:190px;

  padding:15px 24px;

  background:
    linear-gradient(
      #e4775d,
      #ba5545
    );

  border:0;
  border-radius:14px;

  box-shadow:
    0 8px 0 #7d3b31;

  color:white;

  font-size:21px;
  font-weight:900;

  cursor:pointer;
}

.menu-btn.secondary{
  min-width:62px;

  background:
    linear-gradient(
      #f8e9c8,
      #d2b88a
    );

  box-shadow:
    0 8px 0 #8c7455;

  color:#4f392e;
}

/* ==================================================
   暫停與結算
================================================== */

#pause,
#result{
  z-index:700;

  display:none;

  background:
    rgba(10,17,17,.66);

  backdrop-filter:
    blur(5px);
}

.overlay-card{
  width:min(72%,650px);

  padding:34px;

  background:
    linear-gradient(
      #fff8e8,
      #ead3a7
    );

  border:
    5px solid #4a3229;

  border-radius:24px;

  box-shadow:
    0 18px 0 #2c1d18,
    0 40px 90px rgba(0,0,0,.4);

  text-align:center;
}

.overlay-card h2{
  margin-bottom:12px;

  color:#a94f3f;

  font-size:44px;
}

.overlay-card p{
  color:#60483c;

  font-weight:800;
  line-height:1.7;
}

.overlay-actions{
  display:flex;
  justify-content:center;

  gap:14px;

  margin-top:24px;
}

/* ==================================================
   手機操作
================================================== */

#touch-controls{
  position:absolute;
  inset:0;
  z-index:250;

  pointer-events:none;
}

#joystick-zone{
  position:absolute;
  left:24px;
  bottom:22px;

  width:154px;
  height:154px;

  pointer-events:auto;
}

#joystick-base{
  position:absolute;
  inset:0;

  background:
    rgba(20,40,38,.42);

  border:
    4px solid rgba(255,255,255,.58);

  border-radius:50%;

  box-shadow:
    inset 0 0 0 9px rgba(255,255,255,.07);
}

#joystick-stick{
  position:absolute;
  left:50%;
  top:50%;

  width:72px;
  height:72px;

  background:
    linear-gradient(
      #f9e9c9,
      #c79b67
    );

  border:
    4px solid #51382d;

  border-radius:50%;

  box-shadow:
    0 7px 0 rgba(68,45,36,.5);

  transform:
    translate(-50%,-50%);
}

#action-zone{
  position:absolute;
  right:28px;
  bottom:28px;

  display:flex;
  align-items:flex-end;

  gap:16px;

  pointer-events:auto;
}

.action-btn{
  width:104px;
  height:104px;

  background:
    linear-gradient(
      #ef7a61,
      #b64f41
    );

  border:
    5px solid rgba(255,255,255,.7);

  border-radius:50%;

  box-shadow:
    0 9px 0 #73372f;

  color:white;

  font-size:20px;
  font-weight:1000;

  letter-spacing:.08em;
}

.action-btn.secondary{
  width:76px;
  height:76px;

  background:
    linear-gradient(
      #f0d8a6,
      #be986a
    );

  box-shadow:
    0 8px 0 #755b42;

  color:#3c2c25;
}

.desktop-help{
  position:absolute;
  left:50%;
  bottom:14px;
  z-index:230;

  padding:8px 14px;

  background:
    rgba(255,248,231,.88);

  border:
    2px solid rgba(65,45,38,.7);

  border-radius:12px;

  color:#4f392e;

  font-size:14px;
  font-weight:900;

  pointer-events:none;

  transform:
    translateX(-50%);
}

@media (pointer:fine){
  #touch-controls{
    display:none;
  }
}

@media (pointer:coarse){
  .desktop-help{
    display:none;
  }
}

@media (orientation:portrait) and (max-width:900px){
  #orientation{
    display:flex;
  }
}
</style>
</head>

<body>

<main id="game-wrapper">

  <canvas
    id="game-canvas"
    width="1280"
    height="720"
    aria-label="灶咖大亂鬥遊戲畫面"
  ></canvas>

  <section id="orientation">
    <div>
      <div class="phone"></div>

      <h2>
        請將手機轉為橫向
      </h2>

      <p>
        橫向模式可獲得最佳遊戲體驗
      </p>
    </div>
  </section>

  <section id="loading">
    <div class="loading-card">

      <div class="brand-ja">
        キッチン大騒動
      </div>

      <div class="brand-title">
        灶咖大亂鬥
      </div>

      <div class="brand-en">
        KITCHEN CLASH CAFÉ
      </div>

      <div class="loading-status">

        <div class="loading-row">
          <span id="loading-message">
            正在準備咖啡廳……
          </span>

          <span id="loading-number">
            0%
          </span>
        </div>

        <div class="track">
          <div
            id="loading-bar"
            class="bar"
          ></div>
        </div>

        <button
          id="enter-btn"
          type="button"
        >
          進入咖啡廳
        </button>

      </div>
    </div>
  </section>

  <section id="menu">
    <div class="menu-panel">

      <div class="menu-kicker">
        SUNNY PAW CAFÉ
      </div>

      <div class="menu-title">
        灶咖大亂鬥
      </div>

      <div class="menu-sub">
        午餐尖峰即將開始。依照訂單備料、烹調、
        組裝並出餐，在客人失去耐心前完成更多餐點。
      </div>

      <div class="menu-actions">

        <button
          id="start-btn"
          class="menu-btn"
          type="button"
        >
          開始營業
        </button>

        <button
          id="help-btn"
          class="menu-btn secondary"
          type="button"
        >
          ?
        </button>

      </div>
    </div>
  </section>

  <section id="pause">
    <div class="overlay-card">

      <h2>
        暫停營業
      </h2>

      <p>
        時間與訂單耐心已暫停。
      </p>

      <div class="overlay-actions">

        <button
          id="resume-btn"
          class="menu-btn"
          type="button"
        >
          繼續營業
        </button>

        <button
          id="pause-home-btn"
          class="menu-btn secondary"
          type="button"
        >
          首頁
        </button>

      </div>
    </div>
  </section>

  <section id="result">
    <div class="overlay-card">

      <h2 id="result-title">
        營業結束
      </h2>

      <p id="result-summary">
        今日營業告一段落。
      </p>

      <div class="overlay-actions">

        <button
          id="retry-btn"
          class="menu-btn"
          type="button"
        >
          再玩一次
        </button>

        <button
          id="result-home-btn"
          class="menu-btn secondary"
          type="button"
        >
          首頁
        </button>

      </div>
    </div>
  </section>

  <div id="touch-controls">

    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <div id="action-zone">

      <button
        id="discard-btn"
        class="action-btn secondary"
        type="button"
      >
        丟棄
      </button>

      <button
        id="interact-btn"
        class="action-btn"
        type="button"
      >
        互動
      </button>

    </div>
  </div>

  <div class="desktop-help">
    WASD／方向鍵移動　E／空白鍵互動　Q 丟棄　Esc 暫停
  </div>

</main>

<script>
(() => {
  "use strict";

  const canvas =
    document.getElementById("game-canvas");

  const ctx =
    canvas.getContext("2d");

  const loading =
    document.getElementById("loading");

  const menu =
    document.getElementById("menu");

  const pause =
    document.getElementById("pause");

  const result =
    document.getElementById("result");

  const touchControls =
    document.getElementById("touch-controls");

  const W = 1280;
  const H = 720;

  const COLORS = {
    ink:"#182323",
    paper:"#fff7e7",
    cream:"#f2e1be",
    caramel:"#b66a3c",
    coral:"#db5d4c",
    sage:"#81a99a",
    mint:"#b8d7c9",
    deep:"#27413f",
    line:"#3b2a25",
    gold:"#f5bf55",
    floor:"#d9c394",
    wall:"#9dc5b8"
  };

  const state = {
    screen:"menu",

    running:false,
    paused:false,

    time:60,

    score:0,
    served:0,
    combo:0,
    bestCombo:0,

    held:null,

    pan:null,
    panTimer:0,

    prep:[],

    orders:[],
    orderSpawn:0,

    chef:{
      x:640,
      y:470,
      vx:0,
      vy:0,
      dir:"down"
    },

    keys:{},

    joy:{
      x:0,
      y:0
    },

    nearest:null,

    last:
      performance.now(),

    toast:"",
    toastTime:0
  };

  const stations = [
    {
      id:"bun",
      x:180,
      y:210,
      w:120,
      h:90,
      label:"麵包",
      icon:"bun"
    },

    {
      id:"lettuce",
      x:330,
      y:210,
      w:120,
      h:90,
      label:"生菜",
      icon:"lettuce"
    },

    {
      id:"meat",
      x:480,
      y:210,
      w:120,
      h:90,
      label:"肉排",
      icon:"meat"
    },

    {
      id:"pan",
      x:830,
      y:210,
      w:130,
      h:90,
      label:"煎台",
      icon:"pan"
    },

    {
      id:"drink",
      x:990,
      y:210,
      w:120,
      h:90,
      label:"飲料",
      icon:"drink"
    },

    {
      id:"assembly",
      x:140,
      y:425,
      w:140,
      h:105,
      label:"組裝",
      icon:"plate"
    },

    {
      id:"serve",
      x:1000,
      y:425,
      w:140,
      h:105,
      label:"出餐",
      icon:"bell"
    },

    {
      id:"trash",
      x:570,
      y:590,
      w:140,
      h:80,
      label:"丟棄",
      icon:"trash"
    }
  ];

  const recipes = [
    {
      name:"經典漢堡",
      type:"burger",
      items:[
        "bun",
        "cooked"
      ]
    },

    {
      name:"生菜漢堡",
      type:"greenBurger",
      items:[
        "bun",
        "lettuce",
        "cooked"
      ]
    },

    {
      name:"冰飲",
      type:"drink",
      items:[
        "drink"
      ]
    }
  ];

  function roundedRect(
    x,
    y,
    w,
    h,
    r,
    fill,
    stroke,
    line = 1
  ){
    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      w,
      h,
      r
    );

    if(fill){
      ctx.fillStyle =
        fill;

      ctx.fill();
    }

    if(stroke){
      ctx.strokeStyle =
        stroke;

      ctx.lineWidth =
        line;

      ctx.stroke();
    }
  }

  function text(
    content,
    x,
    y,
    size,
    color,
    align = "left",
    weight = 700
  ){
    ctx.fillStyle =
      color;

    ctx.font =
      `${weight} ${size}px "Microsoft JhengHei", sans-serif`;

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      content,
      x,
      y
    );
  }

  function drawIcon(
    type,
    x,
    y,
    scale = 1
  ){
    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.scale(
      scale,
      scale
    );

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    ctx.strokeStyle =
      COLORS.line;

    ctx.lineWidth =
      4;

    if(type === "bun"){
      ctx.fillStyle =
        "#e9b96e";

      ctx.beginPath();

      ctx.roundRect(
        -30,
        -19,
        60,
        38,
        16
      );

      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle =
        "#c88947";

      ctx.lineWidth =
        3;

      [-14,0,14].forEach(value => {
        ctx.beginPath();

        ctx.moveTo(
          value - 5,
          -7
        );

        ctx.lineTo(
          value + 4,
          4
        );

        ctx.stroke();
      });
    }

    else if(type === "lettuce"){
      ctx.fillStyle =
        "#79ad6e";

      ctx.beginPath();

      ctx.moveTo(
        -28,
        10
      );

      ctx.bezierCurveTo(
        -24,
        -28,
        -4,
        -20,
        0,
        -32
      );

      ctx.bezierCurveTo(
        7,
        -18,
        26,
        -28,
        29,
        7
      );

      ctx.bezierCurveTo(
        12,
        26,
        -13,
        25,
        -28,
        10
      );

      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle =
        "#4f7f52";

      ctx.lineWidth =
        3;

      ctx.beginPath();

      ctx.moveTo(
        0,
        -25
      );

      ctx.lineTo(
        0,
        19
      );

      ctx.stroke();
    }

    else if(
      type === "meat" ||
      type === "cooked"
    ){
      ctx.fillStyle =
        type === "meat"
          ? "#c8544f"
          : "#8d5c42";

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        31,
        22,
        -.2,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle =
        type === "meat"
          ? "#f2b2aa"
          : "#c58a66";

      ctx.lineWidth =
        3;

      ctx.beginPath();

      ctx.moveTo(
        -16,
        -5
      );

      ctx.bezierCurveTo(
        -6,
        -16,
        9,
        -14,
        17,
        -4
      );

      ctx.stroke();
    }

    else if(type === "pan"){
      ctx.fillStyle =
        "#33413f";

      ctx.beginPath();

      ctx.arc(
        -5,
        0,
        24,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        17,
        13
      );

      ctx.lineTo(
        39,
        31
      );

      ctx.strokeStyle =
        COLORS.line;

      ctx.lineWidth =
        8;

      ctx.stroke();

  function nearestStation(){
    let best =
      null;

    let distance =
      Infinity;

    stations.forEach(station => {
      const deltaX =
        state.chef.x -
        (
          station.x +
          station.w / 2
        );

      const deltaY =
        state.chef.y -
        (
          station.y +
          station.h / 2
        );

      const currentDistance =
        Math.hypot(
          deltaX,
          deltaY
        );

      if(currentDistance < distance){
        distance =
          currentDistance;

        best =
          station;
      }
    });

    return distance < 135
      ? best
      : null;
  }

  function toast(message){
    state.toast =
      message;

    state.toastTime =
      1.4;
  }

  function interact(){
    if(
      !state.running ||
      state.paused
    ){
      return;
    }

    const station =
      nearestStation();

    if(!station){
      toast(
        "再靠近工作台一點"
      );

      return;
    }

    if(
      [
        "bun",
        "lettuce",
        "meat",
        "drink"
      ].includes(station.id)
    ){
      if(state.held){
        toast(
          "手上已經有食材"
        );

        return;
      }

      state.held =
        station.id === "meat"
          ? "meat"
          : station.id;

      toast(
        `已拿取${station.label}`
      );
    }

    else if(station.id === "pan"){
      if(state.held === "meat"){
        state.held =
          null;

        state.pan =
          "cooking";

        state.panTimer =
          2.5;

        toast(
          "肉排開始烹調"
        );
      }

      else if(state.pan === "done"){
        state.held =
          "cooked";

        state.pan =
          null;

        toast(
          "已拿起熟肉排"
        );
      }

      else{
        toast(
          state.pan === "cooking"
            ? "肉排還在烹調"
            : "需要先放入生肉排"
        );
      }
    }

    else if(station.id === "assembly"){
      if(
        [
          "bun",
          "lettuce",
          "cooked"
        ].includes(state.held)
      ){
        state.prep.push(
          state.held
        );

        state.held =
          null;

        const ingredientSet =
          new Set(
            state.prep
          );

        if(
          ingredientSet.has("bun") &&
          ingredientSet.has("cooked")
        ){
          state.held =
            ingredientSet.has("lettuce")
              ? "greenBurger"
              : "burger";

          state.prep =
            [];

          toast(
            "餐點組裝完成"
          );
        }
        else{
          toast(
            "食材已放上組裝台"
          );
        }
      }
      else{
        toast(
          "這項食材不能在此組裝"
        );
      }
    }

    else if(station.id === "serve"){
      const order =
        state.orders[0];

      if(
        order &&
        state.held === order.type
      ){
        const earnedScore =
          Math.round(
            120 +
            order.patience +
            state.combo * 25
          );

        state.score +=
          earnedScore;

        state.served +=
          1;

        state.combo +=
          1;

        state.bestCombo =
          Math.max(
            state.bestCombo,
            state.combo
          );

        state.held =
          null;

        state.orders.shift();

        addOrder();

        toast(
          `出餐成功 +${earnedScore}`
        );
      }
      else{
        state.combo =
          0;

        state.score =
          Math.max(
            0,
            state.score - 40
          );

        toast(
          "餐點與目前訂單不符"
        );
      }
    }

    else if(station.id === "trash"){
      discard();
    }
  }

  function discard(){
    if(
      state.held ||
      state.prep.length
    ){
      state.held =
        null;

      state.prep =
        [];

      toast(
        "已丟棄手上內容"
      );
    }
    else{
      toast(
        "目前沒有可丟棄的內容"
      );
    }
  }

  function loop(now){
    if(!state.running){
      return;
    }

    const deltaTime =
      Math.min(
        .033,
        (
          now -
          state.last
        ) /
        1000
      );

    state.last =
      now;

    if(!state.paused){
      let movementX =
        state.joy.x;

      let movementY =
        state.joy.y;

      if(
        state.keys.ArrowLeft ||
        state.keys.a
      ){
        movementX -=
          1;
      }

      if(
        state.keys.ArrowRight ||
        state.keys.d
      ){
        movementX +=
          1;
      }

      if(
        state.keys.ArrowUp ||
        state.keys.w
      ){
        movementY -=
          1;
      }

      if(
        state.keys.ArrowDown ||
        state.keys.s
      ){
        movementY +=
          1;
      }

      const movementLength =
        Math.hypot(
          movementX,
          movementY
        );

      if(movementLength > 1){
        movementX /=
          movementLength;

        movementY /=
          movementLength;
      }

      state.chef.x =
        Math.max(
          315,
          Math.min(
            965,
            state.chef.x +
            movementX *
            250 *
            deltaTime
          )
        );

      state.chef.y =
        Math.max(
          330,
          Math.min(
            550,
            state.chef.y +
            movementY *
            250 *
            deltaTime
          )
        );

      state.nearest =
        nearestStation()?.id ||
        null;

      state.time -=
        deltaTime;

      state.orderSpawn +=
        deltaTime;

      state.orders.forEach(
        (order,index) => {
          order.patience -=
            deltaTime *
            (
              index === 0
                ? 4.5
                : 2.2
            );
        }
      );

      if(
        state.orders[0]
          ?.patience <= 0
      ){
        state.orders.shift();

        state.combo =
          0;

        state.score =
          Math.max(
            0,
            state.score - 60
          );

        addOrder();

        toast(
          "客人等不及離開了"
        );
      }

      if(
        state.orderSpawn > 11 &&
        state.orders.length < 3
      ){
        state.orderSpawn =
          0;

        addOrder();
      }

      if(state.pan === "cooking"){
        state.panTimer -=
          deltaTime;

        if(state.panTimer <= 0){
          state.pan =
            "done";

          toast(
            "肉排烹調完成"
          );
        }
      }

      if(state.toastTime > 0){
        state.toastTime -=
          deltaTime;
      }

      if(state.time <= 0){
        endGame();

        return;
      }
    }

    render();

    requestAnimationFrame(
      loop
    );
  }

  function endGame(){
    state.running =
      false;

    touchControls.style.display =
      "none";

    document
      .getElementById(

  }

    render();
  }

  document
    .getElementById(
      "start-btn"
    )
    .onclick =
      startGame;

  document
    .getElementById(
      "retry-btn"
    )
    .onclick =
      startGame;

  document
    .getElementById(
      "pause-home-btn"
    )
    .onclick =
      goHome;

  document
    .getElementById(
      "result-home-btn"
    )
    .onclick =
      goHome;

  document
    .getElementById(
      "resume-btn"
    )
    .onclick =
      () => {
        state.paused =
          false;

        pause.style.display =
          "none";

        state.last =
          performance.now();
      };

  document
    .getElementById(
      "help-btn"
    )
    .onclick =
      () => {
        alert(
          "依照訂單拿取食材。肉排需要先放入煎台，完成後送到組裝台，最後前往出餐口。"
        );
      };

  document
    .getElementById(
      "interact-btn"
    )
    .onclick =
      interact;

  document
    .getElementById(
      "discard-btn"
    )
    .onclick =
      discard;

  window.addEventListener(
    "keydown",
    event => {
      state.keys[event.key] =
        true;

      if(
        [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          " ",
          "e",
          "E",
          "q",
          "Q"
        ].includes(event.key)
      ){
        event.preventDefault();
      }

      if(
        (
          event.key === "e" ||
          event.key === "E" ||
          event.key === " "
        ) &&
        !event.repeat
      ){
        interact();
      }

      if(
        (
          event.key === "q" ||
          event.key === "Q"
        ) &&
        !event.repeat
      ){
        discard();
      }

      if(
        event.key === "Escape" &&
        state.running
      ){
        state.paused =
          true;

        pause.style.display =
          "flex";
      }
    }
  );

  window.addEventListener(
    "keyup",
    event => {
      state.keys[event.key] =
        false;
    }
  );

  const joystickZone =
    document.getElementById(
      "joystick-zone"
    );

  const joystickStick =
    document.getElementById(
      "joystick-stick"
    );

  let joystickPointer =
    null;

  function joystickMove(event){
    const rect =
      joystickZone
        .getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;

    let deltaX =
      event.clientX -
      centerX;

    let deltaY =
      event.clientY -
      centerY;

    const maximum =
      rect.width * .29;

    const length =
      Math.hypot(
        deltaX,
        deltaY
      );

    if(length > maximum){
      deltaX =
        deltaX /
        length *
        maximum;

      deltaY =
        deltaY /
        length *
        maximum;
    }

    state.joy.x =
      deltaX /
      maximum;

    state.joy.y =
      deltaY /
      maximum;

    joystickStick.style.transform =
      `translate(
        calc(-50% + ${deltaX}px),
        calc(-50% + ${deltaY}px)
      )`;
  }

  joystickZone.addEventListener(
    "pointerdown",
    event => {
      joystickPointer =
        event.pointerId;

      joystickZone
        .setPointerCapture(
          event.pointerId
        );

      joystickMove(
        event
      );
    }
  );

  joystickZone.addEventListener(
    "pointermove",
    event => {
      if(
        event.pointerId ===
        joystickPointer
      ){
        joystickMove(
          event
        );
      }
    }
  );

  function joystickEnd(event){
    if(
      event.pointerId !==
      joystickPointer
    ){
      return;
    }

    joystickPointer =
      null;

    state.joy.x =
      0;

    state.joy.y =
      0;

    joystickStick.style.transform =
      "translate(-50%,-50%)";
  }

  joystickZone.addEventListener(
    "pointerup",
    joystickEnd
  );

  joystickZone.addEventListener(
    "pointercancel",
    joystickEnd
  );

  async function boot(){
    const steps = [
      "點亮招牌",
      "清點食材",
      "預熱煎台",
      "整理出餐口",
      "準備開門"
    ];

    for(
      let progress = 0;
      progress <= 100;
      progress += 2
    ){
      document
        .getElementById(
          "loading-bar"
        )
        .style
        .width =
          `${progress}%`;

      document
        .getElementById(
          "loading-number"
        )
        .textContent =
          `${progress}%`;

      document
        .getElementById(
          "loading-message"
        )
        .textContent =
          steps[
            Math.min(
              steps.length - 1,
              Math.floor(
                progress / 21
              )
            )
          ];

      await new Promise(resolve => {
        setTimeout(
          resolve,
          progress < 70
            ? 22
            : 32
        );
      });
    }

    document
      .getElementById(
        "loading-message"
      )
      .textContent =
        "準備完成";

    document
      .getElementById(
        "enter-btn"
      )
      .classList
      .add(
        "show"
      );
  }

  document
    .getElementById(
      "enter-btn"
    )
    .onclick =
      () => {
        loading.style.display =
          "none";

        menu.style.display =
          "flex";

        touchControls.style.display =
          "none";

        render();
      };

  menu.style.display =
    "none";

  touchControls.style.display =
    "none";

  render();
  boot();
})();
</script>

</body>
</html>
