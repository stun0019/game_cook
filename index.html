<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>灶腳大亂鬥｜單人試玩</title>
  <style>
    :root{--cream:#fff4cf;--brown:#3b241d;--red:#ee5c46;--yellow:#ffd75e;--green:#66c77a;--blue:#71c9db}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172a2a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--brown)}
    button{font:inherit;color:inherit}
    #rotate{display:none;position:fixed;inset:0;z-index:99;background:#193130;color:white;align-items:center;justify-content:center;text-align:center;padding:32px}
    #rotate b{display:block;font-size:64px;animation:turn 1.8s infinite}.rotate-card{font-size:18px;font-weight:900;line-height:1.7}
    @keyframes turn{50%{transform:rotate(90deg)}}
    .shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#315452,#172a2a 72%)}
    .game{position:relative;width:min(100vw,177.777vh);height:min(100vh,56.25vw);min-width:680px;min-height:383px;overflow:hidden;background:#f5d889;box-shadow:0 0 60px #081414}
    .hud{position:absolute;left:0;right:0;top:0;height:14%;z-index:20;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:1.2%;align-items:center;padding:1% 2%;background:linear-gradient(#fff8dcf5,#ffe5a8ed);border-bottom:.6vh solid #7d4c31;box-shadow:0 .7vh 0 #3e251b44}
    .logo{font-size:clamp(15px,2.15vw,30px);line-height:1;font-weight:1000;color:#f0533f;text-shadow:0 .22vh #fff,0 .45vh #74352b}.logo small{display:block;font-size:.43em;margin-top:.45em;color:#6c4938;letter-spacing:.18em;text-shadow:none}
    .orders{display:flex;gap:2%;height:86%;justify-content:center}.ticket{position:relative;width:30%;padding:.55vh .5vw;background:#fff;border:.35vh solid #d99b4d;border-radius:.8vh;box-shadow:0 .5vh 0 #9a6339;text-align:center}.ticket::before{content:"";position:absolute;left:10%;right:10%;top:-.65vh;border-top:.55vh dotted #835032}.ticket.next{opacity:.58;transform:scale(.92)}.ticket-title{font-size:clamp(8px,1vw,14px);font-weight:900;color:#925033}.ticket-items{font-size:clamp(15px,2.4vw,34px);line-height:1.15}.patience{height:.7vh;min-height:4px;background:#eadac0;border-radius:9px;overflow:hidden}.patience i{display:block;width:100%;height:100%;background:var(--green);transition:width .2s linear}
    .stats{display:flex;gap:.6vw;justify-content:flex-end}.pill{min-width:5.7vw;padding:.65vh .7vw;background:white;border:.3vh solid #b97942;border-radius:999px;font-weight:1000;font-size:clamp(11px,1.45vw,20px);text-align:center;box-shadow:0 .35vh 0 #82502f}.pill.time.danger{color:#d63830;animation:pulse .55s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
    .kitchen{position:absolute;inset:14% 0 0;background-color:#d5b582;background-image:linear-gradient(45deg,#caa873 25%,transparent 25%),linear-gradient(-45deg,#caa873 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#caa873 75%),linear-gradient(-45deg,transparent 75%,#caa873 75%);background-size:6vh 6vh;background-position:0 0,0 3vh,3vh -3vh,-3vh 0}
    .counter{position:absolute;display:grid;place-items:center;background:linear-gradient(135deg,#8eb6bd,#67929c);border:.65vh solid #315967;border-radius:1.3vh;box-shadow:inset 0 .8vh #b9d7d9,0 .8vh 0 #25444c,0 1.4vh 2vh #533a2870;font-size:clamp(24px,4.2vw,58px)}
    .counter .cap{position:absolute;bottom:.2vh;left:5%;right:5%;font-size:clamp(7px,.85vw,12px);font-weight:1000;text-align:center;color:#fff;text-shadow:0 .2vh #263e42;white-space:nowrap}.counter.hot{background:linear-gradient(135deg,#6d6e70,#393d41)}.counter.service{background:linear-gradient(135deg,#e7925a,#c75a45)}.counter.assembly{background:linear-gradient(135deg,#a2be6d,#678c49)}.counter.active{filter:brightness(1.22);outline:.7vh solid #ffe766;outline-offset:.2vh}.counter.active::after{content:"!";position:absolute;right:-1.1vh;top:-1.7vh;width:2.7vh;height:2.7vh;display:grid;place-items:center;border-radius:50%;background:#ffe15a;border:.35vh solid #663c25;font-weight:1000;font-size:1.7vh;animation:bob .55s infinite alternate}@keyframes bob{to{transform:translateY(-.5vh)}}
    #bun{left:2%;top:4%;width:12%;height:23%}#tomato{left:2%;top:32%;width:12%;height:23%}#meat{left:2%;top:60%;width:12%;height:23%}#board{left:22%;top:4%;width:14%;height:20%}#pan{left:43%;top:4%;width:14%;height:20%}#assembly{right:22%;top:4%;width:14%;height:20%}#service{right:2%;top:4%;width:12%;height:39%}#bin{right:2%;bottom:5%;width:12%;height:22%}
    .island{position:absolute;left:25%;right:25%;bottom:7%;height:18%;background:linear-gradient(#94b9bd,#628a92);border:.65vh solid #315967;border-radius:1.2vh;box-shadow:inset 0 .7vh #bfdbdc,0 .8vh 0 #294954}.island::after{content:"單人備餐區";position:absolute;inset:0;display:grid;place-items:center;color:#42616a;font-weight:1000;font-size:clamp(12px,1.5vw,21px)}
    .station-progress{position:absolute;left:10%;right:10%;bottom:2.7vh;height:1vh;border:.25vh solid #fff;border-radius:1vh;background:#433;overflow:hidden;display:none}.station-progress.show{display:block}.station-progress i{display:block;height:100%;width:0;background:#ffd84e}.station-item{position:absolute;right:7%;top:5%;font-size:.5em;filter:drop-shadow(0 .3vh .2vh #0005)}
    .chef{position:absolute;left:48%;top:48%;width:6.6vw;height:8.3vw;min-width:48px;min-height:60px;max-width:92px;max-height:116px;transform:translate(-50%,-58%);z-index:12;transition:filter .15s;filter:drop-shadow(0 1.1vh .5vh #51351f70)}.chef-body{position:absolute;left:18%;right:18%;top:42%;bottom:0;border-radius:45% 45% 35% 35%;background:#f45742;border:.45vh solid #552d23}.chef-head{position:absolute;left:22%;right:22%;top:20%;height:45%;border-radius:50%;background:#bd7548;border:.45vh solid #552d23;z-index:2}.chef-head::before{content:"• ᴗ •";position:absolute;inset:0;display:grid;place-items:center;font-weight:1000;font-size:clamp(10px,1.3vw,20px)}.chef-hat{position:absolute;left:12%;right:12%;top:0;height:38%;border-radius:50% 50% 20% 20%;background:white;border:.45vh solid #552d23;z-index:3}.chef-hat::before,.chef-hat::after{content:"";position:absolute;top:-32%;width:48%;height:88%;border-radius:50%;background:white;border:.45vh solid #552d23}.chef-hat::before{left:-2%}.chef-hat::after{right:-2%}.held{position:absolute;z-index:5;left:50%;top:-23%;transform:translateX(-50%);font-size:clamp(22px,3.5vw,48px);filter:drop-shadow(0 .3vh .2vh #0005)}
    .hint{position:absolute;z-index:24;left:50%;bottom:2.4%;transform:translateX(-50%);padding:.8vh 1.2vw;border-radius:99px;background:#2b211de8;color:white;font-weight:900;font-size:clamp(10px,1.15vw,16px);pointer-events:none;white-space:nowrap;opacity:.9}
    .controls{position:absolute;inset:0;z-index:30;pointer-events:none}.joystick{position:absolute;left:3%;bottom:4%;width:11.5vw;height:11.5vw;min-width:76px;min-height:76px;max-width:150px;max-height:150px;border-radius:50%;background:#261d1a55;border:.45vh solid #fff8;box-shadow:inset 0 0 2vh #0005;pointer-events:auto;touch-action:none;opacity:.38;transition:opacity .16s ease}.joystick:active{opacity:.72}.stick{position:absolute;width:44%;height:44%;left:28%;top:28%;border-radius:50%;background:linear-gradient(#fff5d6,#ddb87b);border:.45vh solid #75492f;box-shadow:0 .7vh 0 #51301f}
    .actions{position:absolute;right:3.5%;bottom:4%;display:flex;align-items:flex-end;gap:1.4vw;pointer-events:auto}.action{width:8vw;height:8vw;min-width:62px;min-height:62px;max-width:104px;max-height:104px;border-radius:50%;border:.55vh solid #7e392b;background:linear-gradient(#ff8c63,#e85040);box-shadow:0 .8vh 0 #7f3028;color:white;font-weight:1000;font-size:clamp(11px,1.25vw,18px);touch-action:none}.action:active,.action.pressed{transform:translateY(.6vh);box-shadow:0 .2vh 0 #7f3028}.drop{width:5.6vw;height:5.6vw;min-width:48px;min-height:48px;max-width:76px;max-height:76px;background:linear-gradient(#ffe484,#e9af3a);color:#64401f;border-color:#765129}
    .toast{position:absolute;z-index:60;left:50%;top:19%;transform:translate(-50%,-1vh);padding:1vh 1.5vw;border-radius:99px;background:#2b211eee;color:white;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .overlay{position:absolute;inset:0;z-index:80;background:#172724e8;display:none;place-items:center;padding:3vh}.overlay.show{display:grid}.card{width:min(72vw,720px);padding:3.2vh 3vw;border:.7vh solid #74412d;border-radius:3vh;background:linear-gradient(#fff9df,#f9d78e);box-shadow:0 1.4vh 0 #40261d,0 3vh 6vh #0007;text-align:center}.card h1{margin:0;color:#ee563f;font-size:clamp(28px,4.5vw,64px);text-shadow:0 .35vh white,0 .7vh #943a2d}.card p{margin:1.5vh 0;font-size:clamp(12px,1.55vw,22px);font-weight:750;line-height:1.55}.card button{border:.45vh solid #723b2d;border-radius:1.6vh;padding:1.3vh 3vw;background:linear-gradient(#ffe168,#ffad42);box-shadow:0 .7vh 0 #7e3e28;font-size:clamp(15px,2vw,28px);font-weight:1000}.how{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin:2vh 0}.how div{padding:1.2vh .6vw;border-radius:1.2vh;background:#fff9;border:.25vh solid #d7a75e;font-weight:850;font-size:clamp(9px,1vw,15px)}.how b{display:block;font-size:clamp(21px,3vw,42px)}
    @media (orientation:portrait),(max-width:679px){#rotate{display:flex}.game{display:none}}
  </style>
</head>
<body>
<div id="rotate"><div class="rotate-card"><b>📱</b>請將手機橫過來<br><small>本遊戲採用 16:9 橫向畫面</small></div></div>
<main class="shell"><div class="game" id="game">
  <header class="hud">
    <div class="logo">灶腳大亂鬥<small>單人試玩關卡</small></div>
    <div class="orders" id="orders"></div>
    <div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill time">⏱ <span id="time">90</span></div></div>
  </header>
  <section class="kitchen" id="kitchen">
    <div class="counter" id="bun" data-station="bun">🍞<span class="cap">麵包箱</span></div>
    <div class="counter" id="tomato" data-station="tomato">🍅<span class="cap">番茄箱</span></div>
    <div class="counter" id="meat" data-station="meat">🥩<span class="cap">肉排箱</span></div>
    <div class="counter" id="board" data-station="board">🔪<span class="station-item"></span><span class="cap">砧板</span><span class="station-progress"><i></i></span></div>
    <div class="counter hot" id="pan" data-station="pan">🍳<span class="station-item"></span><span class="cap">煎鍋</span><span class="station-progress"><i></i></span></div>
    <div class="counter assembly" id="assembly" data-station="assembly">🍽️<span class="station-item"></span><span class="cap">組裝台</span></div>
    <div class="counter service" id="service" data-station="service">🔔<span class="cap">出餐口</span></div>
    <div class="counter" id="bin" data-station="bin">🗑️<span class="cap">垃圾桶</span></div>
    <div class="island"></div>
    <div class="chef" id="chef"><div class="chef-hat"></div><div class="chef-head"></div><div class="chef-body"></div><div class="held" id="held"></div></div>
  </section>
  <div class="hint" id="hint">靠近工作台，按下「互動」</div>
  <div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><button class="action drop" id="dropBtn">丟棄</button><button class="action" id="actionBtn">互動</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="overlay show" id="start"><div class="card"><h1>灶腳大亂鬥</h1><p>第一天上班！在 90 秒內獨力完成客人的漢堡訂單。</p><div class="how"><div><b>🕹️</b>搖桿移動</div><div><b>🥩🍅</b>取得食材</div><div><b>🔪🍳</b>切菜煎肉</div><div><b>🍽️🔔</b>組裝送餐</div></div><button id="startBtn">開始營業</button></div></div>
  <div class="overlay" id="result"><div class="card"><h1 id="resultTitle">營業結束</h1><p id="resultText"></p><button id="retryBtn">再玩一次</button></div></div>
</div></main>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const icons={bun:'🍞',tomato:'🍅',choppedTomato:'🍅',meat:'🥩',cookedMeat:'🍖',burger:'🍔'};
  const recipes=[['bun','cookedMeat'],['bun','choppedTomato'],['bun','cookedMeat','choppedTomato']];
  const state={running:false,time:90,score:0,served:0,held:null,heldRecipe:null,plate:[],orders:[],pos:{x:50,y:54},near:null,keys:{},joy:{x:0,y:0},busy:false};
  const stations={}; let timer,last=performance.now(),joyPointer=null;
  function reset(){Object.assign(state,{running:true,time:90,score:0,served:0,held:null,heldRecipe:null,plate:[],orders:[],pos:{x:50,y:54},near:null,keys:{},joy:{x:0,y:0},busy:false}); $$('.station-item').forEach(x=>{x.textContent='';x.dataset.item=''}); $$('.station-progress').forEach(x=>{x.classList.remove('show');x.firstElementChild.style.transition='none';x.firstElementChild.style.width='0'}); addOrder();addOrder();addOrder();render();clearInterval(timer);timer=setInterval(()=>{if(!state.running)return;state.time--;state.orders[0].patience-=4;if(state.orders[0].patience<=0){state.orders.shift();addOrder();state.score=Math.max(0,state.score-20);say('客人等不及離開了！ -20');}if(state.time<=0)finish();render();},1000)}
  function addOrder(){state.orders.push({items:[...recipes[Math.floor(Math.random()*recipes.length)]],patience:100})}
  function start(){ $('#start').classList.remove('show');$('#result').classList.remove('show');reset() }
  function finish(){state.running=false;clearInterval(timer);const stars=state.score>=500?3:state.score>=280?2:state.score>=120?1:0;$('#resultTitle').textContent=stars?'打烊啦！':'廚房大失控！';$('#resultText').innerHTML=`${'⭐'.repeat(stars)||'☆'}<br>本日得分 <b>${state.score}</b><br>完成 <b>${state.served}</b> 份訂單`;$('#result').classList.add('show')}
  function render(){
    $('#score').textContent=state.score;$('#time').textContent=state.time;$('.time').classList.toggle('danger',state.time<=15);$('#held').textContent=state.held?icons[state.held]:'';
    $('#chef').style.left=state.pos.x+'%';$('#chef').style.top=state.pos.y+'%';
    $('#orders').innerHTML=state.orders.slice(0,3).map((o,i)=>`<div class="ticket ${i?'next':''}"><div class="ticket-title">${i?'等待中':'現在訂單'}</div><div class="ticket-items">🍔 ${o.items.map(x=>icons[x]).join('')}</div><div class="patience"><i style="width:${o.patience}%;background:${o.patience<35?'#e74c3c':o.patience<65?'#f2b63d':'#66c77a'}"></i></div></div>`).join('');
    const plate=$('#assembly .station-item');plate.textContent=state.plate.length?'🍽️'+state.plate.map(x=>icons[x]).join(''):'';
    $$('.counter').forEach(x=>x.classList.toggle('active',x.dataset.station===state.near));
    $('#hint').textContent=hintText();
  }
  function hintText(){if(!state.near)return state.held?`手上拿著 ${icons[state.held]}｜靠近工作台`:'靠近工作台，按下「互動」';const n=state.near;if(n==='bun'||n==='tomato'||n==='meat')return state.held?'手上已有食材':'互動：拿取 '+icons[n];if(n==='board')return state.held==='tomato'?'互動：放下並切番茄':state.held===null&&$('#board .station-item').textContent?'互動：拿起切好的番茄':'砧板只能處理番茄';if(n==='pan')return state.held==='meat'?'互動：放下並煎肉':state.held===null&&$('#pan .station-item').textContent?'互動：拿起煎好的肉排':'煎鍋只能處理生肉';if(n==='assembly'){if(state.held)return '互動：放入組裝台';if(state.plate.includes('bun')&&(state.plate.includes('cookedMeat')||state.plate.includes('choppedTomato')))return '互動：拿起完成餐點';return state.plate.length?'還需要一種處理好的配料':'先放入漢堡材料'}if(n==='service')return state.held==='burger'?'互動：送出餐點':'手持完成的漢堡才能送餐';return '互動：丟棄手上物品'}
  function interact(){if(!state.running||state.busy||!state.near)return;const n=state.near;
    if(['bun','tomato','meat'].includes(n)){if(!state.held){state.held=n;say('拿起 '+icons[n])}else say('手上已經有東西了');render();return}
    if(n==='board'){processStation('board','tomato','choppedTomato',1300);return}
    if(n==='pan'){processStation('pan','meat','cookedMeat',1900);return}
    if(n==='assembly')assemble();
    if(n==='service')serve();
    if(n==='bin')discard();render();
  }
  function processStation(id,input,output,ms){const item=$('#'+id+' .station-item'),bar=$('#'+id+' .station-progress');if(state.held===input&&!item.textContent){state.held=null;state.busy=true;item.textContent=icons[input];bar.classList.add('show');bar.firstElementChild.style.transition=`width ${ms}ms linear`;requestAnimationFrame(()=>bar.firstElementChild.style.width='100%');say(id==='board'?'正在切番茄…':'正在煎肉排…');setTimeout(()=>{item.textContent=icons[output];item.dataset.item=output;bar.classList.remove('show');bar.firstElementChild.style.transition='none';bar.firstElementChild.style.width='0';state.busy=false;say('料理完成，可以拿起來了！');render()},ms)}else if(!state.held&&item.dataset.item===output){state.held=output;item.textContent='';item.dataset.item='';say('拿起 '+icons[output])}else say(input==='tomato'?'需要一顆番茄':'需要一塊生肉');render()}
  function assemble(){if(state.held&&['bun','choppedTomato','cookedMeat'].includes(state.held)){if(state.plate.includes(state.held)){say('這份餐點已經有這個材料');return}state.plate.push(state.held);state.held=null;say('放上組裝台')}else if(!state.held&&state.plate.length){if(state.plate.includes('bun')&&(state.plate.includes('cookedMeat')||state.plate.includes('choppedTomato'))){state.held='burger';state.heldRecipe=[...state.plate];state.plate=[];say('漢堡組裝完成！')}else say('至少需要麵包和一種配料')}else say('把處理好的食材放到這裡');render()}
  function serve(){if(state.held!=='burger'){say('請拿完成的漢堡來出餐');return}const need=state.orders[0].items;const have=state.heldRecipe||[];const ok=need.length===have.length&&need.every(x=>have.includes(x));if(ok){const bonus=Math.round(state.orders[0].patience);state.score+=100+bonus;state.served++;state.orders.shift();addOrder();say(`完美上菜！ +${100+bonus}`)}else{state.score=Math.max(0,state.score-30);say('餐點內容不對！ -30')}state.held=null;state.heldRecipe=null;render()}
  function discard(){if(state.held){state.held=null;state.heldRecipe=null;say('已丟棄手上物品')}else say('手上沒有東西')}
  function say(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),1300)}
  function update(dt){if(state.running){let x=state.joy.x+(state.keys.ArrowRight||state.keys.d?1:0)-(state.keys.ArrowLeft||state.keys.a?1:0),y=state.joy.y+(state.keys.ArrowDown||state.keys.s?1:0)-(state.keys.ArrowUp||state.keys.w?1:0);const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}state.pos.x=Math.max(16,Math.min(84,state.pos.x+x*22*dt));state.pos.y=Math.max(25,Math.min(88,state.pos.y+y*34*dt));detect();render()}requestAnimationFrame(loop)}
  function loop(now){const dt=Math.min(.03,(now-last)/1000);last=now;update(dt)}
  function detect(){const chef=$('#chef').getBoundingClientRect();const cx=chef.left+chef.width/2,cy=chef.top+chef.height*.65;let best=null,dist=Infinity;$$('.counter').forEach(el=>{const r=el.getBoundingClientRect(),x=Math.max(r.left,Math.min(cx,r.right)),y=Math.max(r.top,Math.min(cy,r.bottom)),d=Math.hypot(cx-x,cy-y);if(d<Math.max(chef.width*.72,42)&&d<dist){dist=d;best=el.dataset.station}});state.near=best}
  function joyMove(e){const r=$('#joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.3,l=Math.hypot(dx,dy)||1,k=Math.min(1,max/l);state.joy={x:dx/max*k,y:dy/max*k};$('#stick').style.transform=`translate(${dx*k}px,${dy*k}px)`}
  $('#joystick').addEventListener('pointerdown',e=>{joyPointer=e.pointerId;$('#joystick').setPointerCapture(e.pointerId);joyMove(e)});$('#joystick').addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});function joyEnd(e){if(e.pointerId!==joyPointer)return;joyPointer=null;state.joy={x:0,y:0};$('#stick').style.transform=''}$('#joystick').addEventListener('pointerup',joyEnd);$('#joystick').addEventListener('pointercancel',joyEnd);
  $('#actionBtn').addEventListener('pointerdown',e=>{e.preventDefault();interact();e.currentTarget.classList.add('pressed')});$('#actionBtn').addEventListener('pointerup',e=>e.currentTarget.classList.remove('pressed'));$('#dropBtn').addEventListener('click',discard);$('#startBtn').addEventListener('click',start);$('#retryBtn').addEventListener('click',start);
  addEventListener('keydown',e=>{state.keys[e.key]=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();interact()}if(e.key==='q')discard()});addEventListener('keyup',e=>state.keys[e.key]=false);requestAnimationFrame(loop);
})();
</script>
