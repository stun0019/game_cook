<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b1022"
  >

  <title>灶咖大亂鬥</title>

  <link
    rel="stylesheet"
    href="./css/base.css"
  >

  <link
    rel="stylesheet"
    href="./css/loading.css"
  >

  <link
    rel="stylesheet"
    href="./css/menu.css"
  >

  <link
    rel="stylesheet"
    href="./css/game.css"
  >

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="viewport">

    <main
      id="stage"
      aria-label="灶咖大亂鬥"
    >

      <div
        id="three-root"
        aria-hidden="true"
      ></div>

      <div id="scene-root"></div>

      <div id="ui-root"></div>

    </main>

  </div>

  <section
    id="rotate-screen"
    aria-live="polite"
  >

    <div class="rotate-content">

      <div
        class="rotate-phone"
        aria-hidden="true"
      ></div>

      <h2>
        請將手機轉為橫向
      </h2>

      <p>
        橫向模式可獲得最佳遊戲體驗
      </p>

    </div>

  </section>

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>
</html>
