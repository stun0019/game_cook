<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#101820">

<title>灶咖大亂鬥｜Kitchen Clash Café</title>

<style>
:root{
  --dark:#132027;
  --dark-2:#0a1115;
  --cream:#fff4d8;
  --paper:#fffaf0;
  --orange:#f29a46;
  --orange-dark:#a94f27;
  --red:#e45a45;
  --red-dark:#98382d;
  --gold:#f6c34f;
  --line:#33251f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;

  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;

  overflow:hidden;

  background:#0b1216;

  touch-action:none;
  overscroll-behavior:none;

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    system-ui,
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
}

/* =========================================================
   1280 × 720 / 16:9
========================================================= */

#game-shell{
  position:relative;

  width:min(
    100vw,
    calc(100vh * 16 / 9)
  );

  height:min(
    100vh,
    calc(100vw * 9 / 16)
  );

  max-width:1280px;
  max-height:720px;

  overflow:hidden;

  background:#101a20;

  box-shadow:
    0 24px 70px rgba(0,0,0,.5);
}

#game{
  display:block;

  width:100%;
  height:100%;

  background:#101a20;
}

.screen{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   旋轉提示
========================================================= */

#rotate-screen{
  z-index:1000;

  display:none;

  padding:30px;

  background:
    radial-gradient(
      circle at center,
      #263a43,
      #0b1216 72%
    );

  color:#ffffff;

  text-align:center;
}

.rotate-phone{
  width:62px;
  height:106px;

  margin:0 auto 22px;

  border:4px solid #ffffff;
  border-radius:14px;

  animation:
    phoneTurn 2s ease-in-out infinite;
}

@keyframes phoneTurn{
  0%,
  25%{
    transform:rotate(-10deg);
  }

  70%,
  100%{
    transform:rotate(80deg);
  }
}

/* =========================================================
   Loading
========================================================= */

#loading-screen{
  z-index:800;

  background:
    radial-gradient(
      circle at 50% 42%,
      #2a4850 0,
      #172830 52%,
      #0c151a 100%
    );

  color:white;
}

#loading-screen::before{
  content:"";

  position:absolute;
  inset:0;

  opacity:.13;

  background-image:
    linear-gradient(
      rgba(255,255,255,.07) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.07) 1px,
      transparent 1px
    );

  background-size:48px 48px;

  animation:
    gridMove 11s linear infinite;
}

@keyframes gridMove{
  to{
    background-position:
      48px 48px;
  }
}

.loading-card{
  position:relative;
  z-index:2;

  width:min(72%,600px);

  text-align:center;
}

.loading-jp{
  color:#ffd17c;

  font-size:15px;
  font-weight:900;

  letter-spacing:.34em;
}

.loading-title{
  margin-top:8px;

  font-size:clamp(48px,7vw,84px);
  font-weight:1000;
  line-height:1;

  letter-spacing:.08em;

  text-shadow:
    0 7px 0 rgba(0,0,0,.28);
}

.loading-en{
  margin-top:13px;

  color:#b8dbe1;

  font-size:clamp(14px,1.8vw,21px);
  font-weight:900;

  letter-spacing:.34em;
}

.loading-status{
  margin-top:54px;
}

.loading-line{
  display:flex;
  justify-content:space-between;

  gap:18px;

  margin-bottom:11px;

  color:#edf7f6;

  font-size:15px;
  font-weight:800;
}

.loading-track{
  height:16px;

  overflow:hidden;

  border:
    1px solid rgba(255,255,255,.28);

  border-radius:99px;

  background:
    rgba(0,0,0,.4);
}

#loading-bar{
  position:relative;

  width:0;
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #54a5b8,
      #ffd16f,
      #f07952
    );

  transition:
    width .08s linear;
}

#loading-bar::after{
  content:"";

  position:absolute;
  inset:0 auto 0 -110px;

  width:110px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.7),
      transparent
    );

  animation:
    shine 1.25s linear infinite;
}

@keyframes shine{
  to{
    transform:
      translateX(720px);
  }
}

#enter-btn{
  min-width:230px;

  margin-top:26px;
  padding:13px 28px;

  border:
    3px solid rgba(255,255,255,.68);

  border-radius:14px;

  background:
    linear-gradient(
      #f59c50,
      #cb6531
    );

  box-shadow:
    0 8px 0 #75361f,
    0 18px 36px rgba(0,0,0,.3);

  color:white;

  font-size:21px;
  font-weight:1000;

  letter-spacing:.1em;

  cursor:pointer;

  opacity:0;
  visibility:hidden;

  transform:
    translateY(12px);

  transition:.35s;
}

#enter-btn.visible{
  opacity:1;
  visibility:visible;

  transform:none;
}

/* =========================================================
   首頁
========================================================= */

#menu-screen{
  z-index:600;

  display:none;
  align-items:flex-start;
  justify-content:flex-start;

  padding:
    64px 0 0 72px;

  background:
    linear-gradient(
      90deg,
      rgba(9,16,20,.66),
      rgba(9,16,20,.08) 64%,
      rgba(9,16,20,.18)
    );
}

.menu-card{
  width:475px;

  padding:
    32px 34px 34px;

  border:
    5px solid #513629;

  border-radius:28px;

  background:
    linear-gradient(
      180deg,
      rgba(255,250,238,.98),
      rgba(239,216,170,.98)
    );

  box-shadow:
    0 16px 0 rgba(80,48,35,.62),
    0 34px 70px rgba(0,0,0,.34);
}

.menu-kicker{
  color:#ba6244;

  font-size:14px;
  font-weight:1000;

  letter-spacing:.28em;
}

.menu-title{
  margin-top:7px;

  color:#23434a;

  font-size:58px;
  font-weight:1000;
  line-height:1.06;

  letter-spacing:.04em;
}

.menu-description{
  margin-top:17px;

  color:#785746;

  font-size:18px;
  font-weight:800;
  line-height:1.75;
}

.menu-actions{
  display:flex;

  gap:14px;

  margin-top:28px;
}

.ui-btn{
  min-height:58px;

  padding:
    13px 25px;

  border:0;
  border-radius:14px;

  font-size:20px;
  font-weight:1000;

  cursor:pointer;
}

.ui-btn.primary{
  min-width:210px;

  background:
    linear-gradient(
      #f68f51,
      #d15a33
    );

  box-shadow:
    0 8px 0 #843520;

  color:white;
}

.ui-btn.secondary{
  min-width:66px;

  background:
    linear-gradient(
      #ffe7ad,
      #d6b36d
    );

  box-shadow:
    0 8px 0 #80613c;

  color:#4a3327;
}

/* =========================================================
   暫停／結算
========================================================= */

.overlay{
  z-index:900;

  display:none;

  background:
    rgba(8,14,17,.72);

  backdrop-filter:
    blur(5px);
}

.overlay-card{
  width:min(72%,650px);

  padding:36px;

  border:
    5px solid #503428;

  border-radius:26px;

  background:
    linear-gradient(
      #fff8e7,
      #efd09c
    );

  box-shadow:
    0 16px 0 #281914,
    0 40px 90px rgba(0,0,0,.42);

  text-align:center;
}

.overlay-card h2{
  color:#bc4e3a;

  font-size:46px;
}

.overlay-card p{
  margin-top:13px;

  color:#65493a;

  font-size:18px;
  font-weight:800;
  line-height:1.7;
}

.overlay-actions{
  display:flex;
  justify-content:center;

  gap:14px;

  margin-top:26px;
}

/* =========================================================
   觸控操作
========================================================= */

#touch-controls{
  position:absolute;
  inset:0;
  z-index:500;

  display:none;

  pointer-events:none;
}

#joystick-zone{
  position:absolute;
  left:1.4%;
  bottom:2.7%;

  width:min(12.5%,122px);
  aspect-ratio:1;

  pointer-events:auto;
}

#joystick-base{
  position:absolute;
  inset:0;

  border:
    4px solid rgba(255,255,255,.72);

  border-radius:50%;

  background:
    rgba(20,31,36,.44);

  box-shadow:
    inset 0 0 0 8px
    rgba(255,255,255,.07);
}

#joystick-stick{
  position:absolute;
  left:50%;
  top:50%;

  width:48%;
  aspect-ratio:1;

  border:
    4px solid #4a3025;

  border-radius:50%;

  background:
    linear-gradient(
      #ffe4a8,
      #d89b56
    );

  box-shadow:
    0 7px 0
    rgba(70,41,29,.62);

  transform:
    translate(-50%,-50%);
}

#action-buttons{
  position:absolute;
  right:1.3%;
  bottom:3.2%;

  display:flex;
  align-items:flex-end;

  gap:12px;

  pointer-events:auto;
}

.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;

  aspect-ratio:1;

  border:
    4px solid rgba(255,255,255,.78);

  border-radius:50%;

  font-weight:1000;

  cursor:pointer;
}

#discard-btn{
  width:min(7vw,66px);

  background:
    linear-gradient(
      #ffe3a6,
      #c89654
    );

  box-shadow:
    0 7px 0 #70502f;

  color:#493021;

  font-size:15px;
}

#interact-btn{
  width:min(9.7vw,94px);

  background:
    linear-gradient(
      #f47a56,
      #c84233
    );

  box-shadow:
    0 8px 0 #7f2c25;

  color:white;

  font-size:19px;
}

#desktop-help{
  position:absolute;
  left:50%;
  bottom:8px;
  z-index:480;

  padding:
    6px 13px;

  border:
    2px solid rgba(64,43,34,.78);

  border-radius:10px;

  background:
    rgba(255,250,237,.92);

  color:#51382c;

  font-size:13px;
  font-weight:900;

  pointer-events:none;

  transform:
    translateX(-50%);
}

@media (pointer:coarse){
  #touch-controls.active{
    display:block;
  }

  #desktop-help{
    display:none;
  }
}

@media (orientation:portrait) and (max-width:900px){
  #rotate-screen{
    display:flex;
  }
}
</style>
</head>

<body>

<main id="game-shell">

  <canvas
    id="game"
    width="1280"
    height="720"
    aria-label="灶咖大亂鬥遊戲畫面"
  ></canvas>

  <section
    id="rotate-screen"
    class="screen"
  >
    <div>
      <div class="rotate-phone"></div>

      <h2>
        請將手機轉為橫向
      </h2>

      <p>
        橫向模式可獲得最佳遊戲體驗
      </p>
    </div>
  </section>

  <section
    id="loading-screen"
    class="screen"
  >
    <div class="loading-card">

      <div class="loading-jp">
        キッチン大騒動
      </div>

      <div class="loading-title">
        灶咖大亂鬥
      </div>

      <div class="loading-en">
        KITCHEN CLASH CAFÉ
      </div>

      <div class="loading-status">

        <div class="loading-line">
          <span id="loading-message">
            正在準備咖啡廳……
          </span>

          <span id="loading-number">
            0%
          </span>
        </div>

        <div class="loading-track">
          <div id="loading-bar"></div>
        </div>

        <button
          id="enter-btn"
          type="button"
        >
          進入咖啡廳
        </button>

      </div>
    </div>
  </section>

  <section
    id="menu-screen"
    class="screen"
  >
    <div class="menu-card">

      <div class="menu-kicker">
        SUNNY PAW CAFÉ
      </div>

      <h1 class="menu-title">
        灶咖大亂鬥
      </h1>

      <p class="menu-description">
        午餐尖峰即將開始。依照訂單備料、
        烹調、組裝並出餐，在客人失去耐心前
        完成更多餐點。
      </p>

      <div class="menu-actions">

        <button
          id="start-btn"
          class="ui-btn primary"
          type="button"
        >
          開始營業
        </button>

        <button
          id="help-btn"
          class="ui-btn secondary"
          type="button"
        >
          ?
        </button>

      </div>
    </div>
  </section>

  <section
    id="pause-screen"
    class="screen overlay"
  >
    <div class="overlay-card">

      <h2>
        暫停營業
      </h2>

      <p>
        遊戲時間與訂單耐心已暫停。
      </p>

      <div class="overlay-actions">

        <button
          id="resume-btn"
          class="ui-btn primary"
          type="button"
        >
          繼續營業
        </button>

        <button
          id="pause-home-btn"
          class="ui-btn secondary"
          type="button"
        >
          首頁
        </button>

      </div>
    </div>
  </section>

  <section
    id="result-screen"
    class="screen overlay"
  >
    <div class="overlay-card">

      <h2 id="result-title">
        營業結束
      </h2>

      <p id="result-summary">
        今日營業告一段落。
      </p>

      <div class="overlay-actions">

        <button
          id="retry-btn"
          class="ui-btn primary"
          type="button"
        >
          再玩一次
        </button>

        <button
          id="result-home-btn"
          class="ui-btn secondary"
          type="button"
        >
          首頁
        </button>

      </div>
    </div>
  </section>

  <div id="touch-controls">

    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <div id="action-buttons">

      <button
        id="discard-btn"
        class="action-btn"
        type="button"
      >
        丟棄
      </button>

      <button
        id="interact-btn"
        class="action-btn"
        type="button"
      >
        互動
      </button>

    </div>
  </div>

  <div id="desktop-help">
    WASD／方向鍵移動　E／空白鍵互動　Q 丟棄　Esc 暫停
  </div>

</main>

<script>
(() => {
  "use strict";

  const canvas =
    document.getElementById("game");

  const ctx =
    canvas.getContext("2d");

  const loadingScreen =
    document.getElementById(
      "loading-screen"
    );

  const menuScreen =
    document.getElementById(
      "menu-screen"
    );

  const pauseScreen =
    document.getElementById(
      "pause-screen"
    );

  const resultScreen =
    document.getElementById(
      "result-screen"
    );

  const touchControls =
    document.getElementById(
      "touch-controls"
    );

  const W = 1280;
  const H = 720;

  const HUD_HEIGHT = 150;
  const TILE = 96;

  const C = {
    outline:"#33251f",
    wall:"#72aeb0",
    floor:"#d7b777",
    floorLine:"#b48d51",
    counterTop:"#ef9b4a",
    counterHighlight:"#ffbd6a",
    counterFront:"#af5d35",
    counterInset:"#81432f",
    cream:"#fff2d1",
    paper:"#fffaf0",
    red:"#e45b45",
    green:"#68a96d",
    blue:"#57a1b5",
    gold:"#f5bf4c",
    dark:"#1d3037",
    shadow:"rgba(41,27,20,.26)"
  };

  /* =======================================================
     餐台位置

     左側貼齊最左
     右側貼齊最右
     上方餐台直接接 HUD 下緣
  ======================================================= */

  const counterTiles = [];

  for(
    let x = 96;
    x <= 1088;
    x += TILE
  ){
    counterTiles.push({
      x,
      y:HUD_HEIGHT
    });
  }

  for(
    let y = HUD_HEIGHT + TILE;
    y <= 438;
    y += TILE
  ){
    counterTiles.push({
      x:0,
      y
    });

    counterTiles.push({
      x:1184,
      y
    });
  }

  for(
    let x = 400;
    x <= 784;
    x += TILE
  ){
    counterTiles.push({
      x,
      y:552
    });
  }

  /* =======================================================
     工作站

     visualX / visualY：
     繪製在餐台上的物件位置

     interactX / interactY：
     玩家實際需要靠近的位置
  ======================================================= */

  const stations = [
    {
      id:"bun",
      label:"麵包",
      icon:"bun",

      visualX:112,
      visualY:158,

      interactX:148,
      interactY:278,

      side:"top"
    },

    {
      id:"lettuce",
      label:"生菜",
      icon:"lettuce",

      visualX:208,
      visualY:158,

      interactX:244,
      interactY:278,

      side:"top"
    },

    {
      id:"meat",
      label:"肉排",
      icon:"rawMeat",

      visualX:304,
      visualY:158,

      interactX:340,
      interactY:278,

      side:"top"
    },

    {
      id:"board",
      label:"砧板",
      icon:"board",

      visualX:400,
      visualY:158,

      interactX:436,
      interactY:278,

      side:"top"
    },

    {
      id:"pan",
      label:"煎台",
      icon:"pan",

      visualX:688,
      visualY:158,

      interactX:724,
      interactY:278,

      side:"top"
    },

    {
      id:"drink",
      label:"飲料",
      icon:"drink",

      visualX:784,
      visualY:158,

      interactX:820,
      interactY:278,

      side:"top"
    },

    {
      id:"plates",
      label:"盤子",
      icon:"plate",

      visualX:880,
      visualY:158,

      interactX:916,
      interactY:278,

      side:"top"
    },

    {
      id:"assembly",
      label:"組裝",
      icon:"assembly",

      visualX:12,
      visualY:350,

      interactX:120,
      interactY:386,

      side:"left"
    },

    {
      id:"serve",
      label:"出餐",
      icon:"bell",

      visualX:1196,
      visualY:350,

      interactX:1160,
      interactY:386,

      side:"right"
    },

    {
      id:"trash",
      label:"丟棄",
      icon:"trash",

      visualX:604,
      visualY:560,

      interactX:640,
      interactY:520,

      side:"bottom"
    }
  ];

  const recipes = [
    {
      name:"經典漢堡",
      result:"burger",
      ingredients:[
        "bun",
        "cookedMeat"
      ]
    },

    {
      name:"生菜漢堡",
      result:"lettuceBurger",
      ingredients:[
        "bun",
        "lettuce",
        "cookedMeat"
      ]
    },

    {
      name:"冰飲",
      result:"drink",
      ingredients:[
        "drink"
      ]
    }
  ];

  const state = {
    screen:"menu",

    running:false,
    paused:false,

    time:75,

    score:0,
    served:0,
    combo:0,
    maxCombo:0,

    held:null,

    panState:"empty",
    panTimer:0,

    assembly:[],

    orders:[],
    orderSpawn:0,

    chef:{
      x:640,
      y:390
    },

    keys:{},

    joystick:{
      x:0,
      y:0
    },

    nearest:null,

    message:
      "依照訂單開始準備餐點",

    messageTimer:0,

    last:
      performance.now()
  };

  function roundedRect(
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke,
    lineWidth = 1
  ){
    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      width,
      height,
      radius
    );

    if(fill){
      ctx.fillStyle =
        fill;

      ctx.fill();
    }

    if(stroke){
      ctx.strokeStyle =
        stroke;

      ctx.lineWidth =
        lineWidth;

      ctx.stroke();
    }
  }

  function drawText(
    content,
    x,
    y,
    size,
    color,
    align = "left",
    weight = 700
  ){
    ctx.font =
      `${weight} ${size}px "Microsoft JhengHei", sans-serif`;

    ctx.fillStyle =
      color;

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      content,
      x,
      y
    );
  }

  /* =======================================================
     圖示
  ======================================================= */

  function drawIcon(
    type,
    x,
    y,
    scale = 1
  ){
    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.scale(
      scale,
      scale
    );

  /* =======================================================
     Layer 1：BG
  ======================================================= */

  function drawBackgroundLayer(){
    ctx.fillStyle =
      C.floor;

    ctx.fillRect(
      0,
      HUD_HEIGHT,
      W,
      H - HUD_HEIGHT
    );

    ctx.strokeStyle =
      C.floorLine;

    ctx.globalAlpha =
      .28;

    for(
      let x = 0;
      x <= W;
      x += 64
    ){
      ctx.beginPath();

      ctx.moveTo(
        x,
        HUD_HEIGHT
      );

      ctx.lineTo(
        x,
        H
      );

      ctx.stroke();
    }

    for(
      let y = HUD_HEIGHT;
      y <= H;
      y += 64
    ){
      ctx.beginPath();

      ctx.moveTo(
        0,
        y
      );

      ctx.lineTo(
        W,
        y
      );

      ctx.stroke();
    }

    ctx.globalAlpha =
      1;
  }

  /* =======================================================
     Layer 2：餐台
  ======================================================= */

  function drawCounterTile(
    tile
  ){
    const x =
      tile.x;

    const y =
      tile.y;

    ctx.fillStyle =
      C.shadow;

    ctx.beginPath();

    ctx.roundRect(
      x + 7,
      y + 12,
      TILE - 3,
      TILE - 2,
      14
    );

    ctx.fill();

    ctx.fillStyle =
      C.counterFront;

    ctx.beginPath();

    ctx.roundRect(
      x,
      y + 22,
      TILE,
      TILE - 22,
      13
    );

    ctx.fill();

    ctx.strokeStyle =
      C.outline;

    ctx.lineWidth =
      5;

    ctx.stroke();

    ctx.fillStyle =
      C.counterInset;

    ctx.beginPath();

    ctx.roundRect(
      x + 8,
      y + 32,
      TILE - 16,
      TILE - 42,
      8
    );

    ctx.fill();

    ctx.fillStyle =
      C.counterTop;

    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      TILE,
      38,
      14
    );

    ctx.fill();

    ctx.strokeStyle =
      C.outline;

    ctx.lineWidth =
      5;

    ctx.stroke();

    ctx.fillStyle =
      C.counterHighlight;

    ctx.beginPath();

    ctx.roundRect(
      x + 8,
      y + 7,
      TILE - 16,
      11,
      6
    );

    ctx.fill();
  }

  function drawCounterLayer(){
    counterTiles.forEach(
      drawCounterTile
    );
  }

  /* =======================================================
     Layer 3：餐台物件
  ======================================================= */

  function drawStation(
    station
  ){
    const isNear =
      state.nearest ===
      station.id;

    const boxWidth =
      72;

    const boxHeight =
      64;

    if(isNear){
      ctx.save();

      ctx.shadowColor =
        "rgba(255,216,82,.98)";

      ctx.shadowBlur =
        24;

      roundedRect(
        station.visualX - 5,
        station.visualY - 5,
        boxWidth + 10,
        boxHeight + 10,
        14,
        "#ffe38d",
        null
      );

      ctx.restore();

      ctx.strokeStyle =
        "#ffd24e";

      ctx.lineWidth =
        4;

      ctx.beginPath();

      ctx.arc(
        station.interactX,
        station.interactY,
        22,
        0,
        Math.PI * 2
      );

      ctx.stroke();
    }

    roundedRect(
      station.visualX,
      station.visualY,
      boxWidth,
      boxHeight,
      12,
      "#f8dfaa",
      C.outline,
      4
    );

    ctx.fillStyle =
      "#fff4d4";

    ctx.beginPath();

    ctx.roundRect(
      station.visualX + 7,
      station.visualY + 6,
      boxWidth - 14,
      boxHeight - 18,
      9
    );

    ctx.fill();

    drawIcon(
      station.icon,
      station.visualX + 36,
      station.visualY + 25,
      .56
    );

    drawText(
      station.label,
      station.visualX + 36,
      station.visualY + 51,
      13,
      C.dark,
      "center",
      1000
    );

    if(
      station.id === "pan" &&
      state.panState !== "empty"
    ){
      const progress =
        state.panState === "cooking"
          ? 1 -
            state.panTimer / 3
          : 1;

      ctx.fillStyle =
        "#5b4034";

      ctx.fillRect(
        station.visualX + 10,
        station.visualY + 56,
        boxWidth - 20,
        5
      );

      ctx.fillStyle =
        state.panState === "done"
          ? C.green
          : C.gold;

      ctx.fillRect(
        station.visualX + 10,
        station.visualY + 56,
        (
          boxWidth - 20
        ) *
        progress,
        5
      );
    }
  }

  function drawObjectLayer(){
    stations.forEach(
      drawStation
    );
  }

  /* =======================================================
     Layer 5：HUD / 大型訂單
  ======================================================= */

  function drawHudLayer(){
    ctx.fillStyle =
      "#fff6df";

    ctx.fillRect(
      0,
      0,
      W,
      HUD_HEIGHT
    );

    ctx.fillStyle =
      C.dark;

    ctx.fillRect(
      0,
      HUD_HEIGHT - 6,
      W,
      6
    );

    const orderWidth =
      250;

    const orderHeight =
      116;

    const orderGap =
      18;

    const orderStartX =
      120;

    state.orders
      .slice(0,3)
      .forEach((order,index) => {
        const x =
          orderStartX +
          index *
          (
            orderWidth +
            orderGap
          );

        roundedRect(
          x,
          16,
          orderWidth,
          orderHeight,
          20,
          C.paper,
          C.outline,
          5
        );

        if(index === 0){
          ctx.strokeStyle =
            C.gold;

          ctx.lineWidth =
            5;

          ctx.beginPath();

          ctx.roundRect(
            x + 6,
            22,
            orderWidth - 12,
            orderHeight - 12,
            15
          );

          ctx.stroke();
        }

        drawIcon(
          order.result,
          x + 54,
          62,
          .72
        );

        drawText(
          order.name,
          x + 102,
          39,
          16,
          C.dark,
          "left",
          1000
        );

        const ingredientSpacing =
          45;

        const ingredientStartX =
          x + 112;

        order.ingredients.forEach(
          (
            ingredient,
            ingredientIndex
          ) => {
            drawIcon(
              ingredient,
              ingredientStartX +
              ingredientIndex *
              ingredientSpacing,
              72,
              .46
            );
          }
        );

        ctx.fillStyle =
          "#d8c39c";

        ctx.fillRect(
          x + 18,

          orderWidth - 36,
          9
        );

        ctx.fillStyle =
          order.patience < 35

            : "#64a96e";

        ctx.fillRect(
          x + 18,
          113,
          (
            orderWidth - 36
          ) *
          Math.max(
            0,
            order.patience
          ) /
          100,
          9
        );
      });

    roundedRect(

      22,

      104,

    );

    drawText(

      48,
      16,
      "#765444",
      "center",
      900
    );

    drawText(
      String(
        state.score
      ),
      1010,
      84,
      30,
      C.dark,
      "center",
      1000
    );

    roundedRect(
      1106,
      22,
      140,
      104,
      20,
      C.paper,
      C.outline,
      5
    );

    drawText(
      "時間",
      1176,
      48,
      16,
      "#765444",
      "center",
      900
    );

    drawText(
      String(
        Math.ceil(

        )

      1176,
      84,
      32,
      C.dark,
      "center",
      1000
    );
  }

  function render(){
    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    if(state.screen === "menu"){
      drawMenu();
    }
    else{
      drawGame();
    }
  }

  function addOrder(){
    const recipe =
      recipes[
        Math.floor(
          Math.random() *
          recipes.length
        )
      ];

    state.orders.push({
      ...recipe,

      id:
        Date.now() +
        Math.random(),

      patience:100
    });
  }

  function setMessage(
    text,
    duration = 1.5
  ){
    state.message =
      text;

    state.messageTimer =
      duration;
  }

  function startGame(){
    Object.assign(
      state,
      {
        screen:"game",

        running:true,
        paused:false,

        time:75,

        score:0,
        served:0,
        combo:0,
        maxCombo:0,

        held:null,

        panState:"empty",
        panTimer:0,

        assembly:[],

        orders:[],
        orderSpawn:0,

        chef:{
          x:640,
          y:390
        },

        nearest:null,

        message:
          "依照訂單開始準備餐點",

        messageTimer:0,

        last:
          performance.now()
      }
    );

    addOrder();
    addOrder();
    addOrder();

    menuScreen.style.display =
      "none";

    pauseScreen.style.display =
      "none";

    resultScreen.style.display =
      "none";

    touchControls.classList.add(
      "active"
    );

    requestAnimationFrame(
      gameLoop
    );
  }

  function getNearestStation(){
    let best =
      null;

    let distance =
      Infinity;

    stations.forEach(station => {
      const currentDistance =
        Math.hypot(
          state.chef.x -
          station.interactX,

          state.chef.y -
          station.interactY
        );

      if(currentDistance < distance){
        distance =
          currentDistance;

        best =
          station;
      }
    });

    return distance <= 72
      ? best
      : null;
  }

  function interact(){
    if(
      !state.running ||
      state.paused
    ){
      return;
    }

    const station =
      getNearestStation();

    if(!station){
      setMessage(
        "請再靠近工作台"
      );

      return;
    }

    if(
      [
        "bun",
        "lettuce",
        "meat",
        "drink"
      ].includes(station.id)
    ){
      if(state.held){
        setMessage(
          "手上已經有物品"
        );

        return;
      }

      state.held =
        station.id === "meat"
          ? "rawMeat"
          : station.id;

      setMessage(
        `已拿取${station.label}`
      );

      return;
    }

    if(station.id === "pan"){
      if(
        state.held === "rawMeat" &&
        state.panState === "empty"
      ){
        state.held =
          null;

        state.panState =
          "cooking";

        state.panTimer =
          3;

        setMessage(
          "肉排開始烹調"
        );
      }
      else if(
        state.panState === "done" &&
        !state.held
      ){
        state.held =
          "cookedMeat";

        state.panState =
          "empty";

        setMessage(
          "已拿起熟肉排"
        );
      }
      else if(
        state.panState === "cooking"
      ){
        setMessage(
          "肉排仍在烹調"
        );
      }
      else{
        setMessage(
          "需要先放入生肉排"
        );
      }

      return;
    }

    if(station.id === "assembly"){
      if(
        ![
          "bun",
          "lettuce",
          "cookedMeat"
        ].includes(state.held)
      ){
        setMessage(
          "請放入可組裝食材"
        );

        return;
      }

      state.assembly.push(
        state.held
      );

      state.held =
        null;

      const ingredientSet =
        new Set(
          state.assembly
        );

      if(
        ingredientSet.has("bun") &&
        ingredientSet.has("cookedMeat")
      ){
        state.held =
          ingredientSet.has("lettuce")
            ? "lettuceBurger"
            : "burger";

        state.assembly =
          [];

        setMessage(
          "漢堡組裝完成"
        );
      }
      else{
        setMessage(
          "食材已放上組裝台"
        );
      }

      return;
    }

    if(station.id === "serve"){
      const currentOrder =
        state.orders[0];

      if(
        currentOrder &&
        state.held ===
        currentOrder.result
      ){
        const earnedScore =
          Math.round(
            140 +
            currentOrder.patience +
            state.combo * 25
          );

        state.score +=
          earnedScore;

        state.served +=
          1;

        state.combo +=
          1;

        state.maxCombo =
          Math.max(
            state.maxCombo,
            state.combo
          );

        state.held =
          null;

        state.orders.shift();

        addOrder();

        setMessage(
          `出餐成功 +${earnedScore}`
        );
      }
      else{
        state.combo =
          0;

        state.score =
          Math.max(
            0,
            state.score - 40
          );

        setMessage(
          "餐點與目前訂單不符"
        );
      }

      return;
    }

    if(station.id === "trash"){
      discard();
    }

    if(station.id === "board"){
      setMessage(
        "本關食材不需要切割"
      );
    }

    if(station.id === "plates"){
      setMessage(
        "盤子已備妥"
      );
    }
  }

  function discard(){
    if(
      state.held ||
      state.assembly.length
    ){
      state.held =
        null;

      state.assembly =
        [];

      setMessage(
        "已丟棄目前內容"
      );
    }
    else{
      setMessage(
        "目前沒有可丟棄的內容"
      );
    }
  }

  function updateMovement(
    deltaTime
  ){
    let movementX =
      state.joystick.x;

    let movementY =
      state.joystick.y;

    if(
      state.keys.ArrowLeft ||
      state.keys.a ||
      state.keys.A
    ){
      movementX -=
        1;
    }

    if(
      state.keys.ArrowRight ||
      state.keys.d ||
      state.keys.D
    ){
      movementX +=
        1;
    }

    if(
      state.keys.ArrowUp ||
      state.keys.w ||
      state.keys.W
    ){
      movementY -=
        1;
    }

    if(
      state.keys.ArrowDown ||
      state.keys.s ||
      state.keys.S
    ){
      movementY +=
        1;
    }

    const movementLength =
      Math.hypot(
        movementX,
        movementY
      );

    if(movementLength > 1){
      movementX /=
        movementLength;

      movementY /=
        movementLength;
    }

    const speed =
      250;

    state.chef.x =
      Math.max(
        110,
        Math.min(
          1170,
          state.chef.x +
          movementX *
          speed *
          deltaTime
        )
      );

    state.chef.y =
      Math.max(
        270,
        Math.min(
          535,
          state.chef.y +
          movementY *
          speed *
          deltaTime
        )
      );

    state.nearest =
      getNearestStation()?.id ||
      null;
  }

  function updateOrders(
    deltaTime
  ){
    state.time -=
      deltaTime;

    state.orderSpawn +=
      deltaTime;

    state.orders.forEach(
      (
        order,
        index
      ) => {
        order.patience -=
          deltaTime *
          (
            index === 0
              ? 4.1
              : 2
          );
      }
    );

    if(
      state.orders[0]
        ?.patience <= 0
    ){
      state.orders.shift();

      state.combo =
        0;

      state.score =
        Math.max(
          0,
          state.score - 60
        );

      addOrder();

      setMessage(
        "客人等不及離開了"
      );
    }

    if(
      state.orderSpawn >= 12 &&
      state.orders.length < 3
    ){
      state.orderSpawn =
        0;

      addOrder();
    }
  }

  function updateCooking(
    deltaTime
  ){
    if(
      state.panState !==
      "cooking"
    ){
      return;
    }

    state.panTimer -=
      deltaTime;

    if(state.panTimer <= 0){
      state.panState =
        "done";

      state.panTimer =
        0;

      setMessage(
        "肉排烹調完成"
      );
    }
  }

  function endGame(){
    state.running =
      false;

    touchControls.classList.remove(
      "active"
    );

    document
      .getElementById(
        "result-title"
      )
      .textContent =
        state.score >= 1000
          ? "今日營業成功"
          : "營業結束";

    document
      .getElementById(
        "result-summary"
      )
      .textContent =
        `總分 ${state.score}｜完成訂單 ${state.served}｜最高連擊 ${state.maxCombo}`;

    resultScreen.style.display =
      "flex";
  }

  function gameLoop(
    currentTime
  ){
    if(!state.running){
      return;
    }

    const deltaTime =
      Math.min(
        .033,
        (
          currentTime -
          state.last
        ) /
        1000
      );

    state.last =
      currentTime;

    if(!state.paused){
      updateMovement(
        deltaTime
      );

      updateOrders(
        deltaTime
      );

      updateCooking(
        deltaTime
      );

      if(state.messageTimer > 0){
        state.messageTimer -=
          deltaTime;

        if(state.messageTimer <= 0){
          state.message =
            state.held
              ? "前往下一個工作台繼續處理"
              : "依照訂單拿取需要的食材";
        }
      }

      if(state.time <= 0){
        state.time =
          0;

        endGame();
        render();

        return;
      }
    }

    render();

    requestAnimationFrame(
      gameLoop
    );
  }

  function showMenu(){
    state.running =
      false;

    state.screen =
      "menu";

    pauseScreen.style.display =
      "none";

    resultScreen.style.display =
      "none";

    menuScreen.style.display =
      "flex";

    touchControls.classList.remove(
      "active"
    );

    render();
  }

  window.addEventListener(
    "keydown",
    event => {
      state.keys[event.key] =
        true;

      if(
        [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          " ",
          "e",
          "E",
          "q",
          "Q"
        ].includes(event.key)
      ){
        event.preventDefault();
      }

      if(
        (
          event.key === "e" ||
          event.key === "E" ||
          event.key === " "
        ) &&
        !event.repeat
      ){
        interact();
      }

      if(
        (
          event.key === "q" ||
          event.key === "Q"
        ) &&
        !event.repeat
      ){
        discard();
      }

      if(
        event.key === "Escape" &&
        state.running &&
        !state.paused
      ){
        state.paused =
          true;

        pauseScreen.style.display =
          "flex";
      }
    }
  );

  window.addEventListener(
    "keyup",
    event => {
      state.keys[event.key] =
        false;
    }
  );

  const joystickZone =
    document.getElementById(
      "joystick-zone"
    );

  const joystickStick =
    document.getElementById(
      "joystick-stick"
    );

  let joystickPointer =
    null;

  function moveJoystick(
    event
  ){
    const rect =
      joystickZone
        .getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;

    let deltaX =
      event.clientX -
      centerX;

    let deltaY =
      event.clientY -
      centerY;

    const maximum =
      rect.width * .28;

    const distance =
      Math.hypot(
        deltaX,
        deltaY
      );

    if(distance > maximum){
      deltaX =
        deltaX /
        distance *
        maximum;

      deltaY =
        deltaY /
        distance *
        maximum;
    }

    state.joystick.x =
      deltaX /
      maximum;

    state.joystick.y =
      deltaY /
      maximum;

    joystickStick.style.transform =
      `translate(
        calc(-50% + ${deltaX}px),
        calc(-50% + ${deltaY}px)
      )`;
  }

  function resetJoystick(){
    joystickPointer =
      null;

    state.joystick.x =
      0;

    state.joystick.y =
      0;

    joystickStick.style.transform =
      "translate(-50%,-50%)";
  }

  joystickZone.addEventListener(
    "pointerdown",
    event => {
      joystickPointer =
        event.pointerId;

      joystickZone.setPointerCapture(
        event.pointerId
      );

      moveJoystick(
        event
      );
    }
  );

  joystickZone.addEventListener(
    "pointermove",
    event => {
      if(
        event.pointerId ===
        joystickPointer
      ){
        moveJoystick(
          event
        );
      }
    }
  );

  joystickZone.addEventListener(
    "pointerup",
    resetJoystick
  );

  joystickZone.addEventListener(
    "pointercancel",
    resetJoystick
  );

  document
    .getElementById(
      "interact-btn"
    )
    .addEventListener(
      "pointerdown",
      event => {
        event.preventDefault();

        interact();
      }
    );

  document
    .getElementById(
      "discard-btn"
    )
    .addEventListener(
      "pointerdown",
      event => {
        event.preventDefault();

        discard();
      }
    );

  document
    .getElementById(
      "start-btn"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .getElementById(
      "retry-btn"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .getElementById(
      "pause-home-btn"
    )
    .addEventListener(
      "click",
      showMenu
    );

  document
    .getElementById(
      "result-home-btn"
    )
    .addEventListener(
      "click",
      showMenu
    );

  document
    .getElementById(
      "resume-btn"
    )
    .addEventListener(
      "click",
      () => {
        state.paused =
          false;

        pauseScreen.style.display =
          "none";

        state.last =
          performance.now();
      }
    );

  document
    .getElementById(
      "help-btn"
    )
    .addEventListener(
      "click",
      () => {
        alert(
          "依照訂單拿取食材。肉排需要放到煎台烹調，完成後把食材送到組裝台，最後前往出餐口。"
        );
      }
    );

  async function boot(){
    const steps = [
      "點亮咖啡廳招牌",
      "清點今日食材",
      "預熱廚房設備",
      "整理出餐櫃台",
      "準備開始營業"
    ];

    for(
      let progress = 0;
      progress <= 100;
      progress += 2
    ){
      document
        .getElementById(
          "loading-bar"
        )
        .style
        .width =
          `${progress}%`;

      document
        .getElementById(
          "loading-number"
        )
        .textContent =
          `${progress}%`;

      document
        .getElementById(
          "loading-message"
        )
        .textContent =
          steps[
            Math.min(
              steps.length - 1,
              Math.floor(
                progress / 21
              )
            )
          ];

      await new Promise(resolve => {
        setTimeout(
          resolve,
          progress < 70
            ? 22
            : 31
        );
      });
    }

    document
      .getElementById(
        "loading-message"
      )
      .textContent =
        "準備完成";

    document
      .getElementById(
        "enter-btn"
      )
      .classList
      .add(
        "visible"
      );
  }

  document
    .getElementById(
      "enter-btn"
    )
    .addEventListener(
      "click",
      () => {
        loadingScreen.style.display =
          "none";

        menuScreen.style.display =
          "flex";

        showMenu();
      }
    );

  menuScreen.style.display =
    "none";

  render();
  boot();
})();
</script>

</body>
</html>
