<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>小鎮開飯啦！HTML 原型</title>
  <style>
    :root{
      --bg:#fff6e8;
      --panel:#ffffff;
      --ink:#3b2b22;
      --accent:#ff8f5a;
      --accent2:#ffd166;
      --good:#63c174;
      --bad:#e85d75;
      --muted:#8c7a70;
      --shadow:0 10px 24px rgba(82,54,34,.14);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
      background:linear-gradient(180deg,#ffd9b8 0%,#fff6e8 32%,#fff6e8 100%);
      color:var(--ink);
      min-height:100vh;
      display:flex;
      justify-content:center;
    }
    button{font:inherit}
    .game{
      width:min(100vw,460px);
      min-height:100vh;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
      overflow:hidden;
    }
    .topbar{
      display:grid;
      grid-template-columns:1fr auto auto;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(255,255,255,.9);
      box-shadow:var(--shadow);
    }
    .level{font-weight:900}
    .stat{
      background:#fff1d3;
      border:2px solid #ffe0a0;
      padding:6px 10px;
      border-radius:999px;
      font-weight:800;
      white-space:nowrap;
    }
    .progress-wrap{
      background:#eadfd8;
      height:10px;
      border-radius:999px;
      overflow:hidden;
      margin-top:5px;
    }
    .progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.25s}
    .restaurant{
      background:linear-gradient(180deg,#fffaf4,#ffe8cf);
      min-height:210px;
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:12px;
      position:relative;
      overflow:hidden;
    }
    .restaurant:before{
      content:"";
      position:absolute;
      left:0;right:0;bottom:0;height:58px;
      background:#d69a65;
      border-top:8px solid #bd7e4a;
    }
    .customers{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      min-height:170px;
      align-items:end;
    }
    .customer{
      background:rgba(255,255,255,.95);
      border:2px solid #f1d4bc;
      border-radius:20px;
      padding:8px;
      text-align:center;
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      box-shadow:0 6px 12px rgba(74,45,26,.1);
    }
    .customer.empty{opacity:.42;filter:grayscale(.4)}
    .face{font-size:40px;line-height:1}
    .order{font-size:25px;min-height:31px}
    .patience{
      height:8px;background:#eadfd8;border-radius:99px;overflow:hidden
    }
    .patience > div{height:100%;background:var(--good);width:100%;transition:width .3s}
    .serve{
      border:none;border-radius:12px;padding:8px 4px;
      background:var(--accent);color:white;font-weight:900;
      box-shadow:0 4px 0 #d86f3e;
    }
    .serve:disabled{background:#c9bdb6;box-shadow:0 4px 0 #aa9f99}
    .combo{
      position:absolute;right:16px;top:14px;
      font-weight:1000;color:#d65326;
      transform:rotate(5deg);
      text-shadow:0 2px white;
      z-index:3;
    }
    .kitchen{
      background:var(--panel);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:12px;
    }
    .section-title{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:8px;font-weight:900
    }
    .stations{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }
    .station{
      border:2px solid #f1dfd2;
      background:#fffaf6;
      border-radius:18px;
      padding:10px;
      min-height:114px;
      position:relative;
    }
    .station h3{margin:0 0 6px;font-size:15px}
    .station .icon{font-size:34px}
    .station button{
      width:100%;border:none;border-radius:12px;
      padding:9px 6px;background:#684b3a;color:white;font-weight:900;
    }
    .station button:disabled{opacity:.45}
    .cookbar{
      height:9px;background:#e9dfda;border-radius:99px;overflow:hidden;margin:8px 0;
    }
    .cookbar > div{height:100%;width:0;background:var(--accent2)}
    .inventory{
      display:flex;gap:6px;flex-wrap:wrap;margin-top:8px
    }
    .food{
      border:2px solid #f3d0aa;
      background:#fff3dd;
      border-radius:12px;
      padding:6px 9px;
      font-size:22px;
      position:relative;
    }
    .food span{
      position:absolute;top:-7px;right:-5px;background:#7a5844;color:white;
      width:18px;height:18px;border-radius:50%;font-size:11px;
      display:grid;place-items:center;font-weight:900
    }
    .footer{
      display:grid;grid-template-columns:1fr 1fr;gap:10px
    }
    .footer button{
      border:none;border-radius:16px;padding:12px;font-weight:900;
      background:#fff;box-shadow:var(--shadow);color:var(--ink)
    }
    .footer .primary{background:var(--accent);color:white}
    .overlay{
      position:fixed;inset:0;background:rgba(49,31,20,.72);
      display:none;align-items:center;justify-content:center;padding:22px;z-index:10
    }
    .overlay.show{display:flex}
    .card{
      width:min(100%,390px);background:white;border-radius:26px;padding:22px;
      text-align:center;box-shadow:var(--shadow)
    }
    .card h1{margin:0 0 8px}
    .stars{font-size:38px;letter-spacing:4px}
    .card button{
      width:100%;border:none;border-radius:16px;padding:13px;
      margin-top:12px;background:var(--accent);color:white;font-weight:900
    }
    .toast{
      position:absolute;left:50%;top:92px;transform:translateX(-50%) translateY(-10px);
      background:#3d2f27;color:white;padding:9px 14px;border-radius:99px;
      opacity:0;pointer-events:none;transition:.25s;z-index:8;white-space:nowrap
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .loading-screen{
      position:fixed;
      inset:0;
      z-index:30;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(180deg,#ffd29f 0%,#ffb980 45%,#fff0da 100%);
      transition:opacity .55s ease, visibility .55s ease;
    }
    .loading-screen.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }
    .loading-content{
      width:min(100%,360px);
      text-align:center;
      animation:loadingFloat 2.2s ease-in-out infinite;
    }
    .loading-logo{
      width:146px;
      height:146px;
      margin:0 auto 14px;
      display:grid;
      place-items:center;
      border-radius:42px;
      background:rgba(255,255,255,.92);
      border:5px solid rgba(255,255,255,.75);
      box-shadow:0 18px 40px rgba(103,57,28,.22);
      font-size:76px;
      transform:rotate(-3deg);
    }
    .loading-title{
      margin:0;
      font-size:34px;
      line-height:1.1;
      font-weight:1000;
      letter-spacing:1px;
      color:#5b3523;
      text-shadow:0 3px 0 rgba(255,255,255,.55);
    }
    .loading-subtitle{
      margin:8px 0 24px;
      color:#80553d;
      font-weight:800;
      font-size:15px;
    }
    .loading-bar-shell{
      height:18px;
      padding:4px;
      border-radius:999px;
      background:rgba(255,255,255,.74);
      box-shadow:inset 0 2px 5px rgba(76,45,26,.12),0 7px 18px rgba(84,47,25,.13);
      overflow:hidden;
    }
    .loading-bar-fill{
      width:0%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#ffd166,#ff8f5a);
      transition:width .18s ease;
      position:relative;
      overflow:hidden;
    }
    .loading-bar-fill:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.58) 45%,transparent 70%);
      animation:loadingShine 1.15s linear infinite;
    }
    .loading-info{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      color:#714832;
      font-size:13px;
      font-weight:900;
    }
    .loading-tip{
      margin-top:26px;
      min-height:42px;
      padding:10px 14px;
      border-radius:16px;
      background:rgba(255,255,255,.5);
      color:#714832;
      font-size:13px;
      line-height:1.5;
      font-weight:700;
    }

    .loading-start-btn{
      width:100%;
      margin-top:18px;
      border:none;
      border-radius:18px;
      padding:14px 20px;
      background:linear-gradient(180deg,#ff9d67,#ff7f4a);
      color:white;
      font-weight:1000;
      font-size:18px;
      box-shadow:0 6px 0 #d96535,0 12px 24px rgba(108,55,29,.18);
      opacity:0;
      visibility:hidden;
      transform:translateY(10px);
      pointer-events:none;
      transition:opacity .35s ease,transform .35s ease,visibility .35s ease;
    }
    .loading-start-btn.show{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
      pointer-events:auto;
    }
    .loading-start-btn:active{
      transform:translateY(4px);
      box-shadow:0 2px 0 #d96535,0 7px 16px rgba(108,55,29,.16);
    }

    @keyframes loadingFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-7px)}
    }
    @keyframes loadingShine{
      from{transform:translateX(-100%)}
      to{transform:translateX(100%)}
    }

    @media (max-height:760px){
      .restaurant{min-height:185px}
      .customers{min-height:145px}
      .customer{min-height:132px}
      .face{font-size:32px}
      .station{min-height:100px}
    }
  
/* ===== v0.4 Game-style Loading Screen ===== */
.loading-screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  overflow:hidden;
  background:#ffd79a;
  transition:opacity .6s ease, visibility .6s ease;
}
.loading-screen.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.loading-scene{
  position:relative;
  width:min(100vw,460px);
  height:100vh;
  min-height:680px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 13%, rgba(255,255,255,.96) 0 7%, rgba(255,247,219,.85) 8% 17%, transparent 18%),
    linear-gradient(180deg,#9adcf7 0 23%,#fff0ca 23% 68%,#c07b43 68% 100%);
}
.loading-scene::before{
  content:"";
  position:absolute;
  left:-8%;
  right:-8%;
  top:21%;
  height:18px;
  background:#ef7548;
  border-top:6px solid #fff4dd;
  border-bottom:6px solid #c95131;
  box-shadow:0 7px 0 rgba(100,56,33,.1);
}
.loading-scene::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:31%;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 58px),
    linear-gradient(180deg,#b86d38,#8d4f2d);
  border-top:12px solid #f0b36f;
}
.loading-window{
  position:absolute;
  left:9%;
  top:8%;
  width:82%;
  height:23%;
  border:10px solid #fff4dc;
  border-radius:30px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.35),transparent 50%),
    linear-gradient(180deg,#6ec9ee 0 58%,#aee186 58%);
  box-shadow:inset 0 0 0 5px #925637,0 10px 20px rgba(90,49,25,.15);
}
.loading-window::before,
.loading-window::after{
  content:"";
  position:absolute;
  background:#fff4dc;
  z-index:2;
}
.loading-window::before{width:10px;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.loading-window::after{height:10px;left:0;right:0;top:52%}
.cloud{
  position:absolute;
  width:56px;
  height:22px;
  border-radius:999px;
  background:white;
  opacity:.9;
  animation:cloudDrift 7s linear infinite;
}
.cloud::before,.cloud::after{
  content:"";position:absolute;border-radius:50%;background:white;
}
.cloud::before{width:25px;height:25px;left:8px;top:-12px}
.cloud::after{width:32px;height:32px;right:6px;top:-16px}
.cloud.one{top:15%;left:-20%;animation-delay:0s}
.cloud.two{top:22%;left:-30%;transform:scale(.75);animation-delay:2.6s}
.loading-title-wrap{
  position:absolute;
  top:27%;
  left:50%;
  width:88%;
  transform:translateX(-50%);
  text-align:center;
  z-index:4;
}
.loading-title{
  margin:0;
  font-size:36px;
  line-height:1;
  font-weight:1000;
  letter-spacing:1px;
  color:#fff;
  -webkit-text-stroke:7px #a5482d;
  paint-order:stroke fill;
  text-shadow:0 6px 0 #6f2f20,0 10px 16px rgba(67,33,20,.22);
}
.loading-title-small{
  margin-top:8px;
  display:inline-block;
  padding:5px 14px 6px;
  border-radius:999px;
  background:#fff3d6;
  border:3px solid #d57443;
  color:#8b452d;
  font-weight:900;
  font-size:14px;
  box-shadow:0 4px 0 #a44f32;
}
.chef-stage{
  position:absolute;
  left:50%;
  bottom:22%;
  width:94%;
  height:43%;
  transform:translateX(-50%);
  z-index:3;
}
.counter{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:28%;
  border-radius:34px 34px 0 0;
  background:linear-gradient(180deg,#f1bb79 0 18%,#9a552f 18% 100%);
  border-top:9px solid #fff0c5;
  box-shadow:0 -8px 0 #c97943,0 -14px 24px rgba(72,38,21,.18);
}
.counter::before{
  content:"";
  position:absolute;
  left:7%;
  right:7%;
  top:28%;
  height:44%;
  border-radius:16px;
  background:repeating-linear-gradient(90deg,#713a24 0 22%,#82462a 22% 44%);
  opacity:.4;
}
.chef{
  position:absolute;
  left:50%;
  bottom:12%;
  width:196px;
  height:220px;
  transform:translateX(-50%);
  animation:chefBounce 1.8s ease-in-out infinite;
}
.chef-ear{
  position:absolute;
  top:50px;
  width:55px;
  height:62px;
  border-radius:50% 50% 45% 45%;
  background:#be6d37;
  border:6px solid #713d27;
  z-index:1;
}
.chef-ear.left{left:16px;transform:rotate(-22deg)}
.chef-ear.right{right:16px;transform:rotate(22deg)}
.chef-hat{
  position:absolute;
  left:50%;
  top:0;
  width:124px;
  height:76px;
  transform:translateX(-50%);
  background:#fff;
  border:6px solid #713d27;
  border-radius:50px 50px 26px 26px;
  z-index:5;
}
.chef-hat::before,.chef-hat::after{
  content:"";position:absolute;top:-26px;width:55px;height:55px;border-radius:50%;background:#fff;border:6px solid #713d27;
}
.chef-hat::before{left:2px}
.chef-hat::after{right:2px}
.chef-face{
  position:absolute;
  left:50%;
  top:52px;
  width:150px;
  height:135px;
  transform:translateX(-50%);
  border-radius:48% 48% 44% 44%;
  background:#d88747;
  border:7px solid #713d27;
  z-index:4;
}
.chef-muzzle{
  position:absolute;
  left:50%;
  bottom:19px;
  width:82px;
  height:58px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#f3c78f;
  border:4px solid #713d27;
}
.chef-eye{
  position:absolute;
  top:48px;
  width:13px;
  height:19px;
  border-radius:50%;
  background:#39241b;
}
.chef-eye.left{left:37px}
.chef-eye.right{right:37px}
.chef-nose{
  position:absolute;
  left:50%;
  top:11px;
  width:20px;
  height:15px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#39241b;
}
.chef-mouth{
  position:absolute;
  left:50%;
  top:29px;
  width:30px;
  height:14px;
  transform:translateX(-50%);
  border-bottom:4px solid #713d27;
  border-radius:0 0 20px 20px;
}
.chef-body{
  position:absolute;
  left:50%;
  bottom:0;
  width:136px;
  height:82px;
  transform:translateX(-50%);
  border-radius:30px 30px 12px 12px;
  background:#fff7e8;
  border:7px solid #713d27;
}
.chef-body::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  border-left:4px solid #d6c1a8;
}
.chef-scarf{
  position:absolute;
  left:50%;
  top:169px;
  width:86px;
  height:26px;
  transform:translateX(-50%);
  background:#ef644a;
  border:5px solid #713d27;
  border-radius:10px 10px 18px 18px;
  z-index:7;
}
.pan{
  position:absolute;
  right:4%;
  bottom:15%;
  width:116px;
  height:56px;
  border-radius:50%;
  background:#444;
  border:7px solid #241914;
  transform:rotate(-7deg);
  z-index:8;
  box-shadow:inset 0 8px 0 rgba(255,255,255,.1);
}
.pan::after{
  content:"";
  position:absolute;
  right:-67px;
  top:15px;
  width:78px;
  height:18px;
  border-radius:999px;
  background:#29211d;
  border:5px solid #211713;
}
.egg{
  position:absolute;
  right:23%;
  bottom:27%;
  font-size:54px;
  z-index:9;
  animation:eggFlip 1.8s ease-in-out infinite;
}
.floating-food{
  position:absolute;
  z-index:5;
  font-size:42px;
  filter:drop-shadow(0 7px 5px rgba(68,34,16,.18));
}
.floating-food.f1{left:4%;top:42%;animation:foodFloat 2.3s ease-in-out infinite}
.floating-food.f2{right:4%;top:39%;animation:foodFloat 2.1s ease-in-out infinite reverse}
.floating-food.f3{left:12%;top:56%;animation:foodFloat 2.5s ease-in-out infinite .4s}
.floating-food.f4{right:11%;top:54%;animation:foodFloat 2.4s ease-in-out infinite .7s}
.loading-panel{
  position:absolute;
  left:50%;
  bottom:4.3%;
  width:88%;
  transform:translateX(-50%);
  z-index:10;
}
.loading-bar-shell{
  height:23px;
  padding:5px;
  border-radius:999px;
  background:#fff7e6;
  border:4px solid #81462e;
  box-shadow:0 5px 0 #5e2f20,0 10px 20px rgba(61,30,17,.22);
  overflow:hidden;
}
.loading-bar-fill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#ffd35e,#ff8a4d);
  position:relative;
  overflow:hidden;
  transition:width .18s ease;
}
.loading-bar-fill::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.4) 18px 30px,transparent 30px 48px);
  animation:loadingStripe .8s linear infinite;
}
.loading-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:11px;
  padding:0 6px;
  color:#fff8e5;
  font-size:13px;
  font-weight:1000;
  text-shadow:0 2px 0 #67351f;
}
.loading-tip{
  margin-top:11px;
  min-height:auto;
  padding:8px 12px;
  border-radius:14px;
  background:rgba(80,38,22,.6);
  border:2px solid rgba(255,255,255,.35);
  color:#fff7e8;
  font-size:12px;
  line-height:1.35;
  font-weight:800;
  text-align:center;
}
.loading-start-btn{
  width:100%;
  margin-top:12px;
  border:none;
  border-radius:18px;
  padding:15px 20px;
  background:linear-gradient(180deg,#ffde69,#ff9b48);
  color:#773820;
  border:4px solid #7a3c25;
  font-weight:1000;
  font-size:20px;
  box-shadow:0 7px 0 #572718,0 13px 22px rgba(47,22,12,.24);
  opacity:0;
  visibility:hidden;
  transform:translateY(12px) scale(.94);
  pointer-events:none;
  transition:opacity .32s ease,transform .32s ease,visibility .32s ease;
}
.loading-start-btn.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
  pointer-events:auto;
  animation:startPulse 1.35s ease-in-out infinite;
}
.loading-start-btn:active{
  animation:none;
  transform:translateY(5px) scale(.99);
  box-shadow:0 2px 0 #572718,0 7px 14px rgba(47,22,12,.2);
}
@keyframes chefBounce{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}
  50%{transform:translateX(-50%) translateY(-7px) rotate(1deg)}
}
@keyframes eggFlip{
  0%,100%{transform:translateY(0) rotate(-12deg)}
  50%{transform:translateY(-74px) rotate(340deg)}
}
@keyframes foodFloat{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-12px) rotate(8deg)}
}
@keyframes cloudDrift{
  from{left:-28%}
  to{left:115%}
}
@keyframes loadingStripe{
  from{transform:translateX(-48px)}
  to{transform:translateX(48px)}
}
@keyframes startPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.035)}
}
@media (max-height:720px){
  .loading-title-wrap{top:25%}
  .chef-stage{bottom:20%;height:42%}
  .loading-title{font-size:31px}
  .chef{transform:translateX(-50%) scale(.88);transform-origin:bottom center}
  .loading-panel{bottom:2.5%}
}

</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-scene">
    <div class="loading-window"></div>
    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="loading-title-wrap">
      <h1 class="loading-title">小鎮開飯啦！</h1>
      <div class="loading-title-small">早餐小舖</div>
    </div>

    <div class="floating-food f1">🍞</div>
    <div class="floating-food f2">☕</div>
    <div class="floating-food f3">🥓</div>
    <div class="floating-food f4">🥕</div>

    <div class="chef-stage">
      <div class="chef">
        <div class="chef-ear left"></div>
        <div class="chef-ear right"></div>
        <div class="chef-hat"></div>
        <div class="chef-face">
          <div class="chef-eye left"></div>
          <div class="chef-eye right"></div>
          <div class="chef-muzzle">
            <div class="chef-nose"></div>
            <div class="chef-mouth"></div>
          </div>
        </div>
        <div class="chef-scarf"></div>
        <div class="chef-body"></div>
      </div>
      <div class="egg">🍳</div>
      <div class="pan"></div>
      <div class="counter"></div>
    </div>

    <div class="loading-panel">
      <div class="loading-bar-shell">
        <div class="loading-bar-fill" id="loadingBar"></div>
      </div>

      <div class="loading-info">
        <span id="loadingText">正在整理廚房...</span>
        <span id="loadingPercent">0%</span>
      </div>

      <div class="loading-tip" id="loadingTip">
        小提示：快速連續上菜可以累積 Combo。
      </div>

      <button class="loading-start-btn" id="loadingStartBtn" onclick="enterGame()">
        開始營業
      </button>
    </div>
  </div>
</div>

<div class="game">
  <div class="topbar">
    <div>
      <div class="level">第 1 關｜早餐小舖</div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    </div>
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">⏱ <span id="time">60</span></div>
  </div>

  <section class="restaurant">
    <div class="combo" id="combo"></div>
    <div class="customers" id="customers"></div>
  </section>

  <section class="kitchen">
    <div class="section-title">
      <span>廚房</span>
      <span>目標：🪙 <b id="goal">180</b></span>
    </div>
    <div class="stations">
      <div class="station">
        <h3>烤麵包機</h3>
        <div class="icon">🍞</div>
        <div class="cookbar"><div id="barToast"></div></div>
        <button id="btnToast" onclick="startCooking('toast')">製作吐司</button>
      </div>
      <div class="station">
        <h3>平底煎鍋</h3>
        <div class="icon">🍳</div>
        <div class="cookbar"><div id="barEgg"></div></div>
        <button id="btnEgg" onclick="startCooking('egg')">製作煎蛋</button>
      </div>
      <div class="station">
        <h3>咖啡機</h3>
        <div class="icon">☕</div>
        <div class="cookbar"><div id="barCoffee"></div></div>
        <button id="btnCoffee" onclick="startCooking('coffee')">沖泡咖啡</button>
      </div>
      <div class="station">
        <h3>完成餐點</h3>
        <div class="inventory" id="inventory"></div>
      </div>
    </div>
  </section>

  <div class="footer">
    <button onclick="resetGame()">重新開始</button>
    <button class="primary" onclick="showHelp()">玩法說明</button>
  </div>

  <div class="toast" id="toastMsg"></div>
</div>

<div class="overlay show" id="startOverlay">
  <div class="card">
    <div style="font-size:58px">🐶🍳</div>
    <h1>小鎮開飯啦！</h1>
    <p>HTML 手機料理養成原型</p>
    <p style="color:#7b6b62">在 60 秒內完成客人的餐點，達成 180 金幣。</p>
    <button onclick="startGame()">開始營業</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="card">
    <h1 id="resultTitle">營業結束</h1>
    <div class="stars" id="stars">⭐</div>
    <p id="resultText"></p>
    <button onclick="resetGame()">再玩一次</button>
  </div>
</div>

<div class="overlay" id="helpOverlay">
  <div class="card">
    <h1>玩法說明</h1>
    <p style="text-align:left;line-height:1.7">
      1. 點擊廚具製作吐司、煎蛋或咖啡。<br>
      2. 完成的料理會進入右下角庫存。<br>
      3. 客人餐點備齊後，點擊「上菜」。<br>
      4. 越快上菜，小費越高；連續上菜會增加 Combo。<br>
      5. 在時間結束前達成金幣目標。
    </p>
    <button onclick="closeHelp()">返回遊戲</button>
  </div>
</div>

<script>

const loadingMessages = [
  ['正在整理廚房...', '小提示：快速連續上菜可以累積 Combo。'],
  ['正在準備食材...', '小提示：越早完成訂單，客人給的小費越多。'],
  ['正在加熱廚具...', '小提示：先觀察客人的訂單，再安排料理順序。'],
  ['正在迎接客人...', '小提示：客人耐心耗盡後會直接離開。'],
  ['準備開店！', '今日目標：讓每位客人吃得開心。']
];

function runLoadingScreen(){
  const screen = document.getElementById('loadingScreen');
  const bar = document.getElementById('loadingBar');
  const percent = document.getElementById('loadingPercent');
  const text = document.getElementById('loadingText');
  const tip = document.getElementById('loadingTip');

  let progress = 0;
  const timer = setInterval(()=>{
    const step = progress < 70 ? Math.floor(Math.random()*7)+4 : Math.floor(Math.random()*4)+2;
    progress += step;
    if(progress >= 100) progress = 100;

    const messageIndex = Math.min(
      loadingMessages.length-1,
      Math.floor(progress / 21)
    );

    bar.style.width = progress + '%';
    percent.textContent = progress + '%';
    text.textContent = loadingMessages[messageIndex][0];
    tip.textContent = loadingMessages[messageIndex][1];

    if(progress >= 100){
      clearInterval(timer);
      text.textContent = '載入完成';
      tip.textContent = '準備好了，點擊下方按鈕開始營業。';

      const startBtn = document.getElementById('loadingStartBtn');
      setTimeout(()=>{
        startBtn.classList.add('show');
      },250);
    }
  },140);
}

function enterGame(){
  const screen = document.getElementById('loadingScreen');
  const startBtn = document.getElementById('loadingStartBtn');

  startBtn.disabled = true;
  screen.classList.add('hide');
}

const FOOD = {
  toast: {icon:'🍞', time:1800, label:'吐司'},
  egg: {icon:'🍳', time:2300, label:'煎蛋'},
  coffee: {icon:'☕', time:1500, label:'咖啡'}
};

const faces = ['🐰','🐻','🐱','🐼','🦊','🐨'];
const orderPool = [
  ['toast'], ['egg'], ['coffee'],
  ['toast','coffee'], ['egg','coffee'], ['toast','egg']
];

let state;
let timerId;
let customerTick;
let spawnTick;

function initialState(){
  return {
    running:false,
    time:60,
    coins:0,
    goal:180,
    inventory:{toast:0,egg:0,coffee:0},
    cooking:{toast:false,egg:false,coffee:false},
    customers:[null,null,null],
    combo:0,
    lastServe:0,
    served:0
  };
}

function startGame(){
  document.getElementById('startOverlay').classList.remove('show');
  state = initialState();
  state.running = true;
  spawnCustomer();
  spawnCustomer();
  render();
  timerId = setInterval(()=>{
    state.time--;
    if(state.time <= 0) endGame();
    render();
  },1000);
  customerTick = setInterval(updateCustomers,500);
  spawnTick = setInterval(spawnCustomer,2800);
}

function resetGame(){
  clearAll();
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('startOverlay').classList.remove('show');
  startGame();
}

function clearAll(){
  clearInterval(timerId);
  clearInterval(customerTick);
  clearInterval(spawnTick);
}

function spawnCustomer(){
  if(!state || !state.running) return;
  const idx = state.customers.findIndex(c=>c===null);
  if(idx === -1) return;
  const order = orderPool[Math.floor(Math.random()*orderPool.length)];
  state.customers[idx] = {
    face:faces[Math.floor(Math.random()*faces.length)],
    order:[...order],
    patience:100
  };
  renderCustomers();
}

function updateCustomers(){
  if(!state.running) return;
  state.customers.forEach((c,i)=>{
    if(!c) return;
    c.patience -= 2.8;
    if(c.patience <= 0){
      state.customers[i]=null;
      state.combo=0;
      toast('客人生氣離開了');
      setTimeout(spawnCustomer,500);
    }
  });
  renderCustomers();
  renderTop();
}

function startCooking(type){
  if(!state.running || state.cooking[type]) return;
  state.cooking[type]=true;
  const btn = document.getElementById('btn'+cap(type));
  const bar = document.getElementById('bar'+cap(type));
  btn.disabled=true;
  bar.style.transition='none';
  bar.style.width='0%';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      bar.style.transition=`width ${FOOD[type].time}ms linear`;
      bar.style.width='100%';
    });
  });
  setTimeout(()=>{
    if(!state || !state.running) return;
    state.cooking[type]=false;
    state.inventory[type]++;
    btn.disabled=false;
    bar.style.transition='none';
    bar.style.width='0%';
    renderInventory();
    renderCustomers();
  },FOOD[type].time);
}

function canServe(customer){
  if(!customer) return false;
  const need={toast:0,egg:0,coffee:0};
  customer.order.forEach(x=>need[x]++);
  return Object.keys(need).every(k=>state.inventory[k]>=need[k]);
}

function serve(index){
  const c=state.customers[index];
  if(!c || !canServe(c)) return;
  c.order.forEach(x=>state.inventory[x]--);

  const now=Date.now();
  state.combo = (now-state.lastServe<4500) ? state.combo+1 : 1;
  state.lastServe=now;

  const base = c.order.length*18;
  const tip = Math.round(c.patience/10);
  const comboBonus = Math.min(state.combo-1,5)*3;
  const earned=base+tip+comboBonus;

  state.coins += earned;
  state.served++;
  state.customers[index]=null;
  toast(`上菜成功 +${earned} 金幣`);
  setTimeout(spawnCustomer,650);
  render();
}

function render(){
  if(!state) return;
  renderTop();
  renderCustomers();
  renderInventory();
}

function renderTop(){
  document.getElementById('coins').textContent=state.coins;
  document.getElementById('time').textContent=state.time;
  document.getElementById('goal').textContent=state.goal;
  document.getElementById('progress').style.width=Math.min(100,state.coins/state.goal*100)+'%';
  document.getElementById('combo').textContent=state.combo>=2?`COMBO ×${state.combo}`:'';
}

function renderCustomers(){
  const root=document.getElementById('customers');
  root.innerHTML='';
  state.customers.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='customer'+(!c?' empty':'');
    if(!c){
      el.innerHTML='<div class="face">🪑</div><div>等待客人</div><button class="serve" disabled>空位</button>';
    }else{
      const ready=canServe(c);
      const color=c.patience>55?'#63c174':c.patience>25?'#f0ad4e':'#e85d75';
      el.innerHTML=`
        <div class="face">${c.face}</div>
        <div class="order">${c.order.map(x=>FOOD[x].icon).join('')}</div>
        <div class="patience"><div style="width:${Math.max(0,c.patience)}%;background:${color}"></div></div>
        <button class="serve" ${ready?'':'disabled'} onclick="serve(${i})">${ready?'上菜':'備餐中'}</button>`;
    }
    root.appendChild(el);
  });
}

function renderInventory(){
  const root=document.getElementById('inventory');
  root.innerHTML='';
  Object.keys(FOOD).forEach(type=>{
    const count=state.inventory[type];
    const el=document.createElement('div');
    el.className='food';
    el.innerHTML=`${FOOD[type].icon}<span>${count}</span>`;
    root.appendChild(el);
  });
}

function endGame(){
  if(!state.running) return;
  state.running=false;
  clearAll();
  const ratio=state.coins/state.goal;
  const stars=ratio>=1.5?3:ratio>=1?2:ratio>=.65?1:0;
  document.getElementById('resultTitle').textContent=ratio>=1?'過關成功！':'挑戰失敗';
  document.getElementById('stars').textContent=stars?'⭐'.repeat(stars):'☆';
  document.getElementById('resultText').innerHTML=
    `本次收入：<b>${state.coins}</b> 金幣<br>完成訂單：<b>${state.served}</b> 份`;
  document.getElementById('resultOverlay').classList.add('show');
}

function toast(msg){
  const el=document.getElementById('toastMsg');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),1200);
}

function showHelp(){
  document.getElementById('helpOverlay').classList.add('show');
}
function closeHelp(){
  document.getElementById('helpOverlay').classList.remove('show');
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
window.addEventListener("load", runLoadingScreen);
</script>
</body>
</html>
