<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>灶腳大亂鬥｜單人試玩</title>
  <link rel="stylesheet" href="assets/art/art-motion.css">
  <style>
    :root{--cream:#fff4cf;--brown:#3b241d;--red:#ee5c46;--yellow:#ffd75e;--green:#66c77a;--blue:#71c9db}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172a2a;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--brown)}
    button{font:inherit;color:inherit}
    #rotate{display:none;position:fixed;inset:0;z-index:99;background:#193130;color:white;align-items:center;justify-content:center;text-align:center;padding:32px}
    #rotate b{display:block;font-size:64px;animation:turn 1.8s infinite}.rotate-card{font-size:18px;font-weight:900;line-height:1.7}
    @keyframes turn{50%{transform:rotate(90deg)}}
    .shell{position:fixed;inset:0;background:#d5b582}
    .game{position:relative;width:100vw;height:100vh;min-width:0;min-height:0;overflow:hidden;background:#f5d889}
    .hud{position:absolute;left:0;right:0;top:0;height:11.5%;z-index:20;background:linear-gradient(#fff8dcfa,#ffe5a8f5);border-bottom:.5vh solid #7d4c31;box-shadow:0 .55vh 0 #3e251b44}
    .hud-inner{width:min(100%,177.777vh);height:100%;margin:auto;display:grid;grid-template-columns:minmax(140px,.85fr) minmax(0,1.8fr) minmax(135px,.75fr);gap:1.4%;align-items:center;padding:.65vh 1.5%}

    .orders{display:flex;gap:2%;height:90%;justify-content:center;min-width:0}.ticket{position:relative;width:31%;min-width:0;padding:.35vh .45vw;background:#fff;border:.3vh solid #d99b4d;border-radius:.75vh;box-shadow:0 .35vh 0 #9a6339;text-align:center;overflow:hidden;animation:ticketIn .38s cubic-bezier(.2,1.25,.45,1) both}.ticket::before{content:"";position:absolute;left:10%;right:10%;top:-.55vh;border-top:.45vh dotted #835032}.ticket.next{opacity:.58;transform:scale(.94)}.ticket.leaving{animation:ticketOut .28s ease-in forwards}.ticket-title{font-size:clamp(8px,1.55vmin,13px);font-weight:900;color:#925033;line-height:1}.ticket-items{height:3.8vh;display:flex;align-items:center;justify-content:center;gap:.15vw;font-size:clamp(13px,2.5vmin,24px);line-height:1;white-space:nowrap}.food-art{width:clamp(18px,3.4vh,31px);height:clamp(18px,3.4vh,31px);object-fit:contain;vertical-align:middle}.patience{height:.55vh;min-height:3px;background:#eadac0;border-radius:9px;overflow:hidden}.patience i{display:block;width:100%;height:100%;background:var(--green);transition:width .2s linear}@keyframes ticketIn{from{opacity:0;transform:translateY(-2vh) scale(.82)}}@keyframes ticketOut{to{opacity:0;transform:translateY(-2vh) rotate(-4deg) scale(.82)}}
    .stats{display:flex;gap:.5vw;justify-content:flex-end;min-width:0}.pill{min-width:clamp(62px,8vmin,92px);padding:.45vh .55vw;background:white;border:.28vh solid #b97942;border-radius:999px;font-weight:1000;font-size:clamp(11px,2.05vmin,18px);text-align:center;box-shadow:0 .3vh 0 #82502f;white-space:nowrap}.pill.time.danger{color:#d63830;animation:pulse .55s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
    .kitchen{position:absolute;inset:11.5% 0 0;background-color:#d5b582;background-image:linear-gradient(45deg,#caa873 25%,transparent 25%),linear-gradient(-45deg,#caa873 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#caa873 75%),linear-gradient(-45deg,transparent 75%,#caa873 75%);background-size:6vh 6vh;background-position:0 0,0 3vh,3vh -3vh,-3vh 0;box-shadow:inset 0 2vh 4vh #7c573326}
    .safe-area{position:absolute;inset:0 auto 0 50%;width:min(100%,177.777vh);transform:translateX(-50%)}
    .counter{position:absolute;z-index:2;display:grid;place-items:center;background:linear-gradient(165deg,#b7d5d8 0 16%,#7ba4ab 17% 72%,#547781 73%);border:.48vh solid #315967;border-top-width:.75vh;border-radius:1.2vh 1.2vh .7vh .7vh;box-shadow:inset 0 .65vh #d8eeee,0 .72vh 0 #294954,0 1.25vh 2.1vh #533a2870;font-size:clamp(24px,4.4vmin,48px)}
    .counter::before{content:"";position:absolute;left:8%;right:8%;top:76%;height:31%;z-index:-1;border:.35vh solid #315967;border-radius:0 0 .8vh .8vh;background:linear-gradient(90deg,#567b84 0 47%,#315967 48% 52%,#567b84 53%);box-shadow:0 .55vh 0 #28454c}
    .counter .cap{position:absolute;z-index:1;bottom:.2vh;left:5%;right:5%;font-size:clamp(7px,1.45vmin,12px);font-weight:1000;text-align:center;color:#fff;text-shadow:0 .2vh #263e42;white-space:nowrap}.counter.hot{background:linear-gradient(165deg,#aeb3b5 0 16%,#5d6266 17% 72%,#34383c 73%)}.counter.hot::before{background:linear-gradient(90deg,#454a4e 0 47%,#25292d 48% 52%,#454a4e 53%)}.counter.service{background:linear-gradient(165deg,#ffd29a 0 16%,#e88758 17% 72%,#b94e3f 73%)}.counter.service::before{background:linear-gradient(90deg,#bf5944 0 47%,#8e392f 48% 52%,#bf5944 53%)}.counter.assembly{background:linear-gradient(165deg,#d7e9a9 0 16%,#8daf5c 17% 72%,#5d813e 73%)}.counter.assembly::before{background:linear-gradient(90deg,#658948 0 47%,#456831 48% 52%,#658948 53%)}#bun,#tomato,#meat{background:linear-gradient(165deg,#f1c37f 0 16%,#b8783f 17% 72%,#85532d 73%);border-color:#684126}#bun::before,#tomato::before,#meat::before{border-color:#684126;background:repeating-linear-gradient(90deg,#8c592e 0 31%,#6f4325 32% 34%)}#bin{background:linear-gradient(165deg,#c7d0d1 0 16%,#778486 17% 72%,#4d585a 73%)}#bin::before{background:repeating-linear-gradient(90deg,#596567 0 15%,#3f494b 16% 18%)}.counter.active{filter:brightness(1.18);outline:.55vh solid #ffe766;outline-offset:.18vh}.counter.active::after{content:"!";position:absolute;right:-1vh;top:-1.5vh;width:2.5vh;height:2.5vh;display:grid;place-items:center;border-radius:50%;background:#ffe15a;border:.3vh solid #663c25;font-weight:1000;font-size:1.55vh;animation:bob .55s infinite alternate}@keyframes bob{to{transform:translateY(-.45vh)}}
    .counter.guide{filter:brightness(1.16);outline:.72vh solid #fff06a;outline-offset:.3vh;animation:guidePulse .8s ease-in-out infinite alternate}.counter.guide::after{content:"下一步";position:absolute;right:-.7vh;top:-2.3vh;width:auto;height:auto;padding:.3vh .65vh;border-radius:99px;background:#ffe15a;border:.3vh solid #663c25;color:#59351f;font-weight:1000;font-size:clamp(8px,1.4vmin,12px);white-space:nowrap;animation:bob .55s infinite alternate}.counter.processing .station-art{animation:workLoop .32s ease-in-out infinite alternate}.counter.processing{filter:brightness(1.1)}.counter.bump{animation:stationBump .28s cubic-bezier(.2,1.55,.45,1)}@keyframes guidePulse{to{filter:brightness(1.32);outline-color:#fff}}@keyframes workLoop{to{transform:translateY(-9%) rotate(4deg) scale(1.06)}}@keyframes stationBump{45%{transform:translateY(-.8vh) scale(1.035)}}
    #bun{left:1.5%;top:7%;width:13%;height:20%}#tomato{left:1.5%;top:36%;width:13%;height:20%}#meat{left:1.5%;top:65%;width:13%;height:20%}#board{left:25%;top:5%;width:15%;height:20%}#pan{left:46%;top:5%;width:15%;height:20%}#assembly{right:3%;top:35%;width:15%;height:23%}#service{right:3%;top:5%;width:15%;height:21%}#bin{right:3%;bottom:5%;width:13%;height:20%}
    .island{position:absolute;left:39%;right:39%;bottom:6%;height:13%;background:linear-gradient(#b7d7da 0 18%,#7ca4aa 19% 72%,#52757d 73%);border:.48vh solid #315967;border-radius:1vh;box-shadow:inset 0 .55vh #e0f0f0,0 .7vh 0 #294954,0 1.2vh 2vh #533a2855}.island::before{content:"";position:absolute;left:9%;right:9%;top:72%;height:40%;z-index:-1;background:#587b82;border:.35vh solid #315967;border-radius:0 0 .7vh .7vh}.island::after{content:"備餐區";position:absolute;inset:0;display:grid;place-items:center;color:#42616a;font-weight:1000;font-size:clamp(10px,1.8vmin,17px)}
    .station-art{width:58%;height:58%;object-fit:contain;transform:translateY(-6%);filter:drop-shadow(0 .45vh .25vh #37241b55)}.task-fx{position:absolute;z-index:4;left:50%;top:10%;width:58%;height:58%;translate:-50% 0;object-fit:contain;opacity:0;pointer-events:none}.station-progress{position:absolute;left:10%;right:10%;bottom:2.7vh;height:1vh;border:.25vh solid #fff;border-radius:1vh;background:#433;overflow:hidden;display:none}.station-progress.show{display:block}.station-progress i{display:block;height:100%;width:0;background:#ffd84e}.station-item{position:absolute;right:5%;top:2%;display:flex;align-items:center;gap:.1vw;filter:drop-shadow(0 .3vh .2vh #0005)}.station-item .mini-art{width:clamp(17px,3.4vh,30px);height:clamp(17px,3.4vh,30px);object-fit:contain}
    .chef{position:absolute;left:48%;top:48%;width:clamp(76px,11.5vmin,108px);height:auto;aspect-ratio:8/9;min-width:0;min-height:0;max-width:none;max-height:none;transform:translate(-50%,-68%);z-index:12;transition:filter .15s;filter:drop-shadow(0 .8vh .45vh #51351f55)}.chef.is-moving{animation:chefRigBob 360ms ease-in-out infinite}.chef.is-working{animation:chefRigWork 320ms cubic-bezier(.2,1.35,.38,1) both}.chef>svg{display:block;width:100%;height:100%;overflow:visible}.held{position:absolute;z-index:5;left:50%;top:35%;width:46%;height:34%;transform:translateX(-50%);filter:drop-shadow(0 .3vh .2vh #0005)}.held.pop{animation:itemPop .3s cubic-bezier(.2,1.7,.4,1)}.held .held-art{width:100%;height:100%;object-fit:contain}@keyframes chefRigBob{0%,100%{transform:translate(-50%,-68%)}50%{transform:translate(-50%,-71%) scaleY(1.015)}}@keyframes chefRigWork{0%,100%{transform:translate(-50%,-68%) scale(1)}45%{transform:translate(-50%,-65%) scale(1.05,.93)}}@keyframes itemPop{0%{transform:translateX(-50%) scale(.25) rotate(-12deg)}70%{transform:translateX(-50%) scale(1.22) rotate(4deg)}100%{transform:translateX(-50%) scale(1)}}
    .hint{position:absolute;z-index:24;left:50%;bottom:2.4%;transform:translateX(-50%);padding:.8vh 1.2vw;border-radius:99px;background:#2b211de8;color:white;font-weight:900;font-size:clamp(10px,1.15vw,16px);pointer-events:none;white-space:nowrap;opacity:.9}
    .controls{position:absolute;inset:0 auto 0 50%;width:min(100%,177.777vh);z-index:30;pointer-events:none;transform:translateX(-50%)}.joystick{position:absolute;left:18%;bottom:2.5%;width:clamp(72px,13vmin,110px);height:clamp(72px,13vmin,110px);border-radius:50%;background:#261d1a55;border:.42vh solid #fff9;box-shadow:inset 0 0 2vh #0005,0 .6vh 1.2vh #4b332844;pointer-events:auto;touch-action:none;opacity:.38;transition:opacity .16s ease}.joystick:active{opacity:.72}.stick{position:absolute;width:44%;height:44%;left:28%;top:28%;border-radius:50%;background:linear-gradient(#fff5d6,#ddb87b);border:.42vh solid #75492f;box-shadow:0 .6vh 0 #51301f}
    .actions{position:absolute;right:20%;bottom:2.5%;display:flex;align-items:flex-end;gap:1.1vw;pointer-events:auto}.action{width:clamp(60px,11.5vmin,92px);height:clamp(60px,11.5vmin,92px);border-radius:50%;border:.48vh solid #7e392b;background:linear-gradient(#ff9b70,#e85040);box-shadow:0 .65vh 0 #7f3028;color:white;font-weight:1000;font-size:clamp(11px,1.9vmin,17px);touch-action:none;transition:transform .08s,box-shadow .08s,filter .15s}.action.ready{animation:actionReady .7s ease-in-out infinite alternate}.action.waiting{filter:saturate(.45);opacity:.72}.action:active,.action.pressed{transform:translateY(.5vh) scale(.94);box-shadow:0 .15vh 0 #7f3028}.drop{width:clamp(46px,8.5vmin,66px);height:clamp(46px,8.5vmin,66px);background:linear-gradient(#ffe484,#e9af3a);color:#64401f;border-color:#765129}@keyframes actionReady{to{filter:brightness(1.2);box-shadow:0 .65vh 0 #7f3028,0 0 1.8vh #fff070}}
    .toast{position:absolute;z-index:60;left:50%;top:19%;transform:translate(-50%,-1vh);padding:1vh 1.5vw;border-radius:99px;background:#2b211eee;color:white;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .success{position:absolute;z-index:70;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);padding:1.2vh 2.4vw;border:.55vh solid #7a4429;border-radius:2vh;background:linear-gradient(#fff9c7,#ffd65b);box-shadow:0 .8vh 0 #8a4a29,0 2vh 4vh #3b241d66;text-align:center;font-weight:1000;opacity:0;pointer-events:none;isolation:isolate}.success-burst{position:absolute;z-index:-1;left:50%;top:50%;width:150%;height:180%;translate:-50% -50%;object-fit:contain}.success b{display:block;font-size:clamp(22px,4.5vmin,48px);color:#e64f39;text-shadow:0 .25vh #fff}.success span{font-size:clamp(13px,2.3vmin,22px)}.success.show{animation:successPop 1.25s cubic-bezier(.2,1.4,.4,1)}.float-score{position:absolute;z-index:72;color:#75401f;font-size:clamp(20px,4vmin,42px);font-weight:1000;text-shadow:0 .2vh #fff;pointer-events:none}.float-score>span{z-index:1}.fly-food{position:absolute;z-index:71;width:clamp(42px,7vmin,68px);height:clamp(42px,7vmin,68px);pointer-events:none;animation:foodFly .75s cubic-bezier(.2,.75,.3,1) forwards}.fly-food img{width:100%;height:100%;object-fit:contain}.combo-badge{position:absolute!important;z-index:73;right:18%;top:15%;opacity:0;pointer-events:none}.combo-badge.is-active{opacity:1}.combo{color:#d62f49}@keyframes successPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-5deg)}15%,72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-62%) scale(1.08)}}@keyframes foodFly{to{left:var(--to-x);top:var(--to-y);opacity:0;transform:scale(.35) rotate(24deg)}}
    .overlay{position:absolute;inset:0;z-index:80;background:#172724e8;display:none;place-items:center;padding:3vh}.overlay.show{display:grid}.card{width:min(72vw,720px);padding:3.2vh 3vw;border:.7vh solid #74412d;border-radius:3vh;background:linear-gradient(#fff9df,#f9d78e);box-shadow:0 1.4vh 0 #40261d,0 3vh 6vh #0007;text-align:center}.card h1{margin:0;color:#ee563f;font-size:clamp(28px,4.5vw,64px);text-shadow:0 .35vh white,0 .7vh #943a2d}.card p{margin:1.5vh 0;font-size:clamp(12px,1.55vw,22px);font-weight:750;line-height:1.55}.card button{border:.45vh solid #723b2d;border-radius:1.6vh;padding:1.3vh 3vw;background:linear-gradient(#ffe168,#ffad42);box-shadow:0 .7vh 0 #7e3e28;font-size:clamp(15px,2vw,28px);font-weight:1000}.how{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin:2vh 0}.how div{padding:1.2vh .6vw;border-radius:1.2vh;background:#fff9;border:.25vh solid #d7a75e;font-weight:850;font-size:clamp(9px,1vw,15px)}.how b{display:block;font-size:clamp(21px,3vw,42px)}
    @media (orientation:portrait),(max-width:679px){#rotate{display:flex}.game{display:none}}
    @media (max-height:620px){.hud{height:12%}.kitchen{inset:12% 0 0}.hud-inner{padding:.35vh 1.5%}.ticket-title{display:none}.counter::before{height:26%}.hint{bottom:1.4%}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}.counter.guide{outline-color:#fff06a}.task-fx{display:none}}
    :root.reduce-motion *, :root.reduce-motion *::before, :root.reduce-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}:root.reduce-motion .counter.guide{outline-color:#fff06a}:root.reduce-motion .task-fx{display:none}
  </style>
</head>
<body>
<div id="rotate"><div class="rotate-card"><b>📱</b>請將手機橫過來<br><small>本遊戲採用 16:9 橫向畫面</small></div></div>
<main class="shell"><div class="game" id="game">
  <header class="hud">
    <div class="hud-inner">
      <div class="logo">灶腳大亂鬥<small>單人試玩關卡</small></div>
      <div class="orders" id="orders"></div>
      <div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill time">⏱ <span id="time">90</span></div></div>
    </div>
  </header>
  <section class="kitchen" id="kitchen">
    <div class="safe-area">
      <div class="counter" id="bun" data-station="bun"><img class="station-art" src="assets/art/bun.svg" alt=""><span class="cap">麵包箱</span></div>
      <div class="counter" id="tomato" data-station="tomato"><img class="station-art" src="assets/art/tomato.svg" alt=""><span class="cap">番茄箱</span></div>
      <div class="counter" id="meat" data-station="meat"><img class="station-art" src="assets/art/raw-meat.svg" alt=""><span class="cap">肉排箱</span></div>
      <div class="counter art-station" id="board" data-station="board"><img class="station-art" src="assets/art/cutting-board.svg" alt=""><img class="task-fx art-crumbs" src="assets/art/prep-crumbs.svg" alt=""><span class="station-item"></span><span class="cap">砧板</span><span class="station-progress"><i></i></span></div>
      <div class="counter hot art-station" id="pan" data-station="pan"><img class="station-art" src="assets/art/pan.svg" alt=""><img class="task-fx art-steam" src="assets/art/steam-puff.svg" alt=""><span class="station-item"></span><span class="cap">煎鍋</span><span class="station-progress"><i></i></span></div>
      <div class="counter assembly" id="assembly" data-station="assembly"><img class="station-art" src="assets/art/plate.svg" alt=""><span class="station-item"></span><span class="cap">組裝台</span></div>
      <div class="counter service" id="service" data-station="service"><img class="station-art" src="assets/art/service-bell.svg" alt=""><span class="cap">出餐口</span></div>

      <div class="island"></div>

          <g id="art-chef-face" fill="#35251f"><ellipse cx="68" cy="72" rx="3.2" ry="4"/><ellipse cx="91" cy="72" rx="3.2" ry="4"/><path d="M69 84c7 7 15 7 22 0" fill="none" stroke="#54372d" stroke-width="3.5" stroke-linecap="round"/><circle cx="58" cy="82" r="5" fill="#f26b5e" opacity=".35"/><circle cx="102" cy="82" r="5" fill="#f26b5e" opacity=".35"/></g>
          <g id="art-chef-hat" stroke="#54372d" stroke-width="4" stroke-linejoin="round"><path d="M48 52c-8-7-6-20 4-25 4-12 19-15 27-7 8-9 24-6 28 6 12 4 15 19 5 27Z" fill="#fffaf0"/><path d="M48 52c17 8 46 8 64 1v12c-16 7-46 7-64-1Z" fill="#d8e9e8"/><path d="M55 33c8-6 17-8 25-7" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/></g>
          <g id="art-chef-back-detail" opacity="0" stroke="#54372d" stroke-width="3"><path d="M60 55c13 8 28 8 41 0" fill="none"/><path d="m72 88 8 7 8-7" fill="#c9783f" stroke-linejoin="round"/></g>
        </svg>
        <div class="held" id="held"></div>
      </div>
    </div>
  </section>
  <div class="hint" id="hint">靠近工作台，按下「互動」</div>
  <div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><button class="action drop" id="dropBtn">丟棄</button><button class="action" id="actionBtn">互動</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="success" id="success"><img class="success-burst" src="assets/art/score-starburst.svg" alt=""><b>太棒了！</b><span id="successText"></span></div>
  <div class="combo-badge art-combo-badge" id="comboBadge"><img src="assets/art/combo-badge.svg" alt=""><span id="comboText"></span></div>
  <div class="overlay show" id="start"><div class="card"><h1>灶腳大亂鬥</h1><p><b>只要移動＋按右下大按鈕！</b><br>第一單麵包已備好，跟著黃光完成番茄漢堡。</p><div class="how"><div><b>🕹️</b>移動廚師</div><div><b>✨</b>跟著黃光</div><div><b>👆</b>按情境按鈕</div><div><b>🔔</b>送出漢堡</div></div><button id="startBtn">開始第一單</button></div></div>
  <div class="overlay" id="result"><div class="card"><h1 id="resultTitle">營業結束</h1><p id="resultText"></p><button id="retryBtn">再玩一次</button></div></div>
</div></main>
<script>
(()=>{
  const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');if(motionQuery.matches||new URLSearchParams(location.search).has('reduce-motion'))document.documentElement.classList.add('reduce-motion');
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const icons={bun:'🍞',tomato:'🍅',choppedTomato:'🍅',meat:'🥩',cookedMeat:'🍖',burger:'🍔'};
  const art={bun:'assets/art/bun.svg',tomato:'assets/art/tomato.svg',choppedTomato:'assets/art/chopped-tomato.svg',meat:'assets/art/raw-meat.svg',cookedMeat:'assets/art/cooked-meat.svg',burger:'assets/art/burger-complete.svg'};
  const artImg=(type,cls='food-art')=>art[type]?`<img class="${cls}" src="${art[type]}" alt="${icons[type]}">`:icons[type];
  const recipes=[['bun','cookedMeat'],['bun','choppedTomato'],['bun','cookedMeat','choppedTomato']];
  const state={running:false,time:90,score:0,served:0,created:0,combo:0,held:null,heldRecipe:null,plate:[],orders:[],pos:{x:18,y:48},near:null,keys:{},joy:{x:0,y:0},busy:false,moving:false,facing:1};
  let timer,last=performance.now(),joyPointer=null,orderSeq=0,lastOrdersKey='',renderedHeld,renderedPlate='';
  function reset(){Object.assign(state,{running:true,time:90,score:0,served:0,created:0,combo:0,held:null,heldRecipe:null,plate:['bun'],orders:[],pos:{x:18,y:48},near:null,keys:{},joy:{x:0,y:0},busy:false,moving:false,facing:1});lastOrdersKey='';renderedHeld=undefined;renderedPlate='';$$('.station-item').forEach(x=>{x.textContent='';x.dataset.item=''});$$('.counter').forEach(x=>x.classList.remove('processing','is-processing','is-ready','bump'));$$('.station-progress').forEach(x=>{x.classList.remove('show');x.firstElementChild.style.transition='none';x.firstElementChild.style.width='0'});$('#comboBadge').classList.remove('is-active');addOrder();addOrder();addOrder();detect();render();clearInterval(timer);timer=setInterval(()=>{if(!state.running)return;const current=state.orders[0];if(!current.tutorial)state.time--;const drain=current.tutorial?0:state.served<2?1.8:state.served<4?2.5:3.2;current.patience-=drain;if(current.patience<=0){state.orders.shift();state.combo=0;addOrder();state.score=Math.max(0,state.score-20);say('客人離開了，下一單放慢做！ -20')}if(state.time<=0)finish();render()},1000)}
  function addOrder(){const n=state.created++;let items;if(n===0)items=['bun','choppedTomato'];else if(n===1)items=['bun','cookedMeat'];else if(n===2)items=['bun','choppedTomato'];else if(state.served<3)items=[...recipes[n%2]];else items=[...recipes[Math.floor(Math.random()*recipes.length)]];state.orders.push({id:++orderSeq,items:[...items],patience:100,tutorial:n===0})}
  function start(){ $('#start').classList.remove('show');$('#result').classList.remove('show');reset() }
  function finish(){state.running=false;clearInterval(timer);const stars=state.score>=500?3:state.score>=280?2:state.score>=120?1:0;$('#resultTitle').textContent=stars?'打烊啦！':'廚房大失控！';$('#resultText').innerHTML=`${'⭐'.repeat(stars)||'☆'}<br>本日得分 <b>${state.score}</b><br>完成 <b>${state.served}</b> 份訂單`;$('#result').classList.add('show')}
  function render(){
    $('#score').textContent=state.score;$('#time').textContent=state.time;$('.time').classList.toggle('danger',state.time<=15);if(state.held!==renderedHeld){renderedHeld=state.held;$('#held').innerHTML=state.held?artImg(state.held,'held-art'):''}
    $('#chef').style.left=state.pos.x+'%';$('#chef').style.top=state.pos.y+'%';
    const chef=$('#chef');chef.classList.toggle('is-moving',state.moving);chef.classList.toggle('is-working',state.busy);chef.classList.toggle('is-facing-left',state.facing<0);chef.classList.toggle('is-facing-right',state.facing>=0);
    const visibleOrders=state.orders.slice(0,3),ordersKey=visibleOrders.map(o=>o.id).join('-');if(ordersKey!==lastOrdersKey){lastOrdersKey=ordersKey;$('#orders').innerHTML=visibleOrders.map((o,i)=>`<div class="ticket ${i?'next':''}" data-order="${o.id}"><div class="ticket-title">${i?'接著做':o.tutorial?'第一單・免壓力':'現在訂單'}</div><div class="ticket-items">🍔 ${o.items.map(x=>artImg(x)).join('')}</div><div class="patience"><i></i></div></div>`).join('')}$$('#orders .patience i').forEach((bar,i)=>{const p=Math.max(0,visibleOrders[i].patience);bar.style.width=p+'%';bar.style.background=p<35?'#e74c3c':p<65?'#f2b63d':'#66c77a'});
    const plate=$('#assembly .station-item'),plateKey=state.plate.join('-');if(plateKey!==renderedPlate){renderedPlate=plateKey;plate.innerHTML=state.plate.map(x=>artImg(x,'mini-art')).join('')}
    const guide=tutorialTarget();$$('.counter').forEach(x=>{x.classList.toggle('active',x.dataset.station===state.near);x.classList.toggle('guide',x.dataset.station===guide)});
    const action=$('#actionBtn');action.textContent=actionLabel();action.classList.toggle('ready',!!state.near&&!state.busy);action.classList.toggle('waiting',!state.near||state.busy);
    $('#hint').textContent=hintText();
  }
  function tutorialTarget(){if(!state.running||state.served>0||!state.orders[0]?.tutorial)return null;if(state.held==='burger')return 'service';if(state.held==='bun'||state.held==='choppedTomato')return 'assembly';if(state.held==='tomato')return 'board';if($('#board .station-item').dataset.item)return 'board';if(!state.plate.includes('bun'))return 'bun';if(!state.plate.includes('choppedTomato'))return 'tomato';return 'assembly'}
  function actionLabel(){if(state.busy)return '處理中';if(!state.near)return tutorialTarget()?'靠近黃台':'靠近工作台';const n=state.near;if(n==='bun')return state.held?'送去工作台':'拿麵包';if(n==='tomato')return state.held?'送去工作台':'拿番茄';if(n==='meat')return state.held?'送去工作台':'拿肉排';if(n==='board')return state.held==='tomato'?'切番茄':state.held==='choppedTomato'?'送去餐台':!state.held&&$('#board .station-item').dataset.item==='choppedTomato'?'拿番茄':'需要番茄';if(n==='pan')return state.held==='meat'?'煎肉排':state.held==='cookedMeat'?'送去餐台':!state.held&&$('#pan .station-item').dataset.item==='cookedMeat'?'拿肉排':'需要生肉';if(n==='assembly'){if(state.held==='burger')return '送去鈴鐺';if(state.held&&['bun','choppedTomato','cookedMeat'].includes(state.held))return '放上餐台';if(!state.held&&state.plate.includes('bun')&&(state.plate.includes('cookedMeat')||state.plate.includes('choppedTomato')))return '完成漢堡';return '還差材料'}if(n==='service')return state.held==='burger'?'送出訂單':'拿漢堡來';return state.held?'丟棄食材':'沒有食材'}
  function hintText(){const target=tutorialTarget(),names={bun:'麵包箱',tomato:'番茄箱',board:'砧板',assembly:'組裝台',service:'出餐口'};if(target)return state.near===target?`新手引導｜現在按「${actionLabel()}」`:`新手引導｜前往黃色的${names[target]}`;if(!state.near)return state.held?`手上拿著 ${icons[state.held]}｜靠近工作台`:'靠近工作台，大按鈕會自動提示';return `可以按「${actionLabel()}」`}
  function bumpHeld(){const el=$('#held');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
  function bumpStation(id){const el=$('#'+id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),300)}
  function interact(){if(!state.running||state.busy)return;if(!state.near){say(tutorialTarget()?'跟著黃色工作台走！':'再靠近工作台一點');return}const n=state.near;
    if(['bun','tomato','meat'].includes(n)){if(!state.held){state.held=n;bumpStation(n);render();bumpHeld();say('拿到 '+icons[n]+'！')}else say('手上已有食材，先送去工作台');return}
    if(n==='board'){processStation('board','tomato','choppedTomato',700);return}
    if(n==='pan'){processStation('pan','meat','cookedMeat',1000);return}
    if(n==='assembly')assemble();
    if(n==='service')serve();
    if(n==='bin')discard();render();
  }
  function processStation(id,input,output,ms){const station=$('#'+id),item=$('#'+id+' .station-item'),bar=$('#'+id+' .station-progress');if(state.held===input&&!item.dataset.item){state.held=null;state.busy=true;item.dataset.item=input;item.innerHTML=artImg(input,'mini-art');station.classList.remove('is-ready');station.classList.add('processing','is-processing');bumpStation(id);bar.classList.add('show');bar.firstElementChild.style.transition=`width ${ms}ms linear`;requestAnimationFrame(()=>bar.firstElementChild.style.width='100%');say(id==='board'?'快速切番茄！':'肉排滋滋作響！');render();setTimeout(()=>{item.dataset.item=output;item.innerHTML=artImg(output,'mini-art');station.classList.remove('processing','is-processing');station.classList.add('is-ready');bar.classList.remove('show');bar.firstElementChild.style.transition='none';bar.firstElementChild.style.width='0';state.busy=false;bumpStation(id);say('完成！按大按鈕拿起來');render()},ms)}else if(!state.held&&item.dataset.item===output){state.held=output;item.innerHTML='';item.dataset.item='';station.classList.remove('is-ready');bumpStation(id);render();bumpHeld();say('拿到處理好的 '+icons[output]+'！')}else{say(input==='tomato'?'拿番茄來就能切':'拿生肉來就能煎');render()}}
  function assemble(){if(state.held&&['bun','choppedTomato','cookedMeat'].includes(state.held)){if(state.plate.includes(state.held)){say('這份漢堡已有這個材料');return}state.plate.push(state.held);state.held=null;bumpStation('assembly');say('放好了！')}else if(!state.held&&state.plate.length){if(state.plate.includes('bun')&&(state.plate.includes('cookedMeat')||state.plate.includes('choppedTomato'))){state.held='burger';state.heldRecipe=[...state.plate];state.plate=[];bumpStation('assembly');render();bumpHeld();say('漢堡完成，送去鈴鐺！');return}else say('還差一種處理好的配料')}else say('把材料帶到這裡');render()}
  function serveFx(points){const game=$('#game'),from=$('#service').getBoundingClientRect(),to=$('#orders .ticket')?.getBoundingClientRect(),root=game.getBoundingClientRect(),fly=document.createElement('div');fly.className='fly-food';fly.innerHTML='<img src="assets/art/burger-complete.svg" alt="漢堡">';fly.style.left=from.left+from.width/2-root.left+'px';fly.style.top=from.top+from.height/2-root.top+'px';fly.style.setProperty('--to-x',(to?to.left+to.width/2-root.left:root.width/2)+'px');fly.style.setProperty('--to-y',(to?to.top+to.height/2-root.top:0)+'px');game.appendChild(fly);const score=document.createElement('div');score.className='float-score art-score-pop is-active';score.innerHTML=`<img src="assets/art/score-starburst.svg" alt=""><span>+${points}</span>`;score.style.left=from.left-root.left+'px';score.style.top=from.top-root.top+'px';game.appendChild(score);setTimeout(()=>{fly.remove();score.remove()},1100);const success=$('#success');$('#successText').innerHTML=`+${points}${state.combo>1?`　<span class="combo">${state.combo} 連擊！</span>`:''}`;success.classList.remove('show');void success.offsetWidth;success.classList.add('show');const combo=$('#comboBadge');if(state.combo>1){$('#comboText').textContent=state.combo+' 連擊';combo.classList.remove('is-active');void combo.offsetWidth;combo.classList.add('is-active');setTimeout(()=>combo.classList.remove('is-active'),1100)}}
  function serve(){if(state.held!=='burger'){say('先完成漢堡再送餐');return}const need=state.orders[0].items,have=state.heldRecipe||[],ok=need.length===have.length&&need.every(x=>have.includes(x));if(ok){const points=100+Math.round(state.orders[0].patience)+Math.max(0,state.combo)*15;state.score+=points;state.served++;state.combo++;state.held=null;state.heldRecipe=null;state.busy=true;$('#orders .ticket')?.classList.add('leaving');serveFx(points);say(state.combo>1?`${state.combo} 連擊！漂亮！`:'第一單完成！太棒了！');render();setTimeout(()=>{state.orders.shift();addOrder();state.busy=false;render()},280);return}state.combo=0;state.score=Math.max(0,state.score-20);state.held=null;state.heldRecipe=null;say('差一點！看看現在訂單再試一次 -20');render()}
  function discard(){if(state.held){state.held=null;state.heldRecipe=null;state.combo=0;render();say('已清空手上食材')}else say('手上沒有食材')}
  function say(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),1300)}
  function update(dt){if(state.running){let x=state.joy.x+(state.keys.ArrowRight||state.keys.d?1:0)-(state.keys.ArrowLeft||state.keys.a?1:0),y=state.joy.y+(state.keys.ArrowDown||state.keys.s?1:0)-(state.keys.ArrowUp||state.keys.w?1:0);const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}state.moving=len>.08;if(x<-.05)state.facing=-1;else if(x>.05)state.facing=1;state.pos.x=Math.max(15,Math.min(85,state.pos.x+x*31*dt));state.pos.y=Math.max(23,Math.min(90,state.pos.y+y*45*dt));detect();render()}requestAnimationFrame(loop)}
  function loop(now){const dt=Math.min(.03,(now-last)/1000);last=now;update(dt)}
  function detect(){const chef=$('#chef').getBoundingClientRect(),cx=chef.left+chef.width/2,cy=chef.top+chef.height*.65,reach=Math.max(chef.width*1.1,68);let best=null,dist=Infinity;$$('.counter').forEach(el=>{const r=el.getBoundingClientRect(),x=Math.max(r.left,Math.min(cx,r.right)),y=Math.max(r.top,Math.min(cy,r.bottom)),d=Math.hypot(cx-x,cy-y);if(d<reach&&d<dist){dist=d;best=el.dataset.station}});state.near=best}
  function joyMove(e){const r=$('#joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.3,l=Math.hypot(dx,dy)||1,k=Math.min(1,max/l);state.joy={x:dx/max*k,y:dy/max*k};$('#stick').style.transform=`translate(${dx*k}px,${dy*k}px)`}
  $('#joystick').addEventListener('pointerdown',e=>{joyPointer=e.pointerId;$('#joystick').setPointerCapture(e.pointerId);joyMove(e)});$('#joystick').addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});function joyEnd(e){if(e.pointerId!==joyPointer)return;joyPointer=null;state.joy={x:0,y:0};$('#stick').style.transform=''}$('#joystick').addEventListener('pointerup',joyEnd);$('#joystick').addEventListener('pointercancel',joyEnd);
  $('#actionBtn').addEventListener('pointerdown',e=>{e.preventDefault();interact();e.currentTarget.classList.add('pressed')});['pointerup','pointercancel','pointerleave'].forEach(type=>$('#actionBtn').addEventListener(type,e=>e.currentTarget.classList.remove('pressed')));$('#dropBtn').addEventListener('click',discard);$('#startBtn').addEventListener('click',start);$('#retryBtn').addEventListener('click',start);
  addEventListener('keydown',e=>{state.keys[e.key]=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();interact()}if(e.key==='q')discard()});addEventListener('keyup',e=>state.keys[e.key]=false);requestAnimationFrame(loop);
})();
</script>
