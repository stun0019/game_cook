<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>灶腳大亂鬥｜第一關</title>
  <link rel="stylesheet" href="assets/game/stage4.css">
</head>
<body>
  <div id="rotate-screen" aria-live="polite">
    <span class="rotate-icon" aria-hidden="true"></span>
    <strong>請將裝置橫向使用</strong>
    <small>返回橫向後，請按「繼續遊戲」</small>
  </div>

  <main id="game" data-game-state="TITLE">
    <header id="hud">
      <div class="brand">灶腳大亂鬥<small>第一天</small></div>
      <div id="orders" class="orders" aria-live="polite"></div>
      <div class="hud-stats">
        <div class="hud-pill"><img data-ui="hud-star" alt=""><span class="sr-only">分數</span><b id="score">0</b></div>
        <div class="hud-pill"><img data-ui="hud-clock" alt=""><span class="sr-only">剩餘時間</span><b id="time">60</b></div>
        <button id="pause-button" class="icon-button" type="button" aria-label="暫停遊戲"><img data-ui="pause" alt=""><span class="text-fallback">暫停</span></button>
      </div>
    </header>

    <section id="kitchen-safe-area" aria-label="餐廳廚房">
      <div id="u-counter" class="u-counter" aria-hidden="true"></div>
      <button class="station" data-station="bun" type="button" aria-label="麵包備料盒"><img class="station-sprite" alt=""><span>麵包</span></button>
      <button class="station" data-station="tomato" type="button" aria-label="番茄備料盒"><img class="station-sprite" alt=""><span>番茄</span></button>
      <button class="station" data-station="meat" type="button" aria-label="生肉備料盒"><img class="station-sprite" alt=""><span>生肉</span></button>
      <button class="station" data-station="board" type="button" aria-label="砧板"><img class="station-sprite" alt=""><span>砧板</span><i class="progress"><i></i></i></button>
      <button class="station" data-station="pan" type="button" aria-label="煎鍋"><img class="station-sprite" alt=""><span>煎鍋</span><i class="progress"><i></i></i></button>
      <button class="station" data-station="ready-tray" type="button" aria-label="現成食材盤"><img class="station-sprite" alt=""><span>現成食材</span><i class="station-item"></i></button>
      <button class="station" data-station="assembly" type="button" aria-label="組裝台"><img class="station-sprite" alt=""><span>組裝</span><i class="station-item"></i></button>
      <button class="station" data-station="service" type="button" aria-label="出餐口"><img class="station-sprite" alt=""><span>出餐</span></button>
      <button class="station" data-station="disassembly" type="button" aria-label="拆解台"><img class="station-sprite" alt=""><span>拆解</span></button>

      <div id="chef" class="chef" data-direction="s">
        <span class="chef-placeholder" aria-hidden="true"></span>
        <img class="chef-sprite" alt="柴犬主廚">
        <img id="held-item" class="held-item" data-item="none" alt="">
      </div>

      <div id="guide-arrow" aria-hidden="true"><img data-ui="direction-arrow" alt=""></div>
      <div id="hint" role="status">手上已有試吃漢堡，前往出餐口</div>
    </section>

    <div id="controls" aria-label="遊戲控制">
      <div id="joystick" role="button" aria-label="移動主廚" tabindex="0"><i id="stick"></i></div>
      <div class="action-buttons">
        <button id="secondary-action" class="round-action secondary" type="button"><img data-ui="discard" alt=""><span>拆解</span></button>
        <button id="primary-action" class="round-action primary" type="button"><img data-ui="interact" alt=""><span>互動</span></button>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="success-feedback" aria-hidden="true"><b>完成</b><span></span></div>

    <section id="title-screen" class="overlay is-visible" aria-labelledby="title-heading">
      <div class="panel">
        <h1 id="title-heading">灶腳大亂鬥</h1>
        <p><strong>手上已經有試吃漢堡。</strong><br>移動到黃色出餐口，按一次互動；送達後才開始六十秒。</p>
        <div class="quick-guide"><div><b>移動</b><span>控制柴犬主廚</span></div><div><b>黃光</b><span>前往目前目標</span></div><div><b>出餐</b><span>送到右側鈴鐺</span></div></div>
        <button id="start-button" class="menu-button primary" type="button">開始第一單</button>
      </div>
    </section>

    <section id="pause-screen" class="overlay" aria-labelledby="pause-heading">
      <div class="panel pause-panel">
        <h2 id="pause-heading">遊戲暫停</h2>
        <p id="pause-reason">時間、耐心、加工與音訊都已凍結。</p>
        <div class="settings-grid">
          <button id="music-toggle" type="button"><img data-ui="music-on" alt=""><span>音樂</span></button>
          <button id="sound-toggle" type="button"><img data-ui="sound-on" alt=""><span>音效</span></button>
          <button id="vibration-toggle" type="button"><img data-ui="vibration-on" alt=""><span>震動</span></button>
          <button id="motion-toggle" type="button"><img data-ui="motion-on" alt=""><span>動態</span></button>
        </div>
        <button id="resume-button" class="menu-button primary" type="button">繼續遊戲</button>
      </div>
    </section>

    <section id="result-screen" class="overlay" aria-labelledby="result-heading">
      <div class="panel result-panel">
        <img class="result-medal" data-ui="result-medal" alt="">
        <h2 id="result-heading">第一關完成</h2>
        <div id="result-stars" class="result-stars" aria-label="一星"><i></i><i></i><i></i></div>
        <div class="result-grid">
          <div><span>總分</span><b id="result-score">0</b></div>
          <div><span>完成訂單</span><b id="result-served">0</b></div>
          <div><span>最快一單</span><b id="result-fastest">無</b></div>
          <div><span>最高連擊</span><b id="result-combo">0</b></div>
        </div>
        <p id="result-tip">完成一份訂單就算過關。</p>
        <div class="result-actions"><button id="retry-button" class="menu-button primary" type="button">再玩一次</button><button id="next-button" class="menu-button secondary" type="button">前往第二天</button></div>
      </div>
    </section>
  </main>
  <script type="module" src="assets/game/stage4.js"></script>
</body>
</html>
