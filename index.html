<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>灶咖大亂鬥</title>

<style>
:root{
  --ink:#33251f;
  --paper:#fffaf0;
  --cream:#fff3d5;
  --red:#e45a45;
  --orange:#f29a46;
  --gold:#f6c34f;
  --green:#68a96d;
  --yellow:#e9b94f;
  --dark:#132027;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#091116;
  touch-action:none;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
}

#shell{
  position:relative;

  width:min(
    100vw,
    calc(100vh * 16 / 9)
  );

  height:min(
    100vh,
    calc(100vw * 9 / 16)
  );

  max-width:1280px;
  max-height:720px;

  overflow:hidden;

  background:#101820;

  box-shadow:
    0 24px 70px rgba(0,0,0,.55);
}

#game{
  display:block;
  width:100%;
  height:100%;
}

.screen{
  position:absolute;
  inset:0;
}

.hide{
  display:none !important;
}

/* =========================================================
   旋轉提示
========================================================= */

#rotate{
  z-index:99;

  display:none;
  align-items:center;
  justify-content:center;

  background:#101820;
  color:#ffffff;

  text-align:center;
}

@media (orientation:portrait) and (max-width:900px){
  #rotate{
    display:flex;
  }
}

/* =========================================================
   Loading
========================================================= */

#loading{
  z-index:30;

  overflow:hidden;

  color:#ffffff;

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(143,104,255,.26),
      transparent 28%
    ),
    radial-gradient(
      circle at 20% 72%,
      rgba(45,124,255,.17),
      transparent 24%
    ),
    radial-gradient(
      circle at 80% 68%,
      rgba(255,132,38,.13),
      transparent 22%
    ),
    linear-gradient(
      #211a42,
      #15132f 48%,
      #0b0f21
    );
}

.stars{
  position:absolute;
  inset:0;

  opacity:.42;

  background-image:
    radial-gradient(
      #ffffff 1px,
      transparent 1px
    );

  background-size:
    54px 54px;
}

.comet{
  position:absolute;

  width:130px;
  height:4px;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ffc26b
    );

  filter:
    drop-shadow(
      0 0 8px #ffb24f
    );

  transform:
    rotate(-28deg);

  animation:
    comet 5.5s linear infinite;
}

.comet::after{
  content:"";

  position:absolute;
  right:-8px;
  top:-5px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:#ffb85c;
}

.c1{
  top:22%;
  left:72%;
}

.c2{
  top:39%;
  left:18%;

  animation-delay:2s;
}

.c3{
  top:14%;
  left:38%;

  animation-delay:3.3s;
}

@keyframes comet{
  0%{
    opacity:0;

    transform:
      translate(
        120px,
        -70px
      )
      rotate(-28deg);
  }

  18%,
  60%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        -180px,
        130px
      )
      rotate(-28deg);
  }
}

.brand{
  position:absolute;
  left:50%;
  top:42px;
  z-index:5;

  text-align:center;

  transform:
    translateX(-50%);
}

.brand small{
  color:#ffd36d;

  font-size:18px;
  font-weight:1000;

  letter-spacing:.28em;
}

.brand h1{
  margin-top:10px;

  color:#fff7ee;

  font-size:90px;
  font-weight:1000;
  line-height:1;

  letter-spacing:.04em;

  text-shadow:
    0 7px #4a2020,
    -5px 0 #c7462f,
    5px 0 #c7462f,
    0 -5px #c7462f,
    0 5px #c7462f;
}

.globe{
  position:absolute;
  left:50%;
  bottom:-190px;

  width:470px;
  height:470px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 30%,
      #2a75bc,
      #163c75 42%,
      #08132c 76%
    );

  box-shadow:
    0 -8px 70px rgba(90,138,255,.22);

  transform:
    translateX(-50%);
}

.globe::before,
.globe::after{
  content:"";

  position:absolute;

  border-radius:50%;

  background:#3b9d52;
}

.globe::before{
  left:105px;
  top:240px;

  width:190px;
  height:100px;

  transform:
    rotate(-10deg);
}

.globe::after{
  left:235px;
  top:185px;

  width:120px;
  height:70px;

  transform:
    rotate(18deg);
}

/* =========================================================
   Loading 人物群
========================================================= */

.cast{
  position:absolute;
  left:50%;
  bottom:112px;
  z-index:3;

  width:570px;
  height:315px;

  transform:
    translateX(-50%);
}

.char{
  position:absolute;
  bottom:0;

  animation:
    bob 2.6s ease-in-out infinite;
}

.shadow{
  position:absolute;
  left:50%;
  bottom:-8px;

  width:88px;
  height:20px;

  border-radius:50%;

  background:
    rgba(0,0,0,.25);

  transform:
    translateX(-50%);
}

.body{
  position:absolute;
  left:50%;
  bottom:0;

  border:
    4px solid var(--ink);

  border-radius:
    24px 24px 18px 18px;

  background:#fff8ea;

  transform:
    translateX(-50%);
}

.face{
  position:absolute;
  left:50%;

  border:
    4px solid var(--ink);

  border-radius:50%;

  transform:
    translateX(-50%);
}

.hat{
  position:absolute;
  left:50%;

  border:
    4px solid var(--ink);

  border-radius:18px;

  background:#fff8ea;

  transform:
    translateX(-50%);
}

.eye{
  position:absolute;
  top:12px;

  width:4px;
  height:4px;

  border-radius:50%;

  background:var(--ink);
}

/* 左側小廚師 */

.p1{
  left:30px;

  width:115px;
  height:135px;
}

.p1 .body{
  width:75px;
  height:78px;
}

.p1 .face{
  top:29px;

  width:55px;
  height:55px;

  background:#cb7a46;
}

.p1 .hat{
  top:-20px;

  width:60px;
  height:32px;
}

.p1 .eye.l{
  left:44px;
}

.p1 .eye.r{
  right:44px;
}

/* 中央主廚 */

.p2{
  left:145px;

  width:180px;
  height:245px;

  animation-delay:.15s;
}

.p2 .body{
  width:112px;
  height:116px;
}

.p2 .face{
  top:42px;

  width:84px;
  height:84px;

  background:#8f5d35;
}

.p2 .hat{
  top:-28px;

  width:84px;
  height:42px;
}

.p2 .eye.l{
  left:69px;
}

.p2 .eye.r{
  right:69px;
}

.p2::before{
  content:"";

  position:absolute;
  left:50%;
  top:-2px;

  width:108px;
  height:108px;

  clip-path:
    polygon(
      50% 0,
      62% 14%,
      80% 10%,
      74% 29%,
      90% 36%,
      76% 46%,
      82% 64%,
      63% 60%,
      50% 76%,
      37% 60%,
      18% 64%,
      24% 46%,
      10% 36%,
      26% 29%,
      20% 10%,
      38% 14%
    );

  background:#f1cb57;

  transform:
    translateX(-50%);
}

/* 中間小廚師 */

.p3{
  left:285px;

  width:120px;
  height:150px;

  animation-delay:.3s;
}

.p3 .body{
  width:80px;
  height:82px;
}

.p3 .face{
  top:32px;

  width:58px;
  height:58px;

  background:#d28f4f;
}

.p3 .hat{
  top:-20px;

  width:62px;
  height:32px;
}

.p3 .eye.l{
  left:47px;
}

.p3 .eye.r{
  right:47px;
}

/* 持刀廚師 */

.p4{
  left:390px;

  width:130px;
  height:170px;

  animation-delay:.45s;
}

.p4 .body{
  width:86px;
  height:88px;
}

.p4 .face{
  top:35px;

  width:62px;
  height:62px;

  background:#d3834c;
}

.p4 .hat{
  top:-22px;

  width:64px;
  height:34px;
}

.p4 .eye.l{
  left:51px;
}

.p4 .eye.r{
  right:51px;
}

/* 狗角色 */

.dog{
  right:5px;

  width:130px;
  height:182px;

  animation-delay:.2s;
}

.dog .body{
  width:84px;
  height:90px;

  background:#f0cd66;
}

.dog .face{
  top:38px;

  width:68px;
  height:64px;

  background:#c88d4d;
}

.dog .eye.l{
  left:50px;
}

.dog .eye.r{
  right:50px;
}

.dog .hat{
  display:none;
}

@keyframes bob{
  50%{
    transform:
      translateY(-8px);
  }
}

/* =========================================================
   Loading 進度
========================================================= */

.loadbox{
  position:absolute;
  left:50%;
  bottom:28px;
  z-index:6;

  width:720px;

  text-align:center;

  transform:
    translateX(-50%);
}

.loadline{
  display:flex;
  justify-content:space-between;

  margin-bottom:10px;

  font-size:18px;
  font-weight:1000;

  text-shadow:
    0 2px 5px rgba(0,0,0,.55);
}

.track{
  height:18px;

  overflow:hidden;

  border:
    2px solid rgba(255,255,255,.86);

  border-radius:99px;

  background:
    rgba(11,12,29,.54);
}

.bar{
  width:0;
  height:100%;

  background:
    linear-gradient(
      90deg,
      #48a9d8,
      #fbd668,
      #ef7c4b
    );

  transition:
    width .08s;
}

.enter{
  visibility:hidden;
  opacity:0;

  margin-top:18px;
  padding:13px 30px;

  border:
    3px solid #ffffff;

  border-radius:16px;

  background:
    linear-gradient(
      #f9a54c,
      #d85d32
    );

  box-shadow:
    0 8px #7d3322;

  color:#ffffff;

  font-size:22px;
  font-weight:1000;

  cursor:pointer;

  transform:
    translateY(10px);

  transition:.3s;
}

.enter.show{
  visibility:visible;
  opacity:1;

  transform:none;
}

/* =========================================================
   模式選單
========================================================= */

#menu{
  z-index:20;

  display:none;

  color:#ffffff;

  background:
    linear-gradient(
      rgba(7,16,22,.72),
      rgba(7,16,22,.88)
    );

  backdrop-filter:
    blur(7px);
}

.menuhead{
  position:absolute;
  left:5%;
  right:5%;
  top:5%;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}

.menuhead small{
  color:#ffd27f;

  font-weight:900;

  letter-spacing:.25em;
}

.menuhead h2{
  margin-top:5px;

  font-size:40px;
}

.cards{
  position:absolute;
  left:50%;
  top:55%;

  width:1120px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:22px;

  transform:
    translate(-50%,-50%);
}

.card{
  position:relative;

  height:410px;

  padding:24px 22px;

  border:
    1px solid rgba(255,255,255,.26);

  border-radius:28px;

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.22),
      rgba(255,255,255,.07) 48%,
      rgba(255,255,255,.03)
    ),
    rgba(13,26,31,.46);

  box-shadow:
    inset 0 1px rgba(255,255,255,.33),
    0 22px 48px rgba(0,0,0,.32);

  backdrop-filter:
    blur(16px);

  transition:.2s;
}

.card:hover{
  transform:
    translateY(-9px)
    scale(1.02);
}

.card h3{
  font-size:28px;
}

.card p{
  margin-top:10px;

  color:rgba(255,255,255,.77);

  font-size:15px;
  line-height:1.65;
}

.art{
  height:155px;

  margin-bottom:18px;

  border:
    1px solid rgba(255,255,255,.17);

  border-radius:22px;

  background:
    rgba(255,255,255,.07);

  display:flex;
  align-items:center;
  justify-content:center;
}

.modeicon{
  width:104px;
  height:104px;

  border:
    5px solid rgba(255,255,255,.77);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.27),
      rgba(255,255,255,.07)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:48px;
  font-weight:1000;
}

.footer{
  position:absolute;
  left:22px;
  right:22px;
  bottom:22px;
}

.status{
  display:flex;
  justify-content:space-between;

  margin-bottom:12px;

  color:#fff1c6;

  font-size:13px;
  font-weight:900;
}

.modebtn{
  width:100%;
  min-height:48px;

  border:
    1px solid rgba(255,255,255,.26);

  border-radius:13px;

  background:
    linear-gradient(
      rgba(255,255,255,.23),
      rgba(255,255,255,.09)
    );

  color:#ffffff;

  font-weight:1000;

  cursor:pointer;
}

.play{
  background:
    linear-gradient(
      #ef8d51,
      #c85334
    );

  box-shadow:
    0 6px #713222;
}

.locked{
  opacity:.62;
}

.toast{
  position:absolute;
  left:50%;
  bottom:4%;

  padding:10px 18px;

  border:
    1px solid rgba(255,255,255,.24);

  border-radius:12px;

  background:
    rgba(8,16,20,.85);

  color:#ffffff;

  font-weight:900;

  opacity:0;

  transform:
    translate(
      -50%,
      12px
    );

  transition:.2s;
}

.toast.show{
  opacity:1;

  transform:
    translate(
      -50%,
      0
    );
}

/* =========================================================
   暫停／結算
========================================================= */

.overlay{
  z-index:40;

  display:none;
  align-items:center;
  justify-content:center;

  background:
    rgba(8,16,20,.74);

  backdrop-filter:
    blur(5px);
}

.panel{
  width:620px;

  padding:34px;

  border:
    5px solid #503428;

  border-radius:26px;

  background:
    linear-gradient(
      #fff8e7,
      #efd09c
    );

  text-align:center;
}

.panel h2{
  color:#bc4e3a;

  font-size:44px;
}

.panel p{
  margin-top:12px;

  color:#65493a;

  font-weight:800;
}

.row{
  display:flex;
  justify-content:center;

  gap:14px;

  margin-top:24px;
}

.uibtn{
  min-height:56px;

  padding:12px 24px;

  border:0;
  border-radius:14px;

  font-size:19px;
  font-weight:1000;

  cursor:pointer;
}

.primary{
  color:#ffffff;

  background:
    linear-gradient(
      #f68f51,
      #d15a33
    );

  box-shadow:
    0 7px #843520;
}

.secondary{
  color:#4a3327;

  background:
    linear-gradient(
      #ffe7ad,
      #d6b36d
    );

  box-shadow:
    0 7px #80613c;
}

/* =========================================================
   手機操作
========================================================= */

#touch{
  position:absolute;
  inset:0;
  z-index:12;

  display:none;

  pointer-events:none;
}

.joy{
  position:absolute;
  left:1.4%;
  bottom:2.7%;

  width:122px;
  height:122px;

  border:
    4px solid rgba(255,255,255,.8);

  border-radius:50%;

  background:
    rgba(20,31,36,.44);

  pointer-events:auto;
}

.stick{
  position:absolute;
  left:50%;
  top:50%;

  width:56px;
  height:56px;

  border:
    4px solid #4a3025;

  border-radius:50%;

  background:
    linear-gradient(
      #ffe4a8,
      #d89b56
    );

  transform:
    translate(-50%,-50%);
}

.actions{
  position:absolute;
  right:1.3%;
  bottom:3.2%;

  display:flex;
  align-items:flex-end;

  gap:12px;

  pointer-events:auto;
}

.act{
  display:flex;
  align-items:center;
  justify-content:center;

  border:
    4px solid rgba(255,255,255,.86);

  border-radius:50%;

  font-weight:1000;
}

.discard{
  width:66px;
  height:66px;

  background:
    linear-gradient(
      #ffe3a6,
      #c89654
    );

  box-shadow:
    0 7px #70502f;
}

.interact{
  width:94px;
  height:94px;

  background:
    linear-gradient(
      #f47a56,
      #c84233
    );

  box-shadow:
    0 8px #7f2c25;

  color:#ffffff;

  font-size:19px;
}

@media (pointer:coarse){
  #touch.on{
    display:block;
  }
}
</style>
</head>

<body>

<main id="shell">

  <canvas
    id="game"
    width="1280"
    height="720"
  ></canvas>

  <section
    id="rotate"
    class="screen"
  >
    <div>
      <h2>請將手機轉為橫向</h2>
      <p>橫向模式可獲得最佳體驗</p>
    </div>
  </section>

  <section
    id="loading"
    class="screen"
  >
    <div class="stars"></div>

    <i class="comet c1"></i>
    <i class="comet c2"></i>
    <i class="comet c3"></i>

    <div class="brand">
      <small>
        サニーポーカフェ
      </small>

      <h1>
        キッチン大騒動
      </h1>
    </div>

    <div class="globe"></div>

    <div class="cast">

      <div class="char p1">
        <i class="shadow"></i>
        <i class="hat"></i>
        <i class="body"></i>
        <i class="face"></i>
        <i class="eye l"></i>
        <i class="eye r"></i>
      </div>

      <div class="char p2">
        <i class="shadow"></i>
        <i class="hat"></i>
        <i class="body"></i>
        <i class="face"></i>
        <i class="eye l"></i>
        <i class="eye r"></i>
      </div>

      <div class="char p3">
        <i class="shadow"></i>
        <i class="hat"></i>
        <i class="body"></i>
        <i class="face"></i>
        <i class="eye l"></i>
        <i class="eye r"></i>
      </div>

      <div class="char p4">
        <i class="shadow"></i>
        <i class="hat"></i>
        <i class="body"></i>
        <i class="face"></i>
        <i class="eye l"></i>
        <i class="eye r"></i>
      </div>

      <div class="char dog">
        <i class="shadow"></i>
        <i class="body"></i>
        <i class="face"></i>
        <i class="eye l"></i>
        <i class="eye r"></i>
      </div>

    </div>

    <div class="loadbox">

      <div class="loadline">
        <span id="loadmsg">
          食材を確認しています
        </span>

        <span id="loadnum">
          0%
        </span>
      </div>

      <div class="track">
        <div
          id="loadbar"
          class="bar"
        ></div>
      </div>

      <button
        id="enter"
        class="enter"
      >
        メニューへ
      </button>

    </div>
  </section>

  <section
    id="menu"
    class="screen"
  >
    <div class="menuhead">
      <div>
        <small>
          CHOOSE YOUR MODE
        </small>

        <h2>
          選擇營業模式
        </h2>
      </div>
    </div>

    <div class="cards">

      <article class="card">

        <div class="art">
          <div class="modeicon">
            1-1
          </div>
        </div>

        <h3>
          故事模式
        </h3>

        <p>
          經營咖啡廳並完成關卡目標，
          逐步解鎖新餐點與店面。
        </p>

        <div class="footer">

          <div class="status">
            <span>目前進度</span>
            <span>1-1</span>
          </div>

          <button
            id="story"
            class="modebtn play"
          >
            進入故事
          </button>

        </div>
      </article>

      <article class="card">

        <div class="art">
          <div class="modeicon">
            2P
          </div>
        </div>

        <h3>
          連線模式
        </h3>

        <p>
          與其他玩家組隊合作，
          一起完成高壓廚房挑戰。
        </p>

        <div class="footer">

</main>

<script>
(() => {
  "use strict";

  const canvas =
    document.getElementById("game");

  const ctx =
    canvas.getContext("2d");

  const W = 1280;
  const H = 720;
  const HUD = 132;
  const TILE = 96;

  const menu =
    document.getElementById("menu");

  const loading =
    document.getElementById("loading");

  const pause =
    document.getElementById("pause");

  const result =
    document.getElementById("result");

  const touch =
    document.getElementById("touch");

  const C = {
    ink:"#33251f",
    floor:"#d7b777",
    line:"#b48d51",
    top:"#ef9b4a",
    front:"#af5d35",
    inset:"#81432f",
    paper:"#fffaf0",
    red:"#e45b45",
    green:"#68a96d",
    yellow:"#e9b94f",
    gold:"#f5bf4c",
    dark:"#1d3037"
  };

  const tiles = [];

  for(
    let tileX = 96;
    tileX <= 1088;
    tileX += TILE
  ){
    tiles.push({
      x:tileX,
      y:HUD
    });
  }

  for(
    let tileY = HUD + TILE;
    tileY <= 420;
    tileY += TILE
  ){
    tiles.push(
      {
        x:0,
        y:tileY
      },
      {
        x:1184,
        y:tileY
      }
    );
  }

  for(
    let tileX = 400;
    tileX <= 784;
    tileX += TILE
  ){
    tiles.push({
      x:tileX,
      y:552
    });
  }

  const stations = [
    [
      "bun",
      "麵包",
      112,
      140,
      148,
      258
    ],
    [
      "lettuce",
      "生菜",
      208,
      140,
      244,
      258
    ],
    [
      "meat",
      "肉排",
      304,
      140,
      340,
      258
    ],
    [
      "board",
      "砧板",
      400,
      140,
      436,
      258
    ],
    [
      "pan",
      "煎台",
      688,
      140,
      724,
      258
    ],
    [
      "drink",
      "飲料",
      784,
      140,
      820,
      258
    ],
    [
      "plate",
      "盤子",
      880,
      140,
      916,
      258
    ],
    [
      "assembly",
      "組裝",
      12,
      330,
      120,
      366
    ],
    [
      "serve",
      "出餐",
      1196,
      330,
      1160,
      366
    ],
    [
      "trash",
      "丟棄",
      604,
      560,
      640,
      520
    ]
  ].map(item => ({
    id:item[0],
    label:item[1],

    visualX:item[2],
    visualY:item[3],

    interactionX:item[4],
    interactionY:item[5]
  }));

  const recipes = [
    {
      name:"經典漢堡",
      result:"burger",

      ingredients:[
        "bun",
        "cooked"
      ]
    },
    {
      name:"生菜漢堡",
      result:"lettuceBurger",

      ingredients:[
        "bun",
        "lettuce",
        "cooked"
      ]
    },
    {
      name:"冰飲",
      result:"drink",

      ingredients:[
        "drink"
      ]
    }
  ];

  const state = {
    running:false,
    paused:false,

    time:75,

    score:0,
    served:0,

    combo:0,
    maxCombo:0,

    held:null,

    panState:"empty",
    panTimer:0,

    assembly:[],

    orders:[],
    orderSpawnTimer:0,

    chef:{
      x:640,
      y:375
    },

    keys:{},

    joystick:{
      x:0,
      y:0
    },

    nearestStation:null,

    message:
      "依照訂單開始準備餐點",

    messageTimer:0,

    lastFrame:
      performance.now()
  };

  function roundedRect(
    x,
    y,
    width,
    height,
    radius,
    fill,
    stroke,
    lineWidth = 1
  ){
    ctx.beginPath();

    ctx.roundRect(
      x,
      y,
      width,
      height,
      radius
    );

    if(fill){
      ctx.fillStyle =
        fill;

      ctx.fill();
    }

    if(stroke){
      ctx.strokeStyle =
        stroke;

      ctx.lineWidth =
        lineWidth;

      ctx.stroke();
    }
  }

  function drawText(
    content,
    x,
    y,
    size,
    color,
    align = "left",
    weight = 700
  ){
    ctx.font =
      `${weight} ${size}px Microsoft JhengHei`;

    ctx.fillStyle =
      color;

    ctx.textAlign =
      align;

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      content,
      x,
      y
    );
  }

  function drawIcon(
    type,
    x,
    y,
    scale = .55
  ){
    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.scale(
      scale,
      scale
    );

    ctx.strokeStyle =
      C.ink;

    ctx.lineWidth =
      4;

    ctx.lineJoin =
      "round";

    if(type === "bun"){
      roundedRect(
        -28,
        -17,
        56,
        34,
        14,
        "#e9ad56",
        C.ink,
        4
      );
    }

    else if(type === "lettuce"){
      ctx.fillStyle =
        "#6fac63";

      ctx.beginPath();

      ctx.moveTo(
        -25,
        11
      );

      ctx.bezierCurveTo(
        -22,
        -18,
        -8,
        -18,
        0,
        -29
      );

      ctx.bezierCurveTo(
        10,
        -17,
        23,
        -18,
        27,
        9
      );

      ctx.bezierCurveTo(
        12,
        25,
        -12,
        25,
        -25,
        11
      );

      ctx.fill();
      ctx.stroke();
    }

    else if(
      type === "meat" ||
      type === "cooked"
    ){
      ctx.fillStyle =
        type === "meat"
          ? "#d7554e"
          : "#80503b";

      ctx.beginPath();

      ctx.ellipse(
        0,
        0,
        29,
        20,
        -.18,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();
    }

    else if(type === "board"){
      roundedRect(
        -28,
        -21,
        56,
        42,
        7,
        "#d99b56",
        C.ink,
        4
      );
    }

    else if(type === "pan"){
      ctx.beginPath();

      ctx.arc(
        -5,
        -2,
        22,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#2b3b40";

      ctx.fill();
      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(
        14,
        12
      );

      ctx.lineTo(
        35,
        29
      );

      ctx.lineWidth =
        8;

      ctx.stroke();
    }

    else if(type === "drink"){
      ctx.beginPath();

      ctx.moveTo(
        -17,
        -23
      );

      ctx.lineTo(
        17,
        -23
      );

      ctx.lineTo(
        12,
        23
      );

      ctx.lineTo(
        -12,
        23
      );

      ctx.closePath();

      ctx.fillStyle =
        "#e45745";

      ctx.fill();
      ctx.stroke();
    }

    else if(
      type === "plate" ||
      type === "assembly"
    ){
      ctx.beginPath();

      ctx.ellipse(
        0,
        3,
        28,
        17,
        0,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#f8f3e7";

      ctx.fill();
      ctx.stroke();
    }

    else if(type === "serve"){
      ctx.beginPath();

      ctx.moveTo(
        -24,
        13
      );

      ctx.quadraticCurveTo(
        -18,
        -23,
        0,
        -26
      );

      ctx.quadraticCurveTo(
        18,
        -23,
        24,
        13
      );

      ctx.closePath();

      ctx.fillStyle =
        "#f3bd40";

      ctx.fill();
      ctx.stroke();
    }

    else if(type === "trash"){
      roundedRect(
        -19,
        -17,
        38,
        39,
        4,
        "#748789",
        C.ink,
        4
      );
    }

    else if(
      type === "burger" ||
      type === "lettuceBurger"
    ){
      roundedRect(
        -27,
        -23,
        54,
        19,
        11,
        "#e9ad56",
        C.ink,
        4
      );

      if(type === "lettuceBurger"){
        ctx.fillStyle =
          "#6fac63";

        ctx.fillRect(
          -24,
          -3,
          48,
          8
        );
      }

      ctx.fillStyle =
        "#80503b";

      ctx.fillRect(
        -23,
        5,
        46,
        10
      );

      ctx.strokeRect(
        -23,
        5,
        46,
        10
      );

      roundedRect(
        -26,
        15,
        52,
        17,
        8,
        "#d89140",
        C.ink,
        4
      );
    }

    ctx.restore();
  }

  function drawBackground(){
    ctx.fillStyle =
      C.floor;

    ctx.fillRect(
      0,
      HUD,
      W,
      H - HUD
    );

    ctx.strokeStyle =
      C.line;

    ctx.globalAlpha =
      .28;

    for(
      let gridX = 0;
      gridX <= W;
      gridX += 64
    ){
      ctx.beginPath();

      ctx.moveTo(
        gridX,
        HUD
      );

      ctx.lineTo(
        gridX,
        H
      );

      ctx.stroke();
    }

    for(
      let gridY = HUD;
      gridY <= H;
      gridY += 64
    ){
      ctx.beginPath();

      ctx.moveTo(
        0,
        gridY
      );

      ctx.lineTo(
        W,
        gridY
      );

      ctx.stroke();
    }

    ctx.globalAlpha =
      1;
  }

  function drawCounter(
    tile
  ){
    roundedRect(
      tile.x + 7,
      tile.y + 12,
      TILE - 3,
      TILE - 2,
      14,
      "rgba(0,0,0,.2)"
    );

    roundedRect(
      tile.x,
      tile.y + 22,
      TILE,
      TILE - 22,
      13,
      C.front,
      C.ink,
      5
    );

    roundedRect(
      tile.x + 8,
      tile.y + 32,
      TILE - 16,
      TILE - 42,
      8,
      C.inset
    );

    roundedRect(
      tile.x,
      tile.y,
      TILE,
      38,
      14,
      C.top,
      C.ink,
      5
    );

    roundedRect(
      tile.x + 8,
      tile.y + 7,
      TILE - 16,
      11,
      6,
      "#ffbd6a"
    );
  }

  function drawStation(
    station
  ){
    const isNear =
      state.nearestStation ===
      station.id;

    if(isNear){
      ctx.save();

      ctx.shadowColor =
        "#ffd852";

      ctx.shadowBlur =
        24;

      roundedRect(
        station.visualX - 5,
        station.visualY - 5,
        82,
        74,
        14,
        "#ffe38d"
      );

      ctx.restore();
    }

    roundedRect(
      station.visualX,
      station.visualY,
      72,
      64,
      12,
      "#f8dfaa",
      C.ink,
      4
    );

    roundedRect(
      station.visualX + 7,
      station.visualY + 6,
      58,
      46,
      9,
      "#fff4d4"
    );

    drawIcon(
      station.id,
      station.visualX + 36,
      station.visualY + 25
    );

    drawText(
      station.label,
      station.visualX + 36,
      station.visualY + 51,
      13,
      C.dark,
      "center",
      1000
    );
  }

  function drawChef(){
    const chefX =
      state.chef.x;

    const chefY =
      state.chef.y;

    ctx.save();

    ctx.translate(
      chefX,
      chefY
    );

    ctx.fillStyle =
      "rgba(0,0,0,.22)";

    ctx.beginPath();

    ctx.ellipse(
      0,
      35,
      31,
      10,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    roundedRect(
      -28,
      -15,
      56,
      58,
      17,
      "#fff8e9",
      C.ink,
      4
    );

    ctx.beginPath();

    ctx.arc(
      0,
      -18,
      25,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#c97844";

    ctx.fill();
    ctx.stroke();

    roundedRect(
      -31,
      -56,
      62,
      31,
      13,
      "#fff8e9",
      C.ink,
      4
    );

    ctx.fillStyle =
      C.red;

    ctx.fillRect(
      -4,
      -2,
      8,
      40
    );

    if(state.held){
      drawIcon(
        state.held,
        38,
        1,
        .62
      );
    }

    ctx.restore();
  }

  function patienceColor(
    value
  ){
    if(value <= 34){
      return C.red;
    }

    if(value <= 69){
      return C.yellow;
    }

    return C.green;
  }

  function drawTicket(
    order,
    x
  ){
    roundedRect(
      x,
      0,
      176,
      116,
      0,
      C.paper,
      C.ink,
      4
    );

    drawIcon(
      order.result,
      x + 88,
      34,
      .65
    );

    const spacing =
      36;

    const totalWidth =
      (
        order.ingredients.length - 1
      ) *
      spacing;

    const startX =
      x +
      88 -
      totalWidth / 2;

    order.ingredients.forEach(
      (
        ingredient,
        index
      ) => {
        drawIcon(
          ingredient,
          startX +
          index *
          spacing,
          77,
          .4
        );
      }
    );

    ctx.fillStyle =
      "#ddcfad";

    ctx.fillRect(
      x + 14,
      99,
      148,
      9
    );

    ctx.fillStyle =
      patienceColor(
        order.patience
      );

    ctx.fillRect(
      x + 14,
      99,
      148 *
      Math.max(
        0,
        order.patience
      ) /
      100,
      9
    );
  }

  function drawHud(){
    ctx.fillStyle =
      "#fff6df";

    ctx.fillRect(
      0,
      0,
      W,
      HUD
    );

    ctx.fillStyle =
      C.dark;

    ctx.fillRect(
      0,
      HUD - 5,
      W,
      5
    );

    const visibleOrders =
      state.orders.slice(
        0,
        5
      );

    const ticketWidth =
      176;

    const gap =
      8;

    const totalWidth =
      visibleOrders.length *
      ticketWidth +
      (
        visibleOrders.length - 1
      ) *
      gap;

    const startX =
      (
        W -
        totalWidth
      ) /
      2;

    visibleOrders.forEach(
      (
        order,
        index
      ) => {
        drawTicket(
          order,
          startX +
          index *
          (
            ticketWidth +
            gap
          )
        );
      }
    );

    roundedRect(
      18,
      18,
      100,
      76,
      18,
      "#fffaf0",
      C.ink,
      4
    );

    drawText(
      "分數",
      68,
      38,
      15,
      "#765444",
      "center",
      900
    );

    drawText(
      String(
        state.score
      ),
      68,
      68,
      27,
      C.dark,
      "center",
      1000
    );

    roundedRect(
      W - 118,
      18,
      100,
      76,
      18,
      "#fffaf0",
      C.ink,
      4
    );

    drawText(
      "時間",
      W - 68,
      38,
      15,
      "#765444",
      "center",
      900
    );

    drawText(
      String(
        Math.ceil(
          state.time
        )
      ),
      W - 68,
      68,
      29,
      C.dark,
      "center",
      1000
    );
  }

  function render(){
    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    drawBackground();

    tiles.forEach(
      drawCounter
    );

    stations.forEach(
      drawStation
    );

    drawChef();
    drawHud();

    roundedRect(
      430,
      656,
      420,
      46,
      13,
      "#fffaf0",
      C.ink,
      4
    );

    drawText(
      state.message,
      640,
      679,
      16,
      C.dark,
      "center",
      1000
    );
  }

  function addOrder(){
    const recipe =
      recipes[
        Math.floor(
          Math.random() *
          recipes.length
        )
      ];

    state.orders.push({
      ...recipe,
      patience:100
    });
  }

  function setMessage(
    text,
    duration = 1.5
  ){
    state.message =
      text;

    state.messageTimer =
      duration;
  }

  function getNearestStation(){
    let nearest =
      null;

    let nearestDistance =
      Infinity;

    stations.forEach(station => {
      const distance =
        Math.hypot(
          state.chef.x -
          station.interactionX,

          state.chef.y -
          station.interactionY
        );

      if(distance < nearestDistance){
        nearestDistance =
          distance;

        nearest =
          station;
      }
    });

    return nearestDistance <= 72
      ? nearest
      : null;
  }

  function interact(){
    if(
      !state.running ||
      state.paused
    ){
      return;
    }

    const station =
      getNearestStation();

    if(!station){
      setMessage(
        "請再靠近工作台"
      );

      return;
    }

    if(
      [
        "bun",
        "lettuce",
        "meat",
        "drink"
      ].includes(station.id)
    ){
      if(state.held){
        setMessage(
          "手上已經有物品"
        );

        return;
      }

      state.held =
        station.id;

      setMessage(
        `已拿取${station.label}`
      );

      return;
    }

    if(station.id === "pan"){
      if(
        state.held === "meat" &&
        state.panState === "empty"
      ){
        state.held =
          null;

        state.panState =
          "cooking";

        state.panTimer =
          3;

        setMessage(
          "肉排開始烹調"
        );
      }

      else if(
        state.panState === "done" &&
        !state.held
      ){
        state.held =
          "cooked";

        state.panState =
          "empty";

        setMessage(
          "已拿起熟肉排"
        );
      }

      else{
        setMessage(
          state.panState === "cooking"
            ? "肉排仍在烹調"
            : "需要先放入生肉排"
        );
      }

      return;
    }

    if(station.id === "assembly"){
      if(
        ![
          "bun",
          "lettuce",
          "cooked"
        ].includes(state.held)
      ){
        setMessage(
          "請放入可組裝食材"
        );

        return;
      }

      state.assembly.push(
        state.held
      );

      state.held =
        null;

      const ingredientSet =
        new Set(
          state.assembly
        );

      if(
        ingredientSet.has("bun") &&
        ingredientSet.has("cooked")
      ){
        state.held =
          ingredientSet.has("lettuce")
            ? "lettuceBurger"
            : "burger";

        state.assembly =
          [];

        setMessage(
          "漢堡組裝完成"
        );
      }
      else{
        setMessage(
          "食材已放上組裝台"
        );
      }

      return;
    }

    if(station.id === "serve"){
      const currentOrder =
        state.orders[0];

      if(
        currentOrder &&
        state.held ===
        currentOrder.result
      ){
        const earnedScore =
          Math.round(
            140 +
            currentOrder.patience +
            state.combo * 25
          );

        state.score +=
          earnedScore;

        state.served +=
          1;

        state.combo +=
          1;

        state.maxCombo =
          Math.max(
            state.maxCombo,
            state.combo
          );

        state.held =
          null;

        state.orders.shift();

        addOrder();

        setMessage(
          `出餐成功 +${earnedScore}`
        );
      }
      else{
        state.combo =
          0;

        state.score =
          Math.max(
            0,
            state.score - 40
          );

        setMessage(
          "餐點與目前訂單不符"
        );
      }

      return;
    }

    if(station.id === "trash"){
      discard();
    }
  }

  function discard(){
    if(
      state.held ||
      state.assembly.length
    ){
      state.held =
        null;

      state.assembly =
        [];

      setMessage(
        "已丟棄目前內容"
      );
    }
    else{
      setMessage(
        "目前沒有可丟棄的內容"
      );
    }
  }

  function startGame(){
    Object.assign(
      state,
      {
        running:true,
        paused:false,

        time:75,

        score:0,
        served:0,

        combo:0,
        maxCombo:0,

        held:null,

        panState:"empty",
        panTimer:0,

        assembly:[],

        orders:[],
        orderSpawnTimer:0,

        chef:{
          x:640,
          y:375
        },

        nearestStation:null,

        message:
          "依照訂單開始準備餐點",

        messageTimer:0,

        lastFrame:
          performance.now()
      }
    );

    menu.style.display =
      "none";

    result.style.display =
      "none";

    pause.style.display =
      "none";

    addOrder();
    addOrder();
    addOrder();

    touch.classList.add(
      "on"
    );

    requestAnimationFrame(
      gameLoop
    );
  }

  function update(
    deltaTime
  ){
    let movementX =
      state.joystick.x;

    let movementY =
      state.joystick.y;

    if(
      state.keys.ArrowLeft ||
      state.keys.a
    ){
      movementX -=
        1;
    }

    if(
      state.keys.ArrowRight ||
      state.keys.d
    ){
      movementX +=
        1;
    }

    if(
      state.keys.ArrowUp ||
      state.keys.w
    ){
      movementY -=
        1;
    }

    if(
      state.keys.ArrowDown ||
      state.keys.s
    ){
      movementY +=
        1;
    }

    const movementLength =
      Math.hypot(
        movementX,
        movementY
      );

    if(movementLength > 1){
      movementX /=
        movementLength;

      movementY /=
        movementLength;
    }

    state.chef.x =
      Math.max(
        110,
        Math.min(
          1170,
          state.chef.x +
          movementX *
          250 *
          deltaTime
        )
      );

    state.chef.y =
      Math.max(
        250,
        Math.min(
          535,
          state.chef.y +
          movementY *
          250 *
          deltaTime
        )
      );

    state.nearestStation =
      getNearestStation()?.id ||
      null;

    state.time -=
      deltaTime;

    state.orderSpawnTimer +=
      deltaTime;

    state.orders.forEach(
      (
        order,
        index
      ) => {
        order.patience -=
          deltaTime *
          (
            index === 0
              ? 4.1
              : 2
          );
      }
    );

    if(
      state.orders[0]
        ?.patience <= 0
    ){
      state.orders.shift();

      state.score =
        Math.max(
          0,
          state.score - 60
        );

      addOrder();

      setMessage(
        "客人等不及離開了"
      );
    }

    if(
      state.orderSpawnTimer >= 9 &&
      state.orders.length < 5
    ){
      state.orderSpawnTimer =
        0;

      addOrder();
    }

    if(
      state.panState === "cooking"
    ){
      state.panTimer -=
        deltaTime;

      if(state.panTimer <= 0){
        state.panState =
          "done";

        state.panTimer =
          0;

        setMessage(
          "肉排烹調完成"
        );
      }
    }

    if(state.messageTimer > 0){
      state.messageTimer -=
        deltaTime;

      if(state.messageTimer <= 0){
        state.message =
          state.held
            ? "前往下一個工作台繼續處理"
            : "依照訂單拿取需要的食材";
      }
    }
  }

  function endGame(){
    state.running =
      false;

    touch.classList.remove(
      "on"
    );

    document
      .getElementById(
        "resultTitle"
      )
      .textContent =
        state.score >= 1000
          ? "今日營業成功"
          : "營業結束";

    document
      .getElementById(
        "resultText"
      )
      .textContent =
        `總分 ${state.score}｜完成訂單 ${state.served}｜最高連擊 ${state.maxCombo}`;

    result.style.display =
      "flex";
  }

  function gameLoop(
    currentTime
  ){
    if(!state.running){
      return;
    }

    const deltaTime =
      Math.min(
        .033,
        (
          currentTime -
          state.lastFrame
        ) /
        1000
      );

    state.lastFrame =
      currentTime;

    if(!state.paused){
      update(
        deltaTime
      );

      if(state.time <= 0){
        state.time =
          0;

        endGame();
        render();

        return;
      }
    }

    render();

    requestAnimationFrame(
      gameLoop
    );
  }

  window.addEventListener(
    "keydown",
    event => {
      state.keys[event.key] =
        true;

      if(
        [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          " ",
          "e",
          "E",
          "q",
          "Q"
        ].includes(event.key)
      ){
        event.preventDefault();
      }

      if(
        (
          event.key === "e" ||
          event.key === "E" ||
          event.key === " "
        ) &&
        !event.repeat
      ){
        interact();
      }

      if(
        (
          event.key === "q" ||
          event.key === "Q"
        ) &&
        !event.repeat
      ){
        discard();
      }

      if(
        event.key === "Escape" &&
        state.running &&
        !state.paused
      ){
        state.paused =
          true;

        pause.style.display =
          "flex";
      }
    }
  );

  window.addEventListener(
    "keyup",
    event => {
      state.keys[event.key] =
        false;
    }
  );

  const joystick =
    document.getElementById("joy");

  const joystickStick =
    document.getElementById("stick");

  let joystickPointer =
    null;

  function moveJoystick(
    event
  ){
    const rect =
      joystick.getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;

    const maximum =
      rect.width * .28;

    let deltaX =
      event.clientX -
      centerX;

    let deltaY =
      event.clientY -
      centerY;

    const distance =
      Math.hypot(
        deltaX,
        deltaY
      );

    if(distance > maximum){
      deltaX =
        deltaX /
        distance *
        maximum;

      deltaY =
        deltaY /
        distance *
        maximum;
    }

    state.joystick.x =
      deltaX /
      maximum;

    state.joystick.y =
      deltaY /
      maximum;

    joystickStick.style.transform =
      `translate(
        calc(-50% + ${deltaX}px),
        calc(-50% + ${deltaY}px)
      )`;
  }

  function resetJoystick(){
    joystickPointer =
      null;

    state.joystick = {
      x:0,
      y:0
    };

    joystickStick.style.transform =
      "translate(-50%,-50%)";
  }

  joystick.addEventListener(
    "pointerdown",
    event => {
      joystickPointer =
        event.pointerId;

      joystick.setPointerCapture(
        joystickPointer
      );

      moveJoystick(
        event
      );
    }
  );

  joystick.addEventListener(
    "pointermove",
    event => {
      if(
        event.pointerId ===
        joystickPointer
      ){
        moveJoystick(
          event
        );
      }
    }
  );

  joystick.addEventListener(
    "pointerup",
    resetJoystick
  );

  joystick.addEventListener(
    "pointercancel",
    resetJoystick
  );

  document
    .getElementById(
      "interact"
    )
    .addEventListener(
      "pointerdown",
      event => {
        event.preventDefault();

        interact();
      }
    );

  document
    .getElementById(
      "discard"
    )
    .addEventListener(
      "pointerdown",
      event => {
        event.preventDefault();

        discard();
      }
    );

  document
    .getElementById(
      "story"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .querySelectorAll(
      ".locked"
    )
    .forEach(button => {
      button.addEventListener(
        "click",
        () => {
          const toast =
            document.getElementById(
              "toast"
            );

          toast.textContent =
            button.dataset.msg;

          toast.classList.add(
            "show"
          );

          clearTimeout(
            toast.timer
          );

          toast.timer =
            setTimeout(() => {
              toast.classList.remove(
                "show"
              );
            },1600);
        }
      );
    });

  document
    .getElementById(
      "resume"
    )
    .addEventListener(
      "click",
      () => {
        state.paused =
          false;

        pause.style.display =
          "none";

        state.lastFrame =
          performance.now();
      }
    );

  document
    .getElementById(
      "back"
    )
    .addEventListener(
      "click",
      () => {
        state.running =
          false;

        touch.classList.remove(
          "on"
        );

        pause.style.display =
          "none";

        menu.style.display =
          "block";
      }
    );

  document
    .getElementById(
      "retry"
    )
    .addEventListener(
      "click",
      startGame
    );

  document
    .getElementById(
      "resultBack"
    )
    .addEventListener(
      "click",
      () => {
        state.running =
          false;

        result.style.display =
          "none";

        menu.style.display =
          "block";
      }
    );

  let loadingReady =
    false;

  async function boot(){
    const loadingSteps = [
      "食材を確認しています",
      "調理器具を準備しています",
      "キッチンを整えています",
      "注文票を並べています",
      "まもなく開店です"
    ];

    for(
      let progress = 0;
      progress <= 100;
      progress += 2
    ){
      document
        .getElementById(
          "loadbar"
        )
        .style
        .width =
          `${progress}%`;

      document
        .getElementById(
          "loadnum"
        )
        .textContent =
          `${progress}%`;

      document
        .getElementById(
          "loadmsg"
        )
        .textContent =
          loadingSteps[
            Math.min(
              4,
              Math.floor(
                progress / 21
              )
            )
          ];

      await new Promise(resolve => {
        setTimeout(
          resolve,
          progress < 70
            ? 24
            : 34
        );
      });
    }

    loadingReady =
      true;

    document
      .getElementById(
        "loadmsg"
      )
      .textContent =
        "準備完了";

    document
      .getElementById(
        "enter"
      )
      .classList
      .add(
        "show"
      );
  }

  document
    .getElementById(
      "enter"
    )
    .addEventListener(
      "click",
      () => {
        if(!loadingReady){
          return;
        }

        loading.style.display =
          "none";

        menu.style.display =
          "block";
      }
    );

  boot();
  render();
})();
</script>

</body>
</html>
